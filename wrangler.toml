# NEON DRIFT · Cloudflare Pages 配置
#
# 这个站点是纯静态：不需要 build 命令，输出目录就是仓库根目录。
# 生产环境的 D1 绑定请在 Dashboard 里配置（Settings → Functions →
# D1 database bindings → Variable name: DB），绑定后必须重新部署一次才生效。
#
# 下面这段仅用于本地 `wrangler pages dev` 调试；如用 Git 连接部署，
# 保持注释即可，避免和 Dashboard 绑定重复。

name = "neon-drift"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."

# 本地调试时解开注释，把 database_id 换成 `wrangler d1 create` 输出的 ID：
# [[d1_databases]]
# binding = "DB"
# database_name = "neon-drift-scores"
# database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
