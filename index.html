<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NEON DRIFT · 霓虹漂游</title>
<style>
  html,body{margin:0;height:100%;background:#03040b;overflow:hidden;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#dff8ff;
    /* 移动端基础防护：
       这里只能用 manipulation，不能写 touch-action:none ——
       touch-action 的有效值是从命中元素到滚动容器的"祖先链交集"，
       body 一旦是 none，内部 .panel 的 pan-y 会被整个屏蔽，
       十页操作说明 / 窄屏三选一就再也滚不动了。
       页面滚动由 overflow:hidden + overscroll-behavior + document 级
       touchmove 兜底（放行真正可滚动的面板）来拦，不靠 body 的 touch-action。
       user-select/touch-callout 禁长按选中与 iOS 长按菜单；
       text-size-adjust 防微信横屏自动放大字号 */
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;-webkit-text-size-adjust:100%}
  html,body{height:100dvh}
  #game{position:fixed;left:0;top:0;touch-action:none;user-select:none;-webkit-user-select:none;display:block;
    transform-origin:50% 50%;will-change:transform}
  /* 所有可交互元素同样禁止长按菜单/选中，避免微信里按按钮弹出系统菜单 */
  #ui,#rot,button,.panel,.card{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent}

  /* ---------- 覆盖层：环境光晕 + 扫描线，让 UI 与画面同处一个视觉空间 ---------- */
  #ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
    background:
      radial-gradient(ellipse 70% 55% at 50% 40%, rgba(0,190,255,.13), transparent 70%),
      radial-gradient(ellipse 50% 40% at 15% 85%, rgba(160,0,255,.11), transparent 70%),
      radial-gradient(ellipse 50% 40% at 85% 15%, rgba(0,255,190,.09), transparent 70%);}
  /* 缓慢漂移的透视网格 + 横向扫描光带：让静态菜单有"活着的"底噪 */
  #ui::before{content:'';position:absolute;inset:-60%;pointer-events:none;opacity:.30;
    background-image:
      linear-gradient(rgba(70,190,255,.14) 1px, transparent 1px),
      linear-gradient(90deg, rgba(70,190,255,.14) 1px, transparent 1px);
    background-size:64px 64px;
    transform:perspective(500px) rotateX(52deg) translateY(-8%);
    animation:gridDrift 28s linear infinite;
    mask-image:radial-gradient(ellipse 60% 55% at 50% 50%, #000 0%, transparent 78%);
    -webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 50%, #000 0%, transparent 78%)}
  #ui::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:
      linear-gradient(180deg, transparent 0%, rgba(90,235,255,.055) 48%, transparent 52%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
    background-size:100% 260%, 100% 100%;
    animation:scanSweep 7s linear infinite}
  @keyframes gridDrift{0%{background-position:0 0,0 0}100%{background-position:0 64px,64px 0}}
  @keyframes scanSweep{0%{background-position:0 -140%,0 0}100%{background-position:0 140%,0 0}}
  @keyframes panelBreath{0%,100%{box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 30px rgba(0,210,255,.16),
      0 18px 60px rgba(0,0,0,.65),inset 0 1px 0 rgba(180,250,255,.22),inset 0 0 44px rgba(0,150,255,.08)}
    50%{box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 48px rgba(0,225,255,.34),
      0 18px 60px rgba(0,0,0,.65),inset 0 1px 0 rgba(200,255,255,.32),inset 0 0 60px rgba(0,170,255,.14)}}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes markSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
  @keyframes shimmer{0%,100%{opacity:.45}50%{opacity:1}}

  /* ---------- 主面板：双层边框 + 内发光 + 顶部高光 ---------- */
  .panel{pointer-events:auto;position:relative;text-align:center;
    padding:30px 34px 26px;max-width:min(780px,93vw);
    /* 长面板（操作说明十页 / 三选一窄屏竖排）在小屏会溢出，必须可滚。
       touch-action:pan-y 允许面板内纵向滚动，同时保留点击与禁双击缩放 */
    max-height:92dvh;
    /* 侧显时 #ui 会被旋转，dvh 仍是"未旋转视口"的高度，会算出过大的值。
       用 min(...,100%) 让面板同时受容器高度约束；旧内核忽略此行回退上一行。 */
    max-height:min(92dvh,100%);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    touch-action:pan-y;overscroll-behavior:contain;
    background:
      linear-gradient(180deg, rgba(14,26,48,.94), rgba(5,9,20,.96)),
      radial-gradient(ellipse 120% 80% at 50% -10%, rgba(0,220,255,.14), transparent 60%);
    border-radius:16px;
    border:1px solid rgba(90,240,255,.40);
    box-shadow:
      0 0 0 1px rgba(0,0,0,.5),
      0 0 34px rgba(0,210,255,.20),
      0 18px 60px rgba(0,0,0,.65),
      inset 0 1px 0 rgba(180,250,255,.22),
      inset 0 0 44px rgba(0,150,255,.08);
    backdrop-filter:blur(12px) saturate(1.15);-webkit-backdrop-filter:blur(12px) saturate(1.15);
    animation:panelBreath 4.6s ease-in-out infinite}
  /* 面板顶部能量线（不占用 ::before/::after 角标，用内嵌伪层实现在 h1 上） */
  .panel>*:first-child{position:relative}
  /* 面板四角装饰角标 */
  .panel::before,.panel::after{content:'';position:absolute;width:22px;height:22px;pointer-events:none}
  .panel::before{left:8px;top:8px;border-left:2px solid rgba(90,240,255,.75);border-top:2px solid rgba(90,240,255,.75);border-radius:4px 0 0 0}
  .panel::after{right:8px;bottom:8px;border-right:2px solid rgba(90,240,255,.75);border-bottom:2px solid rgba(90,240,255,.75);border-radius:0 0 4px 0}

  /* ---------- 标题：渐变文字 + 三层辉光 + 下方能量线 ---------- */
  h1{margin:0 0 4px;font-size:clamp(32px,5.6vw,54px);letter-spacing:.16em;font-weight:800;
    background:linear-gradient(180deg,#ffffff 0%,#a8f6ff 42%,#33c8ff 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 10px rgba(0,230,255,.85)) drop-shadow(0 0 30px rgba(0,140,255,.55))}
  .sub{margin:0 0 18px;font-size:12.5px;letter-spacing:.42em;color:#5fb6cc;
    text-shadow:0 0 12px rgba(0,200,255,.5)}
  /* ---------- 品牌徽记：菱形核心 + 双环 + 两侧能量线 ---------- */
  .brand{display:flex;align-items:center;justify-content:center;gap:16px;margin:0 0 2px}
  .brandMark{width:34px;height:34px;flex:0 0 34px;position:relative;
    animation:floatY 3.6s ease-in-out infinite}
  .brandMark::before{content:'';position:absolute;inset:6px;
    background:linear-gradient(135deg,#eaffff,#38d8ff 55%,#7b5bff);
    transform:rotate(45deg);border-radius:4px;
    box-shadow:0 0 16px rgba(0,225,255,.85),inset 0 0 8px rgba(255,255,255,.6)}
  .brandMark::after{content:'';position:absolute;inset:0;border:1px solid rgba(120,240,255,.65);
    border-radius:50%;animation:markSpin 9s linear infinite;
    box-shadow:0 0 14px rgba(0,200,255,.35)}
  .brandLine{height:1px;width:clamp(28px,7vw,88px);flex:0 1 auto;
    background:linear-gradient(90deg,transparent,rgba(110,240,255,.9));
    box-shadow:0 0 10px rgba(0,220,255,.6)}
  .brandLine.r{background:linear-gradient(270deg,transparent,rgba(190,130,255,.9));
    box-shadow:0 0 10px rgba(170,100,255,.6)}
  .energyLine{height:2px;width:min(260px,70%);margin:10px auto 0;border-radius:2px;
    background:linear-gradient(90deg,transparent,#5ff0ff 30%,#b98bff 70%,transparent);
    box-shadow:0 0 14px rgba(0,220,255,.65);animation:shimmer 3s ease-in-out infinite}
  /* 模式 / 难度选择条 */
  .modeRow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 2px}
  .modeChip{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:20px;
    font-size:12px;font-weight:700;letter-spacing:.08em;color:#9fd9ec;
    background:linear-gradient(180deg,rgba(20,44,72,.75),rgba(8,18,34,.8));
    border:1px solid rgba(90,235,255,.28);
    box-shadow:inset 0 1px 0 rgba(160,240,255,.14),0 0 12px rgba(0,180,255,.10)}
  .modeChip b{color:#e2fbff;font-weight:800}
  .modeChip.hot{border-color:rgba(255,205,110,.55);color:#ffe2a8;
    box-shadow:inset 0 1px 0 rgba(255,230,170,.18),0 0 16px rgba(255,180,60,.18)}
  .modeChip.hot b{color:#fff0c8}
  .diffBtn{min-width:118px}
  /* 统计三宫格 */
  .statGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;
    max-width:430px;margin:16px auto 2px}
  .statCell{padding:9px 6px;border-radius:9px;text-align:center;
    background:linear-gradient(180deg,rgba(18,40,66,.6),rgba(7,14,28,.72));
    border:1px solid rgba(90,235,255,.20);
    box-shadow:inset 0 1px 0 rgba(170,245,255,.12)}
  .statCell .lb{display:block;font-size:10px;letter-spacing:.14em;color:#5f93a8}
  .statCell .vl{display:block;font-size:18px;font-weight:800;color:#a8f6ff;margin-top:3px;
    font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(0,220,255,.55)}
  /* 结算评级徽章 */
  .rankBadge{position:relative;width:96px;height:96px;margin:2px auto 8px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;border:1px solid rgba(255,225,140,.5);
    background:radial-gradient(circle at 50% 45%,rgba(255,215,110,.16),rgba(8,16,32,.9) 68%);
    box-shadow:0 0 34px rgba(255,195,70,.30),inset 0 0 26px rgba(255,190,60,.14);
    animation:floatY 4s ease-in-out infinite}
  .rankBadge::before{content:'';position:absolute;inset:-7px;border-radius:50%;
    border:1px dashed rgba(255,225,150,.35);animation:markSpin 16s linear infinite}
  .rankBadge .rk{font-size:54px;font-weight:900;line-height:1;
    background:linear-gradient(180deg,#fff8dc,#ffc94e 55%,#ff8a3c);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 14px rgba(255,190,60,.8))}
  .rankBadge .rkl{position:absolute;bottom:-5px;font-size:9px;letter-spacing:.24em;
    color:#ffd79a;text-shadow:0 0 10px rgba(255,180,60,.7)}
  .winBadge{border-color:rgba(140,255,200,.5);
    background:radial-gradient(circle at 50% 45%,rgba(90,255,190,.16),rgba(8,16,32,.9) 68%);
    box-shadow:0 0 34px rgba(60,255,180,.30),inset 0 0 26px rgba(50,240,170,.14)}
  .winBadge::before{border-color:rgba(150,255,210,.35)}
  .winBadge .rk{background:linear-gradient(180deg,#eafff6,#7dffce 55%,#25d8a0);
    -webkit-background-clip:text;background-clip:text;
    filter:drop-shadow(0 0 14px rgba(60,255,180,.8))}
  .winBadge .rkl{color:#a8ffd8;text-shadow:0 0 10px rgba(60,255,180,.7)}
  /* 操作面板分页点 */
  .pageDots{display:flex;gap:6px;justify-content:center;margin:12px 0 2px;flex-wrap:wrap}
  .pageDots i{width:6px;height:6px;border-radius:50%;background:rgba(90,200,230,.28)}
  .pageDots i.on{width:18px;border-radius:4px;background:linear-gradient(90deg,#5ff0ff,#b98bff);
    box-shadow:0 0 10px rgba(0,220,255,.75)}
  .helpIco{width:76px;height:76px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;
    font-size:36px;border-radius:20px;color:#9ff6ff;
    background:linear-gradient(145deg,rgba(20,52,80,.9),rgba(8,18,36,.95));
    border:1px solid rgba(90,235,255,.35);
    box-shadow:0 0 28px rgba(0,200,255,.25),inset 0 1px 0 rgba(180,250,255,.22);
    animation:floatY 3.4s ease-in-out infinite}
  /* 卡片序号 / 图标圆底 */
  .card .ic{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;
    margin-right:8px;vertical-align:middle;border-radius:9px;font-size:17px;
    background:linear-gradient(150deg,rgba(30,68,98,.9),rgba(10,22,42,.95));
    border:1px solid rgba(110,235,255,.35);
    box-shadow:inset 0 1px 0 rgba(190,250,255,.2),0 0 12px rgba(0,200,255,.16)}
  .card.rare .ic{border-color:rgba(255,205,95,.5);box-shadow:0 0 14px rgba(255,190,60,.25)}
  .card.epic .ic{border-color:rgba(220,140,255,.55);box-shadow:0 0 16px rgba(200,110,255,.28)}
  .card.evoCard .ic{border-color:rgba(255,235,130,.8);box-shadow:0 0 20px rgba(255,210,80,.4)}
  .card .num{position:absolute;left:12px;bottom:9px;font-size:10px;font-weight:800;
    color:rgba(120,190,215,.45);letter-spacing:.12em}
  .card .lv{padding-left:2px}
  .sectionCap{display:inline-block;margin:14px 0 2px;padding:4px 14px;border-radius:20px;
    font-size:10.5px;letter-spacing:.22em;color:#78c4dc;
    background:rgba(10,26,44,.7);border:1px solid rgba(90,235,255,.22)}
  /* ---------- 入场动效：面板内容依次淡入上滑，避免"整块突然弹出" ---------- */
  @keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .panel>*{animation:riseIn .42s cubic-bezier(.2,.9,.3,1) both}
  .panel>*:nth-child(1){animation-delay:.02s}
  .panel>*:nth-child(2){animation-delay:.07s}
  .panel>*:nth-child(3){animation-delay:.12s}
  .panel>*:nth-child(4){animation-delay:.17s}
  .panel>*:nth-child(5){animation-delay:.22s}
  .panel>*:nth-child(6){animation-delay:.27s}
  .panel>*:nth-child(7){animation-delay:.32s}
  .panel>*:nth-child(8){animation-delay:.36s}
  .panel>*:nth-child(9){animation-delay:.40s}
  .cards .card{animation:riseIn .46s cubic-bezier(.2,.9,.3,1.15) both}
  .cards .card:nth-child(1){animation-delay:.20s}
  .cards .card:nth-child(2){animation-delay:.28s}
  .cards .card:nth-child(3){animation-delay:.36s}
  .cards .card:nth-child(4){animation-delay:.44s}
  /* 卡片内扫光：hover 时一道冷光掠过 */
  .card::after{content:'';position:absolute;top:0;left:-130%;width:60%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(180,250,255,.10),transparent);
    transform:skewX(-18deg);transition:left .55s ease;pointer-events:none}
  .card:hover::after{left:150%}
  /* 主按钮待机微光 */
  button:not(.ghost){animation:btnPulse 3.2s ease-in-out infinite}
  @keyframes btnPulse{0%,100%{box-shadow:0 0 18px rgba(0,220,255,.5),0 3px 0 rgba(0,70,110,.65),inset 0 1px 0 rgba(255,255,255,.6)}
    50%{box-shadow:0 0 30px rgba(0,235,255,.78),0 3px 0 rgba(0,70,110,.65),inset 0 1px 0 rgba(255,255,255,.75)}}
  /* 标题/副标题两侧装饰线 */
  .sub{position:relative;display:inline-block}
  .sub::before,.sub::after{content:'';position:absolute;top:50%;width:26px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(90,225,255,.7));
    box-shadow:0 0 8px rgba(0,210,255,.5)}
  .sub::before{right:calc(100% + 12px)}
  .sub::after{left:calc(100% + 12px);transform:scaleX(-1)}
  /* 三档难度预览：让玩家在切换前就知道有哪些档 */
  .diffTrack{display:flex;gap:6px;justify-content:center;margin:10px auto 2px;max-width:360px}
  .diffTrack i{flex:1;height:4px;border-radius:3px;background:rgba(90,180,215,.22);
    position:relative;transition:background .25s,box-shadow .25s}
  .diffTrack i.on{background:linear-gradient(90deg,#5ff0ff,#b98bff);
    box-shadow:0 0 12px rgba(0,220,255,.7)}
  .diffTrack i.lb{font-style:normal;height:auto;background:none;box-shadow:none;
    flex:0 0 auto;font-size:9px;letter-spacing:.1em;color:#5f93a8;line-height:1}
  /* 评级徽章按等级配色 */
  .rankBadge.rankS{border-color:rgba(255,225,120,.75);
    box-shadow:0 0 46px rgba(255,195,60,.45),inset 0 0 30px rgba(255,190,60,.20)}
  .rankBadge.rankA{border-color:rgba(215,155,255,.7);
    box-shadow:0 0 40px rgba(190,110,255,.38),inset 0 0 28px rgba(180,100,255,.16)}
  .rankBadge.rankA .rk{background:linear-gradient(180deg,#fff0ff,#d9a6ff 55%,#8a55ff);
    -webkit-background-clip:text;background-clip:text;
    filter:drop-shadow(0 0 14px rgba(190,110,255,.8))}
  .rankBadge.rankB .rk{background:linear-gradient(180deg,#f0fbff,#8fe4ff 55%,#2b8ce0);
    -webkit-background-clip:text;background-clip:text;
    filter:drop-shadow(0 0 14px rgba(70,180,255,.8))}
  .rankBadge.rankC .rk{background:linear-gradient(180deg,#eafff8,#9ff0d6 55%,#3abf96);
    -webkit-background-clip:text;background-clip:text;
    filter:drop-shadow(0 0 12px rgba(60,220,170,.7))}
  .rankBadge.rankD .rk{background:linear-gradient(180deg,#f2f6f8,#a8bcc8 55%,#5f7888);
    -webkit-background-clip:text;background-clip:text;
    filter:drop-shadow(0 0 10px rgba(140,180,200,.6))}
  /* 结算统计网格：给 .grid2 加一点卡片感 */
  .grid2 .stat{padding:6px 10px;border-radius:7px;
    background:linear-gradient(180deg,rgba(18,40,66,.45),rgba(7,14,28,.55));
    border:1px solid rgba(90,235,255,.12)}
  /* 菜单底部状态栏 */
  .footBar{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
    margin-top:14px;padding-top:10px;border-top:1px solid rgba(90,235,255,.14);
    font-size:9.5px;letter-spacing:.14em;color:#4e7f92}
  .footBar b{color:#8fd8ec;font-weight:700}
  /* 竖屏图标：模拟手机旋转 */
  #rot .ric{display:inline-block;animation:rotPhone 3.4s ease-in-out infinite}
  @keyframes rotPhone{0%,35%{transform:rotate(0deg)}65%,100%{transform:rotate(90deg)}}
  /* 减少动态效果偏好 */
  @media (prefers-reduced-motion:reduce){
    #ui::before,#ui::after,.panel,.brandMark,.brandMark::after,.rankBadge,
    .rankBadge::before,.helpIco,.energyLine,.panel>*,.cards .card,
    button:not(.ghost),#rot .ric{animation:none!important}
  }
  .row{margin:10px 0;font-size:14px;color:#a9d6e6;line-height:1.75}
  .k{display:inline-block;min-width:26px;padding:2px 8px;margin:0 2px;border-radius:5px;color:#bdf;
    font-size:12px;background:linear-gradient(180deg,#123448,#0a2130);
    border:1px solid rgba(80,230,255,.42);box-shadow:0 0 10px rgba(0,200,255,.18),inset 0 1px 0 rgba(180,250,255,.2)}

  /* ---------- 按钮：斜切角 + 高光条 + hover 光扫 ---------- */
  button{position:relative;overflow:hidden;font:inherit;font-weight:800;letter-spacing:.1em;
    padding:12px 28px;margin:7px 5px;border-radius:8px;cursor:pointer;color:#03151c;
    border:1px solid rgba(190,255,255,.9);
    background:linear-gradient(180deg,#5ff0ff 0%,#12c8f5 48%,#0a8fe0 100%);
    box-shadow:0 0 18px rgba(0,220,255,.5),0 3px 0 rgba(0,70,110,.65),inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .09s,box-shadow .2s,filter .2s}
  button::after{content:'';position:absolute;top:0;left:-120%;width:55%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-18deg);transition:left .45s ease}
  button:hover{transform:translateY(-2px);filter:brightness(1.12);
    box-shadow:0 0 30px rgba(0,235,255,.85),0 5px 0 rgba(0,70,110,.7),inset 0 1px 0 rgba(255,255,255,.75)}
  button:hover::after{left:150%}
  button:active{transform:translateY(1px);box-shadow:0 0 14px rgba(0,200,255,.5),0 1px 0 rgba(0,70,110,.7)}
  button.ghost{color:#a8f2ff;background:linear-gradient(180deg,rgba(20,44,72,.7),rgba(8,18,34,.7));
    border-color:rgba(90,235,255,.34);box-shadow:0 0 12px rgba(0,180,255,.14),inset 0 1px 0 rgba(160,240,255,.14)}
  button.ghost:hover{color:#e6fdff;border-color:rgba(120,245,255,.85);
    box-shadow:0 0 24px rgba(0,225,255,.42),inset 0 1px 0 rgba(180,250,255,.3)}

  /* ---------- 三选一卡片：稀有度光晕 + 顶部色条 ---------- */
  .cards{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .card{pointer-events:auto;width:208px;padding:17px 15px 15px;border-radius:13px;cursor:pointer;text-align:left;
    position:relative;overflow:hidden;

<canvas id="game"></canvas>
<div id="ui"><div class="panel" id="panel"></div></div>
<div id="rot">
  <div class="ric">▯</div>
  <div class="rt">◄ 请 横 屏 游 玩 ►</div>

  <div class="rs">横屏可获得完整视野<br>若已锁定竖屏，可点下方按钮：<br>画面将侧转 90° 放大显示，<br>把手机横过来看即为正向</div>
  <button class="ghost" id="btnRotGo">竖 屏 侧 显 继 续</button>

<script>
(()=>{
'use strict';

/* ============================================================
   NEON DRIFT —— 单文件双摇杆生存射击
   架构：固定 60Hz 逻辑步 / 可变帧率渲染 / 1280x720 逻辑坐标
   ============================================================ */

const W=1280, H=720;
const MAX_FRAME=0.25;
/* 逻辑步长改为动态：随设备能力在 60→185Hz 之间升降（见 refresh.js 区块） */
let FIXED_DT=1/60, MAX_STEPS=8;
/* 当前步长的秒数，供"每步概率"归一化使用 */
let curDt=1/60;
const TAU=Math.PI*2;
/* 把"以 60Hz 为基准的每步概率"换算成任意步长下的等效概率。
   目标：每秒触发次数恒定 = 60×p。
   60Hz 每秒 60 步 × p；N Hz 每秒 N 步 × q ⇒ q = p·60/N = p·60·dt。
   注意不能用 1-(1-p)^(60dt)：那是保持"每秒至少命中一次的概率"相等，
   对 p=0.75 这类大概率会算出 0.373 而非 0.243，高刷下粒子反而暴增。
   逻辑频率不会低于 60Hz，故 p·60·dt ≤ p ≤ 1，无需担心越界。 */
function pStep(p){ const v=p*60*curDt; return v>1?1:v; }

/* ============================================================
   统一配置：所有可调参数集中在此，改动不需要碰战斗/渲染核心
   ============================================================ */
const CFG={
  input:{
    leftZoneX:0.42,          // 左摇杆激活区：屏幕左侧 42%
    stickDead:0.14,          // 中心死区（占半径比例）
    stickExp:0.85,           // 死区外响应曲线指数
    reboundTau:{move:0.09, aim:0.06},  // 松手回弹时间常数（秒）
    reboundScale:[0.6,1.0,1.6],   // 快/中/慢 倍率
    aimHoldMag:0.12,         // 低于此推力视为"松手"
    aimConfirm:0.09,         // 需持续多久才确认"最后朝向"
    stickScale:1.0           // 摇杆尺寸倍率（设置可调 0.8/1.0/1.25）
  },
  assist:{
    byLv:{0:0, 1:0.45, 2:0.75, 3:1.0},   // 关/低/中/高
    defaultLv:2,
    maxRadius:470,      // 最大生效距离
    maxCone:28,         // 最大瞄准锥（度）
    lead:0.11,          // 提前量（秒）
    snapHalfAngle:5,    // 磁吸角半径（度）
    slowNear:50, slowFar:100, slowMax:0.40,
    maxRot:7.5,         // 最大辅助旋转角速度（rad/s）
    magSuppress:0.95,   // 满推抑制阈值
    angVelSuppress:3.4, // 目标角速度抑制阈值
    minAssist:0.15, maxAssist:0.90
  },
  dash:{
    dblMin:0.07, dblMax:0.22,   // 双击窗口（秒）
    drift:36,                   // 单点允许漂移（px）
    pairDist:120,               // 两次落点最大距离（px）
    cooldownAfterFire:0.30      // 开火后多久内不判双击
  },
  radial:{
    sectors:4, deadZone:64, openAt:52, dwell:0.07,
    openHold:0.14, timeout:2.5
  },
  prog:{
    dedupMemory:5,      // 全局去重记忆次数
    pityAfter:5, pityMul:3.5,
    rarityW:{common:62, rare:27, epic:11},
    evolveWepLv:5, evolvePassiveLv:1
  },
  waves:{
    standard:{dur:180, xpMul:1.00, intervalMul:1.00, hpMul:1.00},
    quick:{dur:90,  xpMul:1.75, intervalMul:0.92, hpMul:1.04},
    burstStart:0.50, burstEnd:0.62,   // 波次内脉冲触发区间（占波次时长）
    contractEvery:5                    // 每几波提供一次环境合约
  },
  tut:{
    enabled:true, maxConcurrent:1
  }
};

/* ============================================================
   难度档位 —— 只作用于 Boss 战，不动小怪曲线（上一轮已单独校过）。
   用户反馈 "BOSS 太难" 的根因量化：
     玩家初始 100 HP / 受击无敌 0.82s，而 Boss 弹幕单发 10×阶段
     （阶段3 = 30，再乘 dmgMul），接触伤害 26×1.9≈49 —— 一次撞击
     就是半血，阶段3 三发入魂。同时 Boss 战仍按 45% 上限刷小怪，
     弹幕 + 小怪 + 撞击三路夹击，容错几乎为零。
   三档统一压低「血量 / 弹伤 / 弹频 / 撞击 / 陪刷小怪」，并给
   入场补给（护盾 + 大招充能 + 回血）作为可感知的容错缓冲。
   默认 standard 就是"比旧版明显好打"的一档，老玩家可选 hard 找回原味。
   ============================================================ */
const DIFFICULTY={
  casual:{key:'casual', label:'休闲', ico:'❋', col:[130,255,190],
    hp:0.62, bulletDmg:0.52, atkMul:0.66, contact:0.50, addCap:0.22,
    overAt:38, shield:55, ult:45, heal:0.22,
    desc:'弹幕更稀、伤害更低，入场送护盾与大招能量'},
  standard:{key:'standard', label:'标准', ico:'◆', col:[140,235,255],
    hp:0.80, bulletDmg:0.70, atkMul:0.80, contact:0.68, addCap:0.32,
    overAt:48, shield:36, ult:28, heal:0.14,
    desc:'保留全部机制，但给足反应窗口与容错'},
  hard:{key:'hard', label:'硬核', ico:'✦', col:[255,150,120],
    hp:1.00, bulletDmg:1.00, atkMul:1.00, contact:1.00, addCap:0.45,
    overAt:70, shield:0, ult:0, heal:0,
    desc:'旧版原味：满密度弹幕、无入场补给'}
};
const DIFF_ORDER=['casual','standard','hard'];
function DF(){ return DIFFICULTY[store.difficulty] || DIFFICULTY.standard; }
function diffLabel(){ const d=DF(); return d.ico+' '+d.label; }
function cycleDifficulty(){
  const i=DIFF_ORDER.indexOf(DF().key);
  store.difficulty=DIFF_ORDER[(i+1)%DIFF_ORDER.length];
  saveStore();
}
const D2R=Math.PI/180;

/* ---------- 小工具 ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>(a+Math.random()*(b-a+1))|0;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const now=()=>performance.now()/1000;

/* ---------- 画布与坐标 ---------- */
const cv=document.getElementById('game');
const ctx=cv.getContext('2d',{alpha:false});
let viewScale=1, cssW=W, cssH=H, lastResizeKey='';
const safeInset={t:0,r:0,b:0,l:0};
let safeRead=false, safeKey='';
/* 安全区只在"视口尺寸真的变了"时才重读。
   读 env() 需要插 DOM + getComputedStyle，会强制一次同步布局；
   visualViewport 在移动端滚动/地址栏收放时会高频触发 resize，
   放在尺寸短路之前会导致每次事件都同步布局，白白掉帧。 */
function readSafeArea(){
  const k=window.innerWidth+'x'+window.innerHeight;
  if(safeRead && safeKey===k) return;
  safeKey=k;
  try{
    const d=document.createElement('div');
    d.style.cssText='position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;'+
      'pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) '+
      'env(safe-area-inset-bottom) env(safe-area-inset-left)';
    document.body.appendChild(d);
    const cs=getComputedStyle(d);
    safeInset.t=parseFloat(cs.paddingTop)||0;
    safeInset.r=parseFloat(cs.paddingRight)||0;
    safeInset.b=parseFloat(cs.paddingBottom)||0;
    safeInset.l=parseFloat(cs.paddingLeft)||0;
    d.remove();
    safeRead=true;
  }catch(e){}
}
/* 竖屏侧显：把 16:9 画布整体旋转 90° 塞进竖屏。
   纯信箱模式下 390x844 的竖屏只能画出 390x219（占屏 26%），
   旋转后视觉尺寸变为 390x693（占屏 82%），可玩性完全不同。 */
const uiEl=document.getElementById('ui');
let portrait=false, rotated=false, rotCx=0, rotCy=0, cssCw=W, cssCh=H, cssLeft=0, cssTop=0;

/* 取"真实可见视口"。微信/手机自带浏览器有顶部地址栏与底部工具栏，
   innerHeight 往往大于真正可见区域，导致画面被工具栏盖住一截。
   visualViewport 能拿到扣除 UI 后的真实尺寸，优先使用。 */
function viewportSize(){
  const vv=window.visualViewport;
  let w=window.innerWidth, h=window.innerHeight, ox=0, oy=0;
  if(vv && vv.width>0 && vv.height>0){
    // visualViewport 在极端情况（键盘弹出）会异常收缩，做合理性校验
    if(vv.width<=window.innerWidth+2 && vv.height<=window.innerHeight+2){
      w=vv.width; h=vv.height;
      /* iOS Safari / 微信里地址栏收放、页面轻微滚动时，visual viewport
         相对 layout viewport 会有一个 offsetTop/offsetLeft。
         画布若仍按 (0,0) 起点居中，就会整体上移被工具栏盖住一截；
         而 e.clientX/Y 是相对 layout viewport 的，触摸坐标也会跟着错位。
         所以必须把可见区起点一并纳入定位与坐标换算。 */
      ox=Math.max(0, vv.offsetLeft||0);
      oy=Math.max(0, vv.offsetTop||0);
      // 合理性校验：offset 不能把可见区推出屏幕，异常值直接忽略
      if(ox+w>window.innerWidth+6) ox=0;
      if(oy+h>window.innerHeight+6) oy=0;
    }
  }
  // 兜底：某些内核首帧返回 0
  if(!w||!h){ w=window.innerWidth||document.documentElement.clientWidth||390;
              h=window.innerHeight||document.documentElement.clientHeight||844; }
  return {w:Math.round(w), h:Math.round(h), ox:Math.round(ox), oy:Math.round(oy)};
}
function isPortraitBox(aw,ah){ return ah>aw*1.06; }   // 留 6% 容差，避免接近正方形时反复横跳

function resize(force){
  readSafeArea();
  const vs=viewportSize();
  // 可用区域扣除刘海/圆角安全区
  const availW=Math.max(200, vs.w - safeInset.l - safeInset.r);
  const availH=Math.max(160, vs.h - safeInset.t - safeInset.b);
  const p=isPortraitBox(availW,availH);
  // 竖屏且用户确认过侧显 → 旋转渲染；否则竖屏走提示层
  const useRot = p && rotAllowed;
  portrait=p; rotated=useRot;

  // DPR 上限按"总渲染像素数"自适应
  const rawDpr=window.devicePixelRatio||1;
  const px=availW*availH*rawDpr;
  let dprCap=2;
  if(px>3.2e6) dprCap=1.25;
  else if(px>2.2e6) dprCap=1.5;
  else if(px>1.3e6) dprCap=1.75;
  const dpr=Math.min(rawDpr, dprCap);

  /* 缩放比：
     横屏 —— 直接按 16:9 信箱
     竖屏侧显 —— 画布旋转 90° 后，视觉宽=ch、视觉高=cw，因此约束互换 */
  const s = useRot ? Math.min(availH/W, availW/H) : Math.min(availW/W, availH/H);
  const cw=Math.round(W*s), ch=Math.round(H*s);
  const key=cw+'x'+ch+'@'+dpr+'@'+(useRot?'R':'N')+'@'+vs.ox+','+vs.oy;
  if(!force && key===lastResizeKey) return;   // 尺寸没真变就不重建，避免地址栏抖动
  lastResizeKey=key;
  cssCw=cw; cssCh=ch;

  cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);
  cv.style.width=cw+'px'; cv.style.height=ch+'px';

  // 旋转后的视觉中心对齐可用区中心（旋转 90° 包围盒中心不变）。
  // vs.ox/vs.oy 是 visual viewport 相对 layout viewport 的偏移，必须加上，
  // 否则 iOS 地址栏收起后画面会偏离可见区、触摸坐标整体错位。
  const centerX=vs.ox+safeInset.l+availW/2;
  const centerY=vs.oy+safeInset.t+availH/2;
  rotCx=centerX; rotCy=centerY;
  cssLeft=Math.round(centerX-cw/2); cssTop=Math.round(centerY-ch/2);
  cv.style.left=cssLeft+'px';
  cv.style.top =cssTop+'px';
  cv.style.transform = useRot ? 'rotate(90deg)' : 'none';
  /* 竖屏侧显时 UI 层也要跟着转 90°：否则玩家横握手机时画面正立，
     而升级三选一 / 暂停 / 结算面板是侧躺的，得歪头读文字，割裂感很强。
     旋转后包围盒宽高互换，故把 #ui 的未旋转宽设为 availH、高设为 availW，
     并让它的中心仍对齐可见区中心。CSS transform 会自动映射面板内的点击，
     所以按钮/卡片交互不需要改坐标换算。 */
  if(uiEl){
    if(useRot){
      uiEl.style.width=availH+'px';
      uiEl.style.height=availW+'px';
      uiEl.style.left=(centerX-availH/2)+'px';
      uiEl.style.top=(centerY-availW/2)+'px';
      uiEl.style.right='auto'; uiEl.style.bottom='auto';
      uiEl.style.transform='rotate(90deg)';
      uiEl.style.transformOrigin='50% 50%';
    }else{
      uiEl.style.width=''; uiEl.style.height='';
      uiEl.style.left=''; uiEl.style.top='';
      uiEl.style.right=''; uiEl.style.bottom='';
      uiEl.style.transform=''; uiEl.style.transformOrigin='';
    }
  }
  ctx.setTransform(dpr*s,0,0,dpr*s,0,0);
  ctx.lineJoin='round'; ctx.lineCap='round';
  viewScale=s; cssW=cw; cssH=ch;
  layoutTouch();
  updateRotHint();
}
addEventListener('resize',()=>{ pendingResize=true; },{passive:true});
addEventListener('orientationchange',()=>{
  // 微信 X5 内核里 orientationchange 常早于视口更新；标记后由下一动画帧统一提交。
  pendingResize=true;
  if(!QUALITY.locked) applyBackgroundQuality(Math.min(QUALITY.bgLv,1));
  setTimeout(()=>{ pendingResize=true; },120);
  setTimeout(()=>{ pendingResize=true; },400);
},{passive:true});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{ pendingResize=true; },{passive:true});
  window.visualViewport.addEventListener('scroll',()=>{ pendingResize=true; },{passive:true});
}
// iOS 上 screen.orientation 更权威，但部分安卓/微信缺失，故只作补充
try{ if(screen.orientation && screen.orientation.addEventListener)
  screen.orientation.addEventListener('change',()=>{
    pendingResize=true;
    if(!QUALITY.locked) applyBackgroundQuality(Math.min(QUALITY.bgLv,1));
    setTimeout(()=>{ pendingResize=true; },150); setTimeout(()=>{ pendingResize=true; },450);
  });
}catch(e){}

/* ---------- 竖屏提示层（JS 驱动，微信可用） ---------- */
let rotAllowed=false;   // 用户是否确认"竖屏继续"
const rotEl=document.getElementById('rot');
let pausedByRot=false;
function updateRotHint(){
  if(!rotEl) return;
  const show = portrait && !rotAllowed;
  if(show){
    /* 提示盖住画面时必须暂停，否则玩家看不见却在继续挨打 */
    if(!rotEl.classList.contains('show') && state===ST.PLAYING){ togglePause(); pausedByRot=true; }
    rotEl.classList.add('show');
  } else {
    rotEl.classList.remove('show');
    /* 转回横屏、或用户已确认侧显时，自动把因竖屏而暂停的游戏恢复，
       否则玩家会莫名其妙停在暂停界面 */
    if(pausedByRot && state===ST.PAUSED){ pausedByRot=false; togglePause(); }
  }
  const btn=document.getElementById('btnRotGo');
  if(btn && !btn._bound){ btn._bound=true; btn.onclick=()=>{
    rotAllowed=true; pausedByRot=false;
    if(state===ST.PAUSED) togglePause();
    resize(true);
  }; }
}

/* 主循环兜底轮询：微信/部分安卓会丢失 resize 与 orientationchange 事件，
   导致转屏后画面卡在旧尺寸。这里每帧比对视口尺寸，变了就重建。
   只读 visualViewport/innerWidth 不触发强制布局，开销可忽略。 */
let lastVW=0, lastVH=0, lastOX=0, lastOY=0, pollTick=0;
function pollViewport(){
  if(++pollTick<6) return;      // 每 6 帧检查一次，约 10Hz
  pollTick=0;
  const vs=viewportSize();
  const dw=Math.abs(vs.w-lastVW), dh=Math.abs(vs.h-lastVH);
  const dox=Math.abs(vs.ox-lastOX), doy=Math.abs(vs.oy-lastOY);
  if(!dw && !dh && !dox && !doy) return;
  const init=!lastVW;
  /* 基准每次都要更新：旧实现在"高度小幅抖动"时直接 return 且不更新基准，
     一串 30px 的抖动会被逐次吞掉，且与 orientationchange 触发的 resize()
     不同步，导致之后误判或迟迟不重建。 */
  lastVW=vs.w; lastVH=vs.h; lastOX=vs.ox; lastOY=vs.oy;
  // 只有"宽不变 + 高度小幅变化 + offset 没变"才是地址栏抖动，忽略。
  // 基准已在前面更新，因此这里不能直接 return 而跳过待提交标记。
  const addressBarJitter=!init && dw<2 && dh<90 && dox<2 && doy<2;
  if(addressBarJitter) return;
  /* offset 变化（地址栏/工具栏切换）即使尺寸没变也必须重建，
     否则画布与触摸坐标会停留在旧位置 */
  pendingResize=true;
}

/* ---------- 触屏布局：按屏幕实际缩放反推控件尺寸，保证手指可点 ---------- */
let STICK_R=52, STICK_Y=H-140, STICK_LX=150, STICK_RX=W-150;
function layoutTouch(){
  if(viewScale<=0) return;
  // 目标：控件在屏幕上约 33 CSS px 半径（拇指舒适区），再换算回逻辑坐标
  const need=clamp(33/viewScale, 46, 96)*(store.stickScale||1);
  STICK_R=need;

  if(rotated){
    /* 侧显模式：画面转了 90°，逻辑 X 轴 ↔ 屏幕纵向、逻辑 Y 轴 ↔ 屏幕横向。
       沿用横屏的"底部一排"布局会让控件全挤到屏幕左边缘，拇指够不到。
       改为沿屏幕纵向重新排布：移动在上、瞄准在下（对应拇指上下握持），
       三个功能键排在屏幕中段偏右，避开画面正中的角色。 */
    STICK_LX=W*0.27; STICK_RX=W*0.73; STICK_Y=H*0.54;
    const gap=need*2.05;
    const by=H*0.30;                       // 逻辑Y小 → 屏幕偏右
    SWAP_BTN.r=need*0.82; SWAP_BTN.x=W*0.5-gap; SWAP_BTN.y=by;
    DASH_BTN.r=need*0.94; DASH_BTN.x=W*0.5;     DASH_BTN.y=by;
    ULT_BTN.r =need*0.86; ULT_BTN.x=W*0.5+gap;  ULT_BTN.y=by;
    // 三键沿逻辑X轴（屏幕纵向）不得溢出画面
    const maxX=W-ULT_BTN.r-12;
    if(ULT_BTN.x>maxX){ const s=ULT_BTN.x-maxX; ULT_BTN.x-=s; SWAP_BTN.x+=s; }
    return;
  }

  const by=H-clamp(need*1.05, 92, 152);
  STICK_Y=by-need*0.30;
  // 摇杆影子位置：往两侧靠，并给中央三键让出空间
  STICK_LX=clamp(need*1.9, 150, W*0.24);
  STICK_RX=W-clamp(need*1.9, 150, W*0.24);
  const gap=need*2.25;
  DASH_BTN.r=need*0.94; DASH_BTN.x=W/2;         DASH_BTN.y=by;
  ULT_BTN.r =need*0.86; ULT_BTN.x =W/2+gap;     ULT_BTN.y =by+need*0.14;
  SWAP_BTN.r=need*0.82; SWAP_BTN.x =W/2-gap;    SWAP_BTN.y =by+need*0.14;
  // 三键整体不能溢出画面，必要时收拢
  const maxX=W-ULT_BTN.r-12;
  if(ULT_BTN.x>maxX){
    const shift=ULT_BTN.x-maxX;
    ULT_BTN.x-=shift; SWAP_BTN.x+=shift;
  }
}
/* 屏幕坐标 → 1280x720 逻辑坐标。
   竖屏侧显时画布被 CSS 旋转了 90°，必须做逆变换，否则点击/摇杆会整体错位：
   顺时针旋 90° 把画布内偏移 (ux,uy) 映射到屏幕 (-uy,ux)，故逆变换为 (dy,-dx)。
   这里不能用 getBoundingClientRect —— 旋转后它返回的是包围盒（宽高互换）。 */
function screenToWorld(cx,cy){
  if(rotated){
    const dx=cx-rotCx, dy=cy-rotCy;
    const px=cssCw/2+dy, py=cssCh/2-dx;
    return {x:px/cssCw*W, y:py/cssCh*H};
  }
  return {x:(cx-cssLeft)*(W/cssCw), y:(cy-cssTop)*(H/cssCh)};
}

/* ---------- 本地存档 ---------- */
const SKEY='neon_drift_save_v1';
/* qualLock/qualLv/hzManual/hzManualHz：画质与帧率的手动设置，
   之前只存在内存里，刷新页面就丢 —— 用户明明设过却要重设 */
const store={bestScore:0,bestTime:0,bestWave:0,volume:.7,muted:false,shake:1,
  qualLock:false, qualLv:2, hzManual:false, hzManualHz:60,
  /* 操作设置 */
  assistLv:CFG.assist.defaultLv,     // 0关 1低 2中 3高
  stickScale:1.0,                    // 摇杆尺寸 0.8 小 / 1.0 中 / 1.25 大
  rebound:1,                         // 回弹速度 0快 1中 2慢
  singleStick:false,                 // 单摇杆+自动射击（辅助模式，默认关）
  dblDash:true,                      // 移动区双击冲刺
  difficulty:'standard',             // casual / standard / hard（只影响 Boss 战）
  /* 引导 */
  tutSeen:false, gamesPlayed:0,
  /* 排行榜：代号 / 本机离线成绩 / 上次上榜名次 */
  playerName:'', lbLocal:[], lbLastRank:null};
try{const raw=localStorage.getItem(SKEY); if(raw) Object.assign(store,JSON.parse(raw)||{});}catch(e){}
function saveStore(){ try{localStorage.setItem(SKEY,JSON.stringify(store));}catch(e){} }

/* ---------- 程序化音频 ---------- */
const Audio_={
  ctx:null, master:null, noise:null, last:{},
  init(){
    if(this.ctx) { if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    this.ctx=new AC();
    this.master=this.ctx.createGain();
    this.master.gain.value = store.muted?0:store.volume;
    this.master.connect(this.ctx.destination);
    // 一次生成噪声缓冲，复用
    const sr=this.ctx.sampleRate, len=(sr*0.7)|0;
    const buf=this.ctx.createBuffer(1,len,sr), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    this.noise=buf;
  },
  ready(){ return this.ctx && this.ctx.state==='running'; },
  gate(key,ms){ const t=performance.now(); if(this.last[key]&&t-this.last[key]<ms) return false; this.last[key]=t; return true; },
  tone(o){
    if(!this.ready()||store.muted) return;
    const c=this.ctx, t=c.currentTime;
    const osc=c.createOscillator(), g=c.createGain();
    osc.type=o.type||'square';
    osc.frequency.setValueAtTime(o.f1,t);
    if(o.f2&&o.f2!==o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(o.f2,1),t+o.dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(o.gain,.001),t+(o.atk||0.006));
    g.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
    let node=osc;
    if(o.filter){ const f=c.createBiquadFilter(); f.type='lowpass';
      f.frequency.setValueAtTime(o.filter[0],t);
      f.frequency.exponentialRampToValueAtTime(Math.max(o.filter[1],40),t+o.dur);
      node.connect(f); node=f; }
    node.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t+o.dur+0.03);
    osc.onended=()=>{try{osc.disconnect();g.disconnect();}catch(e){}};
  },
  burst(o){
    if(!this.ready()||store.muted) return;
    const c=this.ctx, t=c.currentTime;
    const s=c.createBufferSource(); s.buffer=this.noise;
    s.playbackRate.value=o.rate||1;
    const f=c.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(o.f1||1400,t);
    f.frequency.exponentialRampToValueAtTime(Math.max(o.f2||120,40),t+o.dur);
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(o.gain,.001),t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t+o.dur+0.03);
    s.onended=()=>{try{s.disconnect();f.disconnect();g.disconnect();}catch(e){}};
  },
  shakeSfx(){ if(!this.ready()||store.muted) return; },
  /* 具体音效 */
  shoot(){ if(!this.gate('shoot',70)) return;
    const p=1+ (Math.random()*0.06-0.03);
    this.tone({type:'sawtooth',f1:900*p,f2:230,dur:0.085,gain:0.075,atk:0.004}); },
  hit(){ if(!this.gate('hit',45)) return;
    this.tone({type:'triangle',f1:1250,f2:620,dur:0.06,gain:0.06,atk:0.003}); },
  crit(){ this.tone({type:'square',f1:1700,f2:820,dur:0.09,gain:0.075,atk:0.003}); },
  boom(big){ if(!this.gate('boom',big?0:55)) return;
    this.burst({dur:big?0.75:0.34,gain:big?0.24:0.13,f1:big?1500:1100,f2:big?90:170,rate:big?0.85:1.15});
    if(big) this.tone({type:'sine',f1:70,f2:28,dur:0.6,gain:0.18,atk:0.01}); },
  pickup(){ if(!this.gate('pickup',40)) return;
    this.tone({type:'sine',f1:680,f2:1020,dur:0.16,gain:0.055,atk:0.008}); },
  heal(){ this.tone({type:'sine',f1:520,f2:880,dur:0.28,gain:0.09,atk:0.01}); },
  levelup(){ if(!this.ready()||store.muted) return;
    [523,659,784,1046].forEach((f,i)=>setTimeout(()=>{
      this.tone({type:'triangle',f1:f,f2:f*1.5,dur:0.30,gain:0.09,atk:0.01});},i*105)); },
  hurt(){ this.burst({dur:0.30,gain:0.20,f1:700,f2:90,rate:0.8});
    this.tone({type:'square',f1:220,f2:70,dur:0.26,gain:0.13,atk:0.004}); },
  eshoot(){ if(!this.gate('eshoot',90)) return;
    this.tone({type:'square',f1:420,f2:300,dur:0.09,gain:0.035,atk:0.004}); },
  warn(){ if(!this.ready()||store.muted) return;
    for(let i=0;i<3;i++) setTimeout(()=>this.tone({type:'sawtooth',f1:300,f2:520,dur:0.34,gain:0.10,atk:0.02}),i*380); },
  bossdie(){ this.burst({dur:1.3,gain:0.30,f1:1800,f2:60,rate:0.7});
    [0,180,360,560].forEach(d=>setTimeout(()=>this.burst({dur:0.7,gain:0.22,f1:1200,f2:80,rate:1}),d)); }
};
function unlockAudio(){ Audio_.init(); }

/* ---------- 预烘焙资源 ---------- */
const glowCache=new Map();
function glowSprite(r,g,b){
  const key=(r<<16)|(g<<8)|b;
  let s=glowCache.get(key); if(s) return s;
  const R=64, c=document.createElement('canvas'); c.width=c.height=R*2;
  const x=c.getContext('2d');
  const gr=x.createRadialGradient(R,R,0,R,R,R);
  gr.addColorStop(0,'rgba('+r+','+g+','+b+',0.80)');
  gr.addColorStop(0.28,'rgba('+r+','+g+','+b+',0.28)');
  gr.addColorStop(0.62,'rgba('+r+','+g+','+b+',0.07)');
  gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');
  x.fillStyle=gr; x.fillRect(0,0,R*2,R*2);
  glowCache.set(key,c); return c;
}
function drawGlow(x,y,rad,r,g,b,a){
  if(a<=0) return;
  const s=glowSprite(r,g,b);
  ctx.globalAlpha=a<1?a:1;

}
/* 单位形状 → Path2D */
function mkShape(pts){
  const p=new Path2D(); p.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) p.lineTo(pts[i][0],pts[i][1]);
  p.closePath(); return p;
}
function poly(n,rot,squash){
  const pts=[]; for(let i=0;i<n;i++){const a=rot+i/n*TAU; pts.push([Math.cos(a),Math.sin(a)*(squash||1)]);} return pts;
}
const SHAPE={
  dart: mkShape([[1,0],[-0.55,0.62],[-0.28,0],[-0.55,-0.62]]),
  tri:  mkShape(poly(3,-Math.PI/2)),
  dia:  mkShape([[1,0],[0,0.82],[-1,0],[0,-0.82]]),
  sq:   mkShape(poly(4,Math.PI/4)),
  pent: mkShape(poly(5,-Math.PI/2)),
  hex:  mkShape(poly(6,0)),
  star: (()=>{const pts=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i/10*TAU,r=i%2?0.46:1;pts.push([Math.cos(a)*r,Math.sin(a)*r]);}return mkShape(pts);})(),
  eye:  mkShape(poly(8,0,0.62)),
  star2:(()=>{const pts=[];for(let i=0;i<16;i++){const a=-Math.PI/2+i/16*TAU,r=i%2?0.62:1;pts.push([Math.cos(a)*r,Math.sin(a)*r]);}return mkShape(pts);})()
};
/* 颜色字符串缓存：alpha 量化到 1/24，避免每帧为每个实体重新拼串并让浏览器重解析 */
const rgbaCache=new Map();
function rgba(r,g,b,a){
  const q=Math.round(clamp(a,0,1)*24);
  const key=((r|0)<<24)|((g|0)<<16)|((b|0)<<8)|q;
  let s=rgbaCache.get(key);
  if(s===undefined){ s='rgba('+(r|0)+','+(g|0)+','+(b|0)+','+(q/24).toFixed(3)+')'; rgbaCache.set(key,s); }
  return s;
}
function drawShape(path,x,y,rot,size,r,g,b,lw,alpha,flash){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(size,size);
  ctx.lineWidth=lw/size;
  let cr=r,cg=g,cb=b;
  if(flash>0){ cr=lerp(r,255,flash); cg=lerp(g,255,flash); cb=lerp(b,255,flash); }
  ctx.fillStyle='rgba(5,8,18,0.72)'; ctx.fill(path);
  ctx.strokeStyle='rgba('+(cr|0)+','+(cg|0)+','+(cb|0)+','+alpha+')'; ctx.stroke(path);
  ctx.lineWidth=(lw*0.42)/size;
  ctx.strokeStyle='rgba('+lerp(cr,255,.65|0)+','+lerp(cg,255,.65)+','+lerp(cb,255,.65)+','+(alpha*0.9)+')';
  ctx.stroke(path);
  ctx.restore();
}

/* 背景烘焙：底色+星云+网格（静态） / 三层视差星点（动态） */
let bgCanvas=null;
const starLayers=[];
function buildBg(){
  /* 背景是静态缓存，但 1280×720×多层在高 DPR 下仍占较多显存和首次栅格时间。
     背景独立档只影响缓存清晰度，不改变玩法坐标或碰撞尺寸。 */
  const scale=QUALITY.bgLv>=2?1:QUALITY.bgLv===1?0.75:0.5;
  const bw=Math.max(320,Math.round(W*scale)), bh=Math.max(180,Math.round(H*scale));
  const c=document.createElement('canvas'); c.width=bw; c.height=bh;
  const x=c.getContext('2d');
  x.save(); x.scale(bw/W,bh/H);
  const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#070a1c'); g.addColorStop(0.55,'#05070f'); g.addColorStop(1,'#080611');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  // 星云
  const neb=[[210,150,340,'rgba(0,120,190,0.17)'],[1060,540,380,'rgba(120,0,190,0.15)'],
             [640,360,300,'rgba(0,180,160,0.08)'],[100,640,260,'rgba(190,0,120,0.11)']];
  for(const [nx,ny,nr,nc] of neb){
    const rg=x.createRadialGradient(nx,ny,0,nx,ny,nr);
    rg.addColorStop(0,nc); rg.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=rg; x.fillRect(nx-nr,ny-nr,nr*2,nr*2);
  }
  // 网格
  x.strokeStyle='rgba(60,190,230,0.055)'; x.lineWidth=1;
  for(let gx=0;gx<=W;gx+=80){ x.beginPath(); x.moveTo(gx+.5,0); x.lineTo(gx+.5,H); x.stroke(); }
  for(let gy=0;gy<=H;gy+=80){ x.beginPath(); x.moveTo(0,gy+.5); x.lineTo(W,gy+.5); x.stroke(); }
  // 边框
  x.strokeStyle='rgba(90,235,255,0.30)'; x.lineWidth=2; x.strokeRect(1,1,W-2,H-2);
  x.strokeStyle='rgba(90,235,255,0.08)'; x.lineWidth=1;
  x.strokeRect(14,14,W-28,H-28);
  x.restore();
  bgCanvas=c;
  // 视差星层：远/中/近
  const cfg=[{n:270,r:[0.4,1.1],a:[0.10,0.34],px:0.030},
             {n:150,r:[0.7,1.7],a:[0.22,0.55],px:0.062},
             {n:64, r:[1.1,2.4],a:[0.42,0.85],px:0.118}];
  starLayers.length=0;
  for(const L of cfg){
    const sc=document.createElement('canvas'); sc.width=bw; sc.height=bh;
    const sx=sc.getContext('2d');
    /* 星点仍按 1280×720 世界坐标生成，仅最终缓存像素减少。 */
    sx.save(); sx.scale(bw/W,bh/H);
    for(let i=0;i<L.n;i++){
      const px=Math.random()*W, py=Math.random()*H, pr=rnd(L.r[0],L.r[1]);
      const a=rnd(L.a[0],L.a[1]);
      const tint=Math.random();
      const col = tint<0.62 ? 'rgba(200,235,255,' : tint<0.86 ? 'rgba(150,200,255,' : 'rgba(255,215,190,';
      sx.fillStyle=col+a+')';
      sx.beginPath(); sx.arc(px,py,pr,0,TAU); sx.fill();
      if(pr>1.6){ sx.globalAlpha=0.14; sx.beginPath(); sx.arc(px,py,pr*3.4,0,TAU); sx.fill(); sx.globalAlpha=1; }
    }
    sx.restore();
    starLayers.push({img:sc, px:L.px});
  }
}
/* 视差星空：按玩家相对中心的偏移反向滚动，4 张平铺消除边界 */
function drawStarfield(){
  const p=player;
  const ox = p ? (p.x-W/2) : 0, oy = p ? (p.y-H/2) : 0;
  const layers = QUALITY.lv===2 ? 3 : QUALITY.lv===1 ? 2 : 1;
  for(let li=0;li<layers;li++){
    const L=starLayers[li];
    let dx = -ox*L.px, dy = -oy*L.px;
    dx = ((dx % W)+W)%W; dy = ((dy % H)+H)%H;
    ctx.drawImage(L.img, dx-W, dy-H);
    ctx.drawImage(L.img, dx,   dy-H);

/* 暗角预烘焙，避免每帧建渐变 */

/* ---------- 自适应画质 ----------
   2=高（全特效） 1=中（粒子减半、关粒子辉光） 0=低（粒子 1/4、关辉光与拖尾）
   连续 2 秒平均帧时间超标就降档，连续 6 秒富余才升档（滞回避免抖动） */
const QUALITY={lv:2, bgLv:2, glowParticles:true, glowEnemies:true, trails:true, particleMul:1,
  enemyCapMul:1, slowT:0, fastT:0, locked:false, emergency:0};
let frameAvg=16.7, workAvg=6, firstFrameDone=false, pendingResize=false;
/* workMs = 本帧主线程工作耗时；gapMs = 距上一帧的真实间隔。
   真实卡顿可能发生在光栅/合成阶段，因此降档同时观察 gapMs，不能只看 workMs。 */
function perfSample(workMs, gapMs){
  workAvg = workAvg*0.88 + workMs*0.12;
  frameAvg = frameAvg*0.88 + gapMs*0.12;
  tuneRate(workAvg, gapMs);
}
function applyQuality(){
  const lv=QUALITY.lv;
  QUALITY.glowParticles = lv>=2;
  QUALITY.glowEnemies   = lv>=1;
  QUALITY.trails        = lv>=1;
  QUALITY.particleMul   = lv===2?1 : lv===1?0.55 : 0.28;
  QUALITY.enemyCapMul   = lv===2?1 : lv===1?0.85 : 0.62;
  /* 粒子硬上限不提高；高/中/低档分别 1600/900/480。 */
  P_BUDGET = lv===2?P_MAX : lv===1?900 : 480;
}
function applyBackgroundQuality(bgLv, force){
  bgLv=clamp(bgLv|0,0,2);
  if(!force && bgLv===QUALITY.bgLv) return;
  QUALITY.bgLv=bgLv;
  buildBg();
  buildVignette();
}
function scaleCount(n){ const v=n*QUALITY.particleMul; return v<1 ? (Math.random()<v?1:0) : Math.round(v); }

/* ---------- 刷新率探测 + 逻辑频率自适应（最高 185Hz） ----------
   思路：
   1) 启动时采样 rAF 间隔，取中位数匹配常见刷新率，得到屏幕真实刷新率 refreshHz
   2) 逻辑步长跟随"设备扛得住的最高档"，上限 185，触屏设备保守封顶 120
   3) 判据用"每帧实际工作耗时 workMs"而非帧间隔 —— 否则 60Hz 屏跑 185Hz
      逻辑会被误判成掉帧（一个渲染帧内跑了 3 个逻辑步，间隔自然是 16.7ms）
   4) 降级顺序：先降画质（保流畅感的特效优先牺牲），画质见底才降帧率
      升级顺序：先升帧率（流畅度收益最大），到顶后再升画质 */
/* 验收目标是稳定 60FPS：自动模式只锁 60，不再主动把逻辑推进到高刷。
   手动 API/旧存档仍可调用高频率接口，但会被设备上限截断。 */
const HZ_LADDER=[60];
const HZ_CAP=60;
/* 只按 pointer 精度判断；navigator.maxTouchPoints 作为补充，
   覆盖"有触摸屏但当前用鼠标"的二合一设备 */
const UA = (typeof navigator!=='undefined' && navigator.userAgent) || '';
const IS_TOUCH = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
              || ((typeof navigator!=='undefined' && navigator.maxTouchPoints)||0)>0
              /* 微信 X5 / 部分安卓内核的 pointer:coarse 查询不可靠，UA 兜底 */;
const IS_MOBILE_UA = /Android|iPhone|iPad|iPod|Mobile|MicroMessenger|Windows Phone/i.test(UA);
const MOBILE_LIKE = IS_TOUCH || IS_MOBILE_UA;
const HZ_CAP_DEVICE = MOBILE_LIKE ? 120 : HZ_CAP;   // 移动端封顶 120，兼顾发热与耗电

const REFRESH={
  refreshHz:60,      // 探测到的屏幕刷新率
  targetHz:60,       // 允许达到的最高逻辑频率
  logicHz:60,        // 当前逻辑频率
  probe:[], probeN:0, detected:false,
  holdGood:0, holdBad:0,
  manual:false, manualHz:60, lastT:0
};
function setLogicHz(hz){
  REFRESH.logicHz=hz;
  FIXED_DT=1/hz;
  // 步数上限：覆盖约 0.1 秒，够吸收抖动又不致死亡螺旋
  MAX_STEPS=clamp(Math.ceil(0.10*hz), 8, 24);
  acc=0;                       // 换挡后清空累积，避免一次性补跑大量步
  REFRESH.holdGood=0; REFRESH.holdBad=0;
}
function probeRefresh(t){
  if(REFRESH.detected) return;
  const R=REFRESH;
  if(R.probeN>0){
    const d=(t-R.lastT);
    if(d>3 && d<45) R.probe.push(d);      // 过滤异常值
  }
  R.lastT=t;
  if(++R.probeN<48) return;
  R.detected=true;
  if(R.probe.length<8){ R.refreshHz=60; }
  else{
    R.probe.sort((a,b)=>a-b);
    const med=R.probe[R.probe.length>>1];
    const hz=Math.round(1000/med);
    // 匹配最接近的常见刷新率，避免 119.7 这类抖动值
    let best=60, bd=1e9;
    for(const c of [60,75,90,100,120,144,165,180,185,240]){
      const dd=Math.abs(c-hz); if(dd<bd){ bd=dd; best=c; }
    }
    R.refreshHz = best>200?200:best;
  }
  R.targetHz = Math.min(R.refreshHz, HZ_CAP_DEVICE);
  // 恢复上次的手动锁帧设置；否则起步保守（先 60，跑稳再往上爬）
  if(store.hzManual && store.hzManualHz>=60){
    R.manual=true; R.manualHz=store.hzManualHz;
    setLogicHz(Math.min(store.hzManualHz, R.targetHz));
  } else {
    setLogicHz(60);
  }
}
function dropVisualTier(){
  if(QUALITY.lv>0){ QUALITY.lv--; applyQuality(); return true; }
  if(QUALITY.bgLv>0){ applyBackgroundQuality(QUALITY.bgLv-1); return true; }
  return false;
}
function tuneRate(workMs, gapMs){
  const R=REFRESH;
  if(!R.detected) return;
  if(R.manual && QUALITY.locked) return;    // 两个都锁了就完全不动
  const budget=1000/Math.max(60,R.refreshHz);
  /* 主线程和真实帧间隔任一持续超标都视为压力；连续 3 个长帧立即降一档，
     避免原来的 1.4 秒等待在 Boss/大招峰值期间太长。 */
  const sec=Math.min(Math.max(gapMs,1),100)/1000;
  const workerOver=workMs > budget*0.86;
  const frameOver=gapMs > budget*1.22;
  if(workerOver || frameOver){ R.holdBad+=sec; R.holdGood=0; }
  else if(workMs < budget*0.62 && gapMs < budget*0.9){ R.holdGood+=sec; R.holdBad=0; }
  else { R.holdGood=0; R.holdBad=0; }
  if(frameOver){
    QUALITY.emergency++;
    if(QUALITY.emergency>=3 && !QUALITY.locked){
      dropVisualTier(); QUALITY.emergency=0; R.holdBad=0;
    }
  } else QUALITY.emergency=0;
  const canHz   = !R.manual;                 // 手动锁定帧率后不再自动升降
  const canQual = !QUALITY.locked;           // 手动锁定画质后不再自动升降
  if(!canHz && !canQual) return;

  // 升：优先把帧率顶到 targetHz
  if(R.holdGood>5){
    let idx=HZ_LADDER.indexOf(R.logicHz);
    if(idx<0){ idx=0; for(let i=0;i<HZ_LADDER.length;i++) if(HZ_LADDER[i]<=R.logicHz) idx=i; }
    const next=HZ_LADDER[Math.min(idx+1, HZ_LADDER.length-1)];
    if(canHz && next>R.logicHz && next<=R.targetHz){ setLogicHz(next); return; }
    if(canQual && QUALITY.lv<2 && (!canHz || R.logicHz>=R.targetHz)){ QUALITY.lv++; applyQuality(); }
    R.holdGood=0;
  }
  // 降：先砍实体特效/数量，再砍静态背景精度；60Hz 已是稳定目标下限。
  if(R.holdBad>1.4){
    if(canQual) dropVisualTier();
    R.holdBad=0;
  }
}
function hzLabel(){
  const R=REFRESH;
  const q=QUALITY.lv===2?'高':QUALITY.lv===1?'中':'低';
  return R.logicHz+'Hz · 画质'+q+(R.detected&&R.refreshHz!==R.logicHz?(' · 屏'+R.refreshHz):'');
}

/* ---------- 粒子（扁平数组，预分配） ---------- */
const P_MAX=1600;
let P_BUDGET=P_MAX;
const pX=new Float32Array(P_MAX), pY=new Float32Array(P_MAX);
const pVX=new Float32Array(P_MAX), pVY=new Float32Array(P_MAX);
const pL=new Float32Array(P_MAX), pM=new Float32Array(P_MAX), pS=new Float32Array(P_MAX);
const pR=new Uint8Array(P_MAX), pG=new Uint8Array(P_MAX), pB=new Uint8Array(P_MAX);
const pD=new Float32Array(P_MAX);
let pCount=0;
function emit(x,y,n,o){
  o=o||{};
  const smin=o.smin||30, smax=o.smax||140;
  const lmin=o.lmin||0.25, lmax=o.lmax||0.6;
  const sizmin=o.sizmin||1.6, sizmax=o.sizmax||3.4;
  const c=o.col||[255,255,255], drag=o.drag===undefined?2.6:o.drag;
  const dir=o.dir, spread=o.spread===undefined?TAU:o.spread;
  const cnt=o.raw?n:scaleCount(n);
  for(let i=0;i<cnt;i++){
    if(pCount>=P_BUDGET) return;
    const k=pCount++;
    const a = dir===undefined ? Math.random()*TAU : dir + (Math.random()-0.5)*spread;
    const sp = smin + Math.random()*(smax-smin);
    pX[k]=x; pY[k]=y;
    pVX[k]=Math.cos(a)*sp; pVY[k]=Math.sin(a)*sp;
    const lf = lmin + Math.random()*(lmax-lmin);
    pL[k]=lf; pM[k]=lf;
    pS[k]=sizmin + Math.random()*(sizmax-sizmin);
    pR[k]=c[0]; pG[k]=c[1]; pB[k]=c[2];
    pD[k]=drag;
  }
}
function updateParticles(dt){
  for(let i=0;i<pCount;i++){
    pL[i]-=dt;
    if(pL[i]<=0){
      const j=--pCount;
      if(j!==i){ pX[i]=pX[j];pY[i]=pY[j];pVX[i]=pVX[j];pVY[i]=pVY[j];
        pL[i]=pL[j];pM[i]=pM[j];pS[i]=pS[j];pR[i]=pR[j];pG[i]=pG[j];pB[i]=pB[j];pD[i]=pD[j]; }
      i--; continue;
    }
    const d=1-pD[i]*dt; const dd=d<0?0:d;
    pVX[i]*=dd; pVY[i]*=dd;
    pX[i]+=pVX[i]*dt; pY[i]+=pVY[i]*dt;
  }
}
function drawParticles(){
  const gp=QUALITY.glowParticles;
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<pCount;i++){
    const t=pL[i]/pM[i]; // 1 → 0
    const a=t*t*0.95;
    const s=pS[i]*(0.35+t*0.85);
    if(gp && s>2.1) drawGlow(pX[i],pY[i],s*2.4,pR[i],pG[i],pB[i],a*0.5);
    ctx.fillStyle=rgba(pR[i],pG[i],pB[i],a);
    ctx.beginPath(); ctx.arc(pX[i],pY[i],s,0,TAU); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
}

/* ---------- 对象池 ---------- */
function Pool(factory,cap){
  this.free=[]; this.factory=factory; this.cap=cap||600;
}
Pool.prototype.get=function(){ return this.free.length?this.free.pop():this.factory(); };
Pool.prototype.put=function(o){ if(this.free.length<this.cap) this.free.push(o); };

/* ---------- 实体 ---------- */
let enemies=[], bullets=[], ebullets=[], gems=[], texts=[], rings=[];
let boss=null;
const pEnemies=new Pool(()=>({}),600);
const pBullets=new Pool(()=>({hits:[]}),800);
const pEBullets=new Pool(()=>({}),900);
const pGems=new Pool(()=>({}),400);
const pTexts=new Pool(()=>({}),120);
const pRings=new Pool(()=>({}),80);

let uid=1;

/* ---------- 空间网格（子弹↔敌人） ---------- */
const CELL=96, GW=Math.ceil(W/CELL)+2, GH=Math.ceil(H/CELL)+2;
const grid=[]; for(let i=0;i<GW*GH;i++) grid.push([]);
const qout=[];
function gi(x,y){
  const cx=clamp(Math.floor(x/CELL),0,GW-1), cy=clamp(Math.floor(y/CELL),0,GH-1);
  return cy*GW+cx;
}
function gridInsert(e){
  const x0=clamp(Math.floor((e.x-e.r)/CELL),0,GW-1), x1=clamp(Math.floor((e.x+e.r)/CELL),0,GW-1);
  const y0=clamp(Math.floor((e.y-e.r)/CELL),0,GH-1), y1=clamp(Math.floor((e.y+e.r)/CELL),0,GH-1);
  for(let cy=y0;cy<=y1;cy++) for(let cx=x0;cx<=x1;cx++) grid[cy*GW+cx].push(e);
}
function gridBuild(){
  for(let i=0;i<grid.length;i++) if(grid[i].length) grid[i].length=0;
  for(let i=0;i<enemies.length;i++){ const e=enemies[i]; if(e.alive) gridInsert(e); }
  if(boss&&boss.alive) gridInsert(boss);
}
/* 去重改用「查询戳」而非 indexOf：避免候选多时的 O(n²) */
let qStamp=0;
function gridQuery(x,y,r){
  qout.length=0;
  const st=++qStamp;
  const x0=clamp(Math.floor((x-r)/CELL),0,GW-1), x1=clamp(Math.floor((x+r)/CELL),0,GW-1);
  const y0=clamp(Math.floor((y-r)/CELL),0,GH-1), y1=clamp(Math.floor((y+r)/CELL),0,GH-1);
  for(let cy=y0;cy<=y1;cy++){
    const row=cy*GW;
    for(let cx=x0;cx<=x1;cx++){
      const b=grid[row+cx];
      for(let i=0;i<b.length;i++){
        const e=b[i];
        if(e._qs===st) continue;
        e._qs=st; qout.push(e);
      }
    }
  }
  return qout;
}
/* 只遍历单个 cell（分离力用，比 9 邻域省一半以上） */
function gridQueryCell(x,y,r){
  qout.length=0;
  const st=++qStamp;
  const cx0=clamp(Math.floor((x-r)/CELL),0,GW-1), cx1=clamp(Math.floor((x+r)/CELL),0,GW-1);
  const cy0=clamp(Math.floor((y-r)/CELL),0,GH-1), cy1=clamp(Math.floor((y+r)/CELL),0,GH-1);
  for(let cy=cy0;cy<=cy1;cy++) for(let cx=cx0;cx<=cx1;cx++){
    const b=grid[cy*GW+cx];
    for(let i=0;i<b.length;i++){ const e=b[i]; if(e._qs===st) continue; e._qs=st; qout.push(e); }
  }
  return qout;
}

function evolutionReady(){
  const p=player;
  for(let i=0;i<EVOLUTIONS.length;i++){
    const ev=EVOLUTIONS[i];
    if(p.evo[ev.w]) continue;
    if(!p.unlocked[ev.w]) continue;
    if(!(p.upg[ev.passive]>0)) continue;
    if((p.wk[ev.w]||0)>=ev.kills) return ev;
  }
  return null;
}
/* 进化进度（0..1），用于 HUD 提示玩家还差什么 */
function evolutionProgress(){
  const p=player;
  for(let i=0;i<EVOLUTIONS.length;i++){
    const ev=EVOLUTIONS[i];
    if(p.evo[ev.w]||!p.unlocked[ev.w]) continue;
    const hasP=p.upg[ev.passive]>0;
    const k=(p.wk[ev.w]||0)/ev.kills;
    return {ev, hasP, k:clamp(k,0,1), ready:hasP&&k>=1};
  }
  return null;
}

/* ---------- 变异词条运行时钩子 ----------
   集中在这里，避免在战斗逻辑里散落 if。 */
function mutDamage(dmg, e){
  const m=player.mut, p=player;
  if(m.closeassim){
    const d=Math.hypot(e.x-p.x, e.y-p.y);
    if(d<240) dmg*=1+0.28*m.closeassim;
  }
  if(m.hotcore){
    // 装甲词缀 / Boss 视为"硬质目标"
    if(e.affix==='armored'||e.boss) dmg*=1+0.55*m.hotcore;
    else dmg*=Math.pow(0.86, m.hotcore);
  }
  if(m.glasscannon) dmg*=1+0.42*m.glasscannon;
  if(m.haltfire && (moveX||moveY)) dmg*=0.60;   // 移动中射击伤害 -40%
  if(m.suppress && e.supStack) dmg*=1+0.025*m.suppress*Math.min(e.supStack,10);
  return dmg;
}
function mutFireInterval(iv){
  const m=player.mut, p=player;
  if(m.bloodpump){
    const lost=1-p.hp/p.maxHp;
    iv/=1+Math.min(0.28, Math.floor(lost*10)*0.07*m.bloodpump);
  }
  if(m.haltfire){
    p.stillT=(p.stillT||0);
    if(!(moveX||moveY)){ if(p.stillT>0.3) iv/=1+0.38*m.haltfire; }
  }
  if(m.phasebolt) iv*=1+0.18*m.phasebolt;
  return iv;
}
function mutSpeed(sp){
  const m=player.mut;
  if(m.closeassim) sp*=Math.pow(0.84, m.closeassim);
  if(player.slowDebuffT>0 && m.closeassim) sp*=0.88;
  return sp;
}
function mutRegen(r){
  // 急救协议：没有击杀时其他回复失效
  if(player.mut.triage && player.killStreakGap>2.5) return 0;
  return r;
}
function mutOnHit(e, dmg, crit){
  const m=player.mut, p=player;
  if(m.detonate){
    // 延迟溅射
    e.fuseT=0.4; e.fuseDmg=dmg*0.45*m.detonate; e.fuseR=90;
  }
  if(m.suppress){ e.supStack=Math.min(10,(e.supStack||0)+1); e.supT=1.5; }
  if(m.phasebolt){ e.slowT=Math.max(e.slowT||0,0.4); e.slowAmt=0.35; }
  if(crit && m.overload){
    const self=3*m.overload;
    p.hp=Math.max(1,p.hp-self);
    p.hitFlash=Math.max(p.hitFlash,0.4);
  }
}
function mutOnKill(){
  const m=player.mut, p=player;
  if(m.triage){
    p.killCounter=(p.killCounter||0)+1;
    if(p.killCounter>=14){ p.killCounter=0; p.hp=Math.min(p.maxHp,p.hp+7);
      ring(p.x,p.y,110,[130,255,200],0.3); }
  }
}
/* 引信延时队列：不依赖敌人生存。
   致命一击时敌人会立刻回池，挂在 e.fuseT 上的引信会随之消失，
   导致"殉爆弹头"在最常见的场景（一枪打死）里完全不生效。 */
const fuseQ=[];
function queueFuse(x,y,t,R,dmg){
  if(fuseQ.length>48) fuseQ.shift();
  fuseQ.push({x,y,t,R,dmg});
}
function detonateAt(x,y,R,dmg){
  ring(x,y,R,[255,150,70],0.4);
  emit(x,y,20,{smin:80,smax:280,lmin:.25,lmax:.55,sizmin:1.6,sizmax:3.6,col:[255,150,70],drag:2.2});
  Audio_.boom(false);
  gridQuery(x,y,R);
  for(let k=0;k<qout.length;k++){
    const o=qout[k]; if(!o.alive) continue;
    const dx=o.x-x, dy=o.y-y; if(dx*dx+dy*dy>R*R) continue;
    if(o.boss){ o.hp-=dmg*0.6; o.flash=1; }
    else damageEnemy(o, dmg, false, o.x, o.y);
  }
  // 近距离反伤：逼玩家停止贴脸扫射
  const p=player;
  if(p && p.alive){
    const pd=Math.hypot(p.x-x,p.y-y);
    if(pd<60 && p.iframe<=0){
      const self=dmg*0.30;
      p.hp=Math.max(1,p.hp-self); p.hitFlash=Math.max(p.hitFlash,0.5);
      addText(p.x,p.y-24,'-'+Math.round(self),[255,140,90],15,0.6);
    }
  }
}
/* 每帧推进：静止计时（战术急停）、击杀间隔（急救协议）、减速、引信溅射 */
function updateMutations(dt){
  const p=player, m=p.mut;
  if(!p.alive) return;
  if(moveX||moveY){ p.stillT=0; } else { p.stillT=(p.stillT||0)+dt; }
  p.killStreakGap=(p.killStreakGap||0)+dt;
  if(p.slowDebuffT>0) p.slowDebuffT=Math.max(0,p.slowDebuffT-dt);
  if(p.swapT>0) p.swapT=Math.max(0,p.swapT-dt);
  // 引信溅射（殉爆弹头）
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    if(!e.alive) continue;
    if(e.fuseT>0){
      e.fuseT-=dt;
      if(e.fuseT<=0){
        const R=e.fuseR||90;
        detonateAt(e.x,e.y,R,e.fuseDmg);
        e.fuseT=0;
      }
    }
    if(e.supT>0){ e.supT-=dt; if(e.supT<=0) e.supStack=0; }
  }
  /* 独立队列：敌人已死/已回池的引信照样按时引爆 */
  for(let i=fuseQ.length-1;i>=0;i--){
    const f=fuseQ[i];
    f.t-=dt;
    if(f.t<=0){ detonateAt(f.x,f.y,f.R,f.dmg); fuseQ.splice(i,1); }
  }
}
/* ---------- 三选一抽取 ----------
   目标不是"三张随机牌"，而是"三张可比较的牌"。
   依次执行：可见性过滤 → 互斥过滤 → 满级过滤 → 近期去重 → 稀有度轮盘 → 权重抽取。
   进化条件满足时，第一个槽位强制给进化（防止错过唯一质变）。 */
const ALL_POOL=UPGRADES.concat(MUTATIONS);
function rememberUpg(id){
  const p=player;
  p.recentUpg.push(id);
  if(p.recentUpg.length>CFG.prog.dedupMemory) p.recentUpg.shift();
}
function rollUpgrades(){
  const p=player, out=[];

  /* 槽位 1：进化保底 */
  const ev=evolutionReady();
  if(ev) out.push({id:'evo_'+ev.w, name:'进化 · '+ev.name, ico:ev.ico,
    rarity:'epic', mut:false, isEvo:true, ev,
    desc:ev.desc, a:()=>{ ev.a(p); }});

  /* 候选池：满级过滤 + 互斥过滤 + 近期去重 */
  const pool=ALL_POOL.filter(u=>{
    if(u.isEvo) return false;
    if((p.upg[u.id]||0)>=(u.max||1)) return false;
    /* 互斥双向判定：冲突可能声明在任一侧 */
    if(u.conflicts){ for(let i=0;i<u.conflicts.length;i++)
      if(p.mut[u.conflicts[i]]) return false; }
    if(u.good){ // 变异词条：检查已持有的词条是否反过来声明了与它冲突
      for(const k in p.mut){ if(!p.mut[k]) continue;
        for(let i=0;i<MUTATIONS.length;i++){
          if(MUTATIONS[i].id===k && MUTATIONS[i].conflicts
             && MUTATIONS[i].conflicts.indexOf(u.id)>=0) return false;
        }
      }
    }
    if(p.recentUpg.indexOf(u.id)>=0) return false;
    return true;
  });
  if(!pool.length){
    // 池子耗尽：通用强化，避免把"无选项"直接呈现给玩家
    out.push({id:'gen',name:'通用强化',ico:'＋',rarity:'common',
      desc:'伤害 / 射速 / 生命 各 +6%',
      a:()=>{p.dmg*=1.06;p.interval*=0.94;p.maxHp=Math.round(p.maxHp*1.06);p.hp=Math.min(p.maxHp,p.hp+6);}});
    return out;
  }

  const W=CFG.prog.rarityW;
  const need=3-out.length;
  for(let k=0;k<need;k++){
    /* 稀有度保底：连续 5 次没出稀有/史诗后，稀有权重 ×3.5 */
    const pity = p.pityCount>=CFG.prog.pityAfter ? CFG.prog.pityMul : 1;
    let rw=Math.random()*(W.common+W.rare+W.epic);
    let rarity='common';
    if(rw<W.epic*pity) rarity='epic';
    else if(rw<W.epic*pity+W.rare*pity) rarity='rare';

    let cand=pool.filter(u=>(u.rarity||'common')===rarity);
    if(!cand.length) cand=pool.slice();

    /* 权重：装备契合 + 已有被动（临近进化）+ 稀有度保底 */
    const weights=cand.map(u=>{
      let w=1;
      if(u.passive!==undefined && p.unlocked[u.passive]) w*=1.35;
      if(u.passive!==undefined && p.weapon===u.passive) w*=1.30;
      if(u.rarity==='epic') w*=0.55;      // 史诗本身已稀有，避免连出
      return w;
    });
    let sum=0; for(let i=0;i<weights.length;i++) sum+=weights[i];
    let r=Math.random()*sum, pick=cand[cand.length-1];
    for(let i=0;i<cand.length;i++){ r-=weights[i]; if(r<=0){ pick=cand[i]; break; } }
    out.push(pick);
    pool.splice(pool.indexOf(pick),1);
    if(!pool.length) break;
  }

  /* 记录：保底计数 + 近期记忆 */
  let gotRare=false;
  for(let i=0;i<out.length;i++){ if(out[i].rarity!=='common') gotRare=true; }
  p.pityCount = gotRare ? 0 : p.pityCount+1;
  for(let i=0;i<out.length;i++) if(!out[i].isEvo) rememberUpg(out[i].id);
  return out;
}

  recycle(enemies,pEnemies); recycle(bullets,pBullets); recycle(ebullets,pEBullets);

/* ---------- 波次 ---------- */
function waveCfg(w){
  const m=CFG.waves[gameMode]||CFG.waves.standard;
  const c=contract;   // 当前环境合约（玩家自选）
  /* 平衡要点（经数值模拟）：
     1) 旧版 interval 与 maxAlive 都是"线性+clamp"，在 w≈17 双双触顶后难度
        完全停滞，而玩家 DPS 仍在叠乘 → 后期越打越空。改成渐近式，永不触底。
     2) 旧版第一波压力比最高（0.30）、之后一路降到 0.06 → 前紧后松。
        用二次血量项让后期敌人跟上玩家的指数成长，同时首波更缓。
     3) dmgMul 无上限，w=30 达 2.7 倍而玩家 maxHp 封顶 250 → 后期被秒。
        改为加软上限，压力改由"密度 + 硬目标比例"承担。 */
  const interval = (0.30 + 0.95/(1+w*0.12)) * m.intervalMul * (c?c.intervalMul:1);
  const maxAlive = Math.round((40 + 130*w/(w+12)) * (c?(c.capMul||1):1));
  /* 二次项让后期敌人跟得上玩家的叠乘成长，但要封顶：
     无限二次增长在 40 分钟以上的超长局会把小怪血量推到失控，
     届时难度应由"密度 + 硬目标比例"承担而不是纯堆血。 */
  const hpMul    = Math.min(9.0, 1 + 0.10*w + 0.0022*w*w) * m.hpMul * (c?c.hpMul:1);
  const dmgMul   = w<=5 ? 1+w*0.032 : Math.min(2.15, 1.16+(w-5)*0.048);
  const base = {
    interval, maxAlive, hpMul, dmgMul,
    spdBonus: Math.min(w*0.013,0.30)*(c?(c.speedMul||1):1)
  };
  base.countMul=c?c.countMul:1;
  base.xpMul=m.xpMul*(c?c.xpMul:1);
  return base;
}
/* Boss 血量走独立曲线：不跟着小怪 hpMul 的二次项一起膨胀，
   否则后期 Boss 会变成纯血包，纯输出时间被拉得过长。 */
function bossHpScale(w){
  const k=Math.max(0,w-1);
  return 1 + 0.05*k + 0.0008*k*k;
}

/* ============================================================
   环境合约：每 5 波让玩家自选下一波环境
   关键是不能形成"永远选最简单"的单一最优解 —— 奖励必须
   改变下一阶段的构筑方向，而不只是补偿难度。
   ============================================================ */
/* 合约定价（修复"永远选最简单"的单一最优解）。
   旧版实际综合压力 = countMul/intervalMul × hpMul：
     dense 1.76×（标注 1.30、经验 1.28）→ 最亏
     elite 0.80×（标注 1.45、经验 1.45）→ 比基准还简单却给最多经验，无脑最优
     frenzy 1.51×（标注 1.40、经验 1.22）→ 偏亏
   现在让四档的「压力 ÷ 经验」大致对齐，且每档确有机制差异：
     dense 数量多但脆、elite 数量少但极硬、frenzy 高速+永久射速。
   capMul 让虫群档的场上上限同步放宽，否则触顶后压力打折。 */

   reward:'经验 +55% · 高频触发类词条收益更高', threat:1.55},

function applyContract(c){
  contract=c; contractPending=false;
  /* 永久射速 +7%，但必须封顶 —— 否则每次都选狂暴奔涌会无限叠乘，
     最终射速快到逻辑步长内连发多颗，破坏平衡与判定 */
  if(c.id==='frenzy') player.interval=Math.max(player.interval*0.93, player.intervalMin);
  if(c.id==='standard') player.rerolls=(player.rerolls||0)+1;
  state=ST.PLAYING; hideUI(); acc=0; last=now(); hitStop=0;
  nextContractAt=time+(gameMode==='quick'?45:120);
  addText(W/2,H*0.3,c.label,c.col,26,1.8,true);
  ring(player.x,player.y,260,c.col,0.7);
  Audio_.tone({type:'triangle',f1:520,f2:900,dur:0.3,gain:0.09,atk:0.01});
}
function pickType(w){
  const t=[
    ['chaser',  w<2?1:Math.max(0.26, 0.68-w*0.035)],
    ['shooter', w<2?0:Math.min(0.28, 0.10+w*0.019)],
    ['charger', w<3?0:Math.min(0.25, 0.05+w*0.019)],
    ['splitter',w<4?0:Math.min(0.21, 0.04+w*0.017)],
    ['sniper',  w<4?0:Math.min(0.18, 0.03+w*0.015)],
    /* 后期需要"硬目标"而非单纯堆小怪，否则叠满输出的玩家会无事可做 */
    ['elite',   w<5?0:Math.min(0.20, 0.02+w*0.011)]
  ];
  let sum=0; for(const x of t) sum+=x[1];
  let r=Math.random()*sum;
  for(const x of t){ r-=x[1]; if(r<=0) return x[0]; }
  return 'chaser';
}
function spawnPos(){
  const m=48, side=(Math.random()*4)|0;
  if(side===0) return {x:rnd(-m,W+m), y:-m};
  if(side===1) return {x:W+m,        y:rnd(-m,H+m)};
  if(side===2) return {x:rnd(-m,W+m), y:H+m};
  return {x:-m, y:rnd(-m,H+m)};
}
function spawnEnemy(type,x,y){
  if(enemies.length>320) return null;
  const d=ETYPE[type], w=wave, cfg=waveCfg(w);
  const e=pEnemies.get();
  e.id=uid++; e.type=type; e.alive=true;
  e.sandbag=false;
  e.x=x; e.y=y; e.vx=0; e.vy=0;
  e.r=d.r; e.col=d.col; e.shape=d.shape; e.ai=d.ai;
  e.maxHp=Math.round(d.hp*cfg.hpMul); e.hp=e.maxHp;
  e.dmg=d.dmg*cfg.dmgMul; e.spd=d.spd*(1+cfg.spdBonus);
  /* 第一波沙包：让新手在低风险环境摸索冲刺无敌帧与换枪，
     而不是在波次压力中被迫同时学习所有系统 */
  if(sandbox){
    e.maxHp=Math.round(e.maxHp*0.45); e.hp=e.maxHp;
    e.dmg*=0.35; e.spd*=0.62;
    e.sandbag=true;
  }
  e.xp=d.xp; e.score=d.score;
  e.rot=rnd(0,TAU); e.spin=rnd(-1.6,1.6);
  e.flash=0; e.hitCd=0; e.shootCd=rnd(0.8,2.2); e.strafe=Math.random()<0.5?1:-1;
  e.phase=0; e.timer=0; e.knock=0; e.kx=0; e.ky=0; e.spawnT=0.28;
  /* 对象池复用：这些字段只有特定词缀才赋值，不重置会从上一个池对象残留，
     导致新敌人首次分离提前触发、或相位敌人首次进入无敌时不画护盾环 */
  e.sepT=0; e._phased=false; e.phaseT=undefined;
  /* 变异词条运行时字段：同样只在特定情况赋值，池复用时必须全部清零。
     不清零会让新敌人带着上一只的引信（凭空爆炸）、压制层数或沙包标记。 */
  /* 注意：sandbag 在上面的沙包波分支里被设为 true，这里不能覆盖它，
     否则"训练靶"标记永远不生效（旧实现正是如此）。 */
  e.fuseT=0; e.fuseDmg=0; e.fuseR=0;
  e.supStack=0; e.supT=0; e.slowT=0; e.slowAmt=0; e.knock=0;
  /* 词缀：精英必带；普通怪从 wave3 起概率带，随波次升高 */
  e.affix=null;
  const affixChance = type==='elite' ? 1 : (w>=3 ? Math.min(0.26, 0.03+w*0.016) : 0);
  if(Math.random()<affixChance){
    const a=AFFIX[(Math.random()*AFFIX.length)|0];
    e.affix=a.id;
    if(a.id==='armored') e.maxHp=Math.round(e.maxHp*1.35), e.hp=e.maxHp;
    if(a.id==='hasted')  e.spd*=1.7;
    if(a.id==='phasing') e.phaseT=rnd(2,4);
    e.score=Math.round(e.score*1.5);
    e.xp=Math.round(e.xp*1.4);
  }
  enemies.push(e); return e;
}

/* ---------- Boss ---------- */
const BOSS_DEF=[
  {name:'守卫者 · AEGIS',  r:62, hp:1100, col:[200,90,255],  shape:'hex'},
  {name:'母舰 · BROOD',    r:70, hp:1700, col:[255,90,140],  shape:'star'},
  {name:'虚空之眼 · VOID', r:58, hp:2300, col:[120,190,255], shape:'eye'},
  {name:'终焉 · OMEGA',    r:76, hp:5200, col:[255,140,60],  shape:'star2'},
  /* 新增 3 个机制型 Boss：瞬移残影 / 弹墙缺口 / 空间裂隙 */
  {name:'镜像 · MIRROR',   r:60, hp:2900, col:[110,255,220], shape:'dia'},
  {name:'潮汐 · TIDE',     r:72, hp:3500, col:[90,200,255],  shape:'hex'},
  {name:'裂隙 · RIFT',     r:64, hp:4200, col:[255,110,190], shape:'star2'}
];
/* 登场顺序：先基础三型，再三个新机制，最后 OMEGA 压轴；之后循环并叠血量 */
const BOSS_ORDER=[0,1,2,4,5,6,3];
let bossIndex=0, nextBossAt=0;
function spawnBoss(){
  const cfg=waveCfg(wave);
  const kind=BOSS_ORDER[bossIndex % BOSS_ORDER.length];
  const d=BOSS_DEF[kind];
  /* 每轮循环后血量 +45%，保证后期 Boss 仍有压迫感但不会突然断崖 */
  const lap=Math.floor(bossIndex/BOSS_ORDER.length);
  const mul=1+lap*0.45;
  const D=DF();
  const bhp=Math.round(d.hp*mul*bossHpScale(wave)*D.hp);
  bossIndex++;
  boss={ id:uid++, boss:true, kind, name:d.name, alive:true,
    x:W/2, y:-90, vx:0, vy:0, r:d.r, col:d.col, shape:d.shape,
    maxHp:bhp, hp:bhp,
    /* 撞击伤害：旧版 26×1.9≈49，一次去掉半血，是"太难"的主要来源之一 */
    dmg:26*Math.min(1.9,cfg.dmgMul)*D.contact, rot:0, flash:0, entry:2.0, phase:1, timer:0,
    atkCd:1.6, spiralA:0, dying:0, xp:70, score:1200+bossIndex*180,
    age:0, over:false, echoes:[], rifts:[], blinkT:1.2, riftT:0.6 };
  /* 战斗期间不再排下一个；击杀后由 bossUpdate 重新排期 */
  nextBossAt=Infinity;
  /* 入场补给：把"刚打完一波小怪就撞上满弹幕 Boss"的必死开局，
     改成一个有护盾、有大招、有回血的起手式。硬核档不给。 */
  if(D.shield>0){
    player.shield=Math.max(player.shield,D.shield); player.shieldFlash=1;
    ring(player.x,player.y,190,[120,220,255],0.6);
  }
  if(D.ult>0) player.ult=Math.min(player.ultMax, player.ult+D.ult);
  if(D.heal>0) player.hp=Math.min(player.maxHp, player.hp+player.maxHp*D.heal);
  Audio_.warn(); dangerPulse=1.6; flashScreen=Math.max(flashScreen,0.22);
  addText(W/2,H*0.24,'⚠ '+d.name+' 接近',d.col,30,1.9,true);
  addText(W/2,H*0.24+34,
    'BOSS 来袭 · '+D.label+' 难度'+(D.shield>0?' · 已注入护盾':' · 无补给'),
    D.col, 15, 2.1, true);
  ring(W/2,H*0.24,260,d.col,0.8);
}
function bossUpdate(dt){
  const b=boss;
  if(!b) return;
  b.rot+=dt*0.5;
  if(b.dying>0){
    b.dying-=dt;
    b.flash=Math.min(1,b.flash+dt*4);
    if(Math.random()<pStep(0.55)){
      const a=Math.random()*TAU, rr=rnd(0,b.r);
      emit(b.x+Math.cos(a)*rr,b.y+Math.sin(a)*rr,3,{smin:20,smax:180,lmin:.3,lmax:.7,
        sizmin:2,sizmax:5,col:b.col,drag:1.8});
      if(Math.random()<pStep(0.25)){ shake=Math.max(shake,5); Audio_.boom(false); }
    }
    if(b.dying<=0){
      emit(b.x,b.y,90,{smin:60,smax:520,lmin:.6,lmax:1.3,sizmin:2,sizmax:7,col:b.col,drag:1.4});
      emit(b.x,b.y,40,{smin:30,smax:260,lmin:.5,lmax:1.1,sizmin:3,sizmax:8,col:[255,255,255],drag:1.6});
      spawnDebris(b.x,b.y,b.col,b.r*2.0,26);
      for(let i=0;i<3;i++) ring(b.x,b.y,b.r*(3+i*2.4),b.col,0.6+i*0.18);
      shake=Math.max(shake,13*store.shake); flashScreen=Math.max(flashScreen,0.55);
      hitStop=Math.max(hitStop,0.10);
      Audio_.bossdie();
      const bs=Math.round(b.score*(1+(wave-1)*0.1)*comboMul);
      score+=bs;
      kills++;
      for(let i=0;i<10;i++) dropGem(b.x+rnd(-60,60),b.y+rnd(-60,60),7,0);
      dropGem(b.x,b.y,0,1); dropGem(b.x+40,b.y,0,1); dropGem(b.x-40,b.y,0,1);
      dropGem(b.x-70,b.y+30,0, 2+((Math.random()*3)|0));
      dropGem(b.x+70,b.y+30,0, 2+((Math.random()*3)|0));
      addText(b.x,b.y-60,'+'+bs,[255,220,120],30,1.4,true);
      boss=null;
      /* 击杀后隔一段时间再来下一个：标准局 88 秒 / 快速局 52 秒 */
      nextBossAt=time+(gameMode==='quick'?45:76);
      addText(W/2,H*0.30,'区域肃清 · 下一位来袭',[150,240,255],20,1.8,true);
    }
    return;
  }
  if(b.entry>0){
    b.entry-=dt; b.y=lerp(b.y,H*0.28,1-Math.pow(0.001,dt));
    return;
  }
  const p=player;
  // 超时过载：僵持超过阈值后受伤逐秒递增，保证战斗一定能收束。
  // 阈值按难度缩短，避免低 DPS 玩家在满屏弹幕里被拖死。
  b.age+=dt;
  if(!b.over && b.age>DF().overAt){
    b.over=true;
    addText(b.x,b.y-b.r-30,'核心过载 · OVERLOAD',[255,120,90],22,1.6,true);
    ring(b.x,b.y,b.r*5,[255,120,90],0.8); shake=Math.max(shake,8*store.shake);
    Audio_.tone({type:'sawtooth',f1:140,f2:640,dur:0.7,gain:0.12,atk:0.02});
  }
  /* 过载冒火星：必须放在逻辑更新里按 dt 累积。
     放在 render 里（每渲染帧触发）会让粒子速率随屏幕刷新率线性放大 ——
     60Hz 屏约 21 次/秒，185Hz 屏变成 65 次/秒，白白吃掉三倍粒子预算。 */
  if(b.over){
    b.sparkT=(b.sparkT||0)+dt;
    while(b.sparkT>1/21){
      b.sparkT-=1/21;
      emit(b.x+rnd(-b.r,b.r),b.y+rnd(-b.r,b.r),1,
        {smin:20,smax:110,lmin:.25,lmax:.6,sizmin:1.5,sizmax:3.4,col:[255,140,80],drag:2});
    }
  }
  const dx=p.x-b.x, dy=p.y-b.y, dist=Math.hypot(dx,dy)||1;
  const hpFrac=b.hp/b.maxHp;
  const newPhase = hpFrac>0.62?1 : hpFrac>0.30?2 : 3;
  if(newPhase!==b.phase){ b.phase=newPhase; b.atkCd=0.9; ring(b.x,b.y,b.r*4,b.col,0.6);
    shake=Math.max(shake,7*store.shake); Audio_.boom(false); }
  // 移动
  const spd = b.phase===1?58 : b.phase===2?78 : 96;
  const ux=dx/dist, uy=dy/dist;
  /* 注意：此处不能引用下面才声明的 const kind（TDZ），直接读 b.kind */
  const want = b.kind===4 ? (dist>420?0.6:(dist<300?-0.6:0)) : (dist>320?1:(dist<200?-0.8:0));
  b.vx=lerp(b.vx,ux*spd*want,1-Math.pow(0.06,dt));
  b.vy=lerp(b.vy,uy*spd*want,1-Math.pow(0.06,dt));
  b.x=clamp(b.x+b.vx*dt, b.r+10, W-b.r-10);
  b.y=clamp(b.y+b.vy*dt, b.r+10, H-b.r-10);
  // 攻击
  b.timer+=dt;
  const kind=b.kind;
  /* 攻击节奏缩放：只把缩放后的 dt 交给攻击逻辑（atkCd 递减、螺旋角、
     召唤计时都随之变慢），而 b.age / phase / 移动仍用真实 dt。
     这样"降频"不会连带拖慢过载计时或让 Boss 变木桩。 */
  const adt=dt*DF().atkMul;
  /* 机制型 Boss 各自走独立逻辑，与三种基础弹幕彻底区分 */
  if(kind===3){ omegaAttack(b,adt); return; }
  if(kind===4){ mirrorAttack(b,adt); return; }
  if(kind===5){ tideAttack(b,adt); return; }
  if(kind===6){ riftAttack(b,adt); return; }
  b.atkCd-=adt;
  if(b.atkCd<=0){
    if(kind===0){ // 守卫者：环形弹幕 + 自机狙
      const n=10+b.phase*4, off=Math.random()*TAU;
      for(let i=0;i<n;i++) bossBullet(b.x,b.y,off+i/n*TAU,240+b.phase*20,7,10*b.phase);
      for(let i=-1;i<=1;i++) bossBullet(b.x,b.y,Math.atan2(dy,dx)+i*0.22,340,6,12);
      b.atkCd = b.phase===1?2.2 : b.phase===2?1.7 : 1.25;
    }else if(kind===1){ // 母舰：螺旋 + 召唤
      const arms=2+b.phase;
      b.spiralA+=0.55;
      for(let i=0;i<arms;i++){
        const a=b.spiralA+i/arms*TAU;
        bossBullet(b.x,b.y,a,230,6,9);
      }
      if(b.phase>=2 && b.timer>3.2){ b.timer=0;
        for(let i=0;i<3;i++){ const a=Math.random()*TAU;
          spawnEnemy('spawn', b.x+Math.cos(a)*70, b.y+Math.sin(a)*70); } }
      b.atkCd = b.phase===1?0.34 : b.phase===2?0.28 : 0.2;
    }else{ // 虚空之眼：快速环形 + 点射
      const n=14+b.phase*5, off=b.spiralA+=0.31;
      for(let i=0;i<n;i++) bossBullet(b.x,b.y,off+i/n*TAU,270+b.phase*25,6,9);
      if(b.phase>=2){ for(let i=0;i<5;i++) bossBullet(b.x,b.y,Math.atan2(dy,dx)+rnd(-0.5,0.5),420,5,11); }
      b.atkCd = b.phase===1?1.7 : b.phase===2?1.3 : 0.95;
    }
    Audio_.eshoot();
  }
}
/* Boss kind 3（终焉 OMEGA）：环形 + 双螺旋 + 自机狙三合一，阶段越高越密 */
function omegaAttack(b,dt){
  const p=player;
  const dx=p.x-b.x, dy=p.y-b.y;
  b.atkCd-=dt;
  b.spiralA+=dt*1.5;
  if(b.atkCd<=0){
    if(b.phase===1){
      const n=16, off=b.spiralA;
      for(let i=0;i<n;i++) bossBullet(b.x,b.y,off+i/n*TAU,250,6,10);
      b.atkCd=1.5;
    }else if(b.phase===2){
      for(let i=0;i<3;i++){
        const a=b.spiralA*1.6+i/3*TAU;
        bossBullet(b.x,b.y,a,280,6,10);
        bossBullet(b.x,b.y,-a*0.8+i/3*TAU,240,5,10);
      }
      for(let i=-2;i<=2;i++) bossBullet(b.x,b.y,Math.atan2(dy,dx)+i*0.16,400,5,12);
      b.atkCd=0.62;
    }else{
      const n=22, off=b.spiralA*2.1;
      for(let i=0;i<n;i++) bossBullet(b.x,b.y,off+i/n*TAU,300,6,11);
      for(let i=0;i<4;i++) bossBullet(b.x,b.y,b.spiralA*-1.4+i/4*TAU,220,5,10);
      for(let i=-3;i<=3;i++) bossBullet(b.x,b.y,Math.atan2(dy,dx)+i*0.13,460,5,13);
      if(b.timer>4.5){ b.timer=0;
        for(let i=0;i<3;i++){ const a=Math.random()*TAU;
          spawnEnemy('spawn', b.x+Math.cos(a)*80, b.y+Math.sin(a)*80); } }
      b.atkCd=0.5;
    }
    Audio_.eshoot();
  }
}

/* ---------- 新增机制型 Boss ---------- */

/* kind 4 镜像 · MIRROR：瞬移并在原点留下残影，残影与本体同时齐射。
   玩法变化：玩家不能靠"站定输出"打，必须不断重新定位，且残影会封走位。 */
function mirrorAttack(b,dt){
  const p=player;
  b.blinkT-=dt;
  if(b.blinkT<=0){
    b.blinkT = b.phase===1?3.6 : b.phase===2?2.8 : 2.2;
    b.echoes.push({x:b.x,y:b.y,t:2.7,a:Math.random()*TAU,cd:0.45});
    if(b.echoes.length>3) b.echoes.shift();
    const a=Math.random()*TAU, r=rnd(270,370);
    b.x=clamp(p.x+Math.cos(a)*r, b.r+10, W-b.r-10);
    b.y=clamp(p.y+Math.sin(a)*r, b.r+10, H-b.r-10);
    b.vx=0; b.vy=0;
    ring(b.x,b.y,b.r*2.6,b.col,0.55);
    emit(b.x,b.y,20,{smin:60,smax:280,lmin:.25,lmax:.6,sizmin:2,sizmax:4.2,col:b.col,drag:2});
    Audio_.tone({type:'sine',f1:1500,f2:380,dur:0.18,gain:0.09,atk:0.004});
    /* 残影齐射：每个残影独立发一圈，形成多点包围 */
    for(const ec of b.echoes){
      const n=6+b.phase*2;
      for(let i=0;i<n;i++) bossBullet(ec.x,ec.y,ec.a+i/n*TAU,250,5,9);
      ring(ec.x,ec.y,74,b.col,0.38);
    }
  }
  b.atkCd-=dt;
  if(b.atkCd<=0){
    const dx=p.x-b.x, dy=p.y-b.y;
    for(let i=-1;i<=1;i++) bossBullet(b.x,b.y,Math.atan2(dy,dx)+i*0.16,380,6,11);
    if(b.phase===3){
      const n=14, off=Math.random()*TAU;
      for(let i=0;i<n;i++) bossBullet(b.x,b.y,off+i/n*TAU,240,5,9);
    }
    b.atkCd=b.phase===1?1.7:b.phase===2?1.3:0.95;
    Audio_.eshoot();
  }
  /* 残影不是一次性特效：存活期间持续朝玩家点射，
     否则 1 秒后就消失，玩家感受不到"被多个镜像包围"的机制 */
  for(const ec of b.echoes){
    ec.cd-=dt;
    if(ec.cd<=0){
      ec.cd=1.15;
      const aa=Math.atan2(p.y-ec.y,p.x-ec.x);
      for(let i=-1;i<=1;i++) bossBullet(ec.x,ec.y,aa+i*0.20,260,5,8);
      ring(ec.x,ec.y,44,b.col,0.25);
    }
  }
  for(let i=b.echoes.length-1;i>=0;i--){
    b.echoes[i].t-=dt; if(b.echoes[i].t<=0) b.echoes.splice(i,1);
  }
}

/* kind 5 潮汐 · TIDE：整排弹墙从屏幕一侧横扫，中间留一道安全缺口。
   玩法变化：从"躲散弹"变成"读缺口、提前走位"，阶段越高缺口越窄。 */
function tideAttack(b,dt){
  b.atkCd-=dt;
  if(b.atkCd>0) return;
  const vertical=Math.random()<0.5;
  const span=vertical?H:W;
  const gapW=b.phase===1?200:b.phase===2?155:118;
  const gapStart=rnd(40,Math.max(41,span-gapW-40));
  const n=vertical?18:26;
  const sp=200+b.phase*22;
  if(vertical){
    for(let i=0;i<n;i++){
      const y=i/n*H;
      if(y>gapStart && y<gapStart+gapW) continue;
      bossBullet(-20,y,0,sp,6,10);
      if(b.phase>=2) bossBullet(W+20,y,Math.PI,sp,5,9);
    }
    addText(60, gapStart+gapW/2, '⇢ 缺口', [120,255,220], 16, 1.2, true);
  }else{
    for(let i=0;i<n;i++){
      const x=i/n*W;
      if(x>gapStart && x<gapStart+gapW) continue;
      bossBullet(x,-20,Math.PI/2,sp,6,10);
      if(b.phase>=2) bossBullet(x,H+20,-Math.PI/2,sp,5,9);
    }
    addText(gapStart+gapW/2, 60, '⇣ 缺口', [120,255,220], 16, 1.2, true);
  }
  ring(b.x,b.y,b.r*2.6,b.col,0.42);
  b.atkCd=b.phase===1?2.6:b.phase===2?2.1:1.7;
  Audio_.eshoot();
}

/* kind 6 裂隙 · RIFT：在场上开传送门，弹幕从裂隙射向玩家而非本体。
   玩法变化：盯着 Boss 躲是无效的，必须同时管理多个威胁源的位置。 */
function riftAttack(b,dt){
  const p=player;
  b.riftT-=dt;
  if(b.riftT<=0){
    b.riftT=b.phase===1?5.0:b.phase===2?4.0:3.2;
    b.rifts=[];
    const n=2+(b.phase>=2?1:0);
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU, r=rnd(230,430);
      const rx=clamp(p.x+Math.cos(a)*r,70,W-70), ry=clamp(p.y+Math.sin(a)*r,70,H-70);
      b.rifts.push({x:rx,y:ry,t:b.riftT+0.4});
      ring(rx,ry,96,b.col,0.55);
      emit(rx,ry,14,{smin:30,smax:150,lmin:.3,lmax:.7,sizmin:1.6,sizmax:3.4,col:b.col,drag:2});
    }
    Audio_.tone({type:'triangle',f1:280,f2:920,dur:0.32,gain:0.09,atk:0.02});
  }
  b.atkCd-=dt;
  if(b.atkCd<=0){
    for(const rf of b.rifts){
      const a=Math.atan2(p.y-rf.y,p.x-rf.x);
      const fan=b.phase===1?3:b.phase===2?5:7;
      for(let i=0;i<fan;i++)
        bossBullet(rf.x,rf.y,a+(i-(fan-1)/2)*0.14, 300+b.phase*20, 5.5, 10);
      ring(rf.x,rf.y,54,b.col,0.3);
    }
    b.atkCd=b.phase===1?1.25:b.phase===2?0.95:0.72;
    Audio_.eshoot();
  }
  for(let i=b.rifts.length-1;i>=0;i--){
    b.rifts[i].t-=dt; if(b.rifts[i].t<=0) b.rifts.splice(i,1);
  }
}

/* ---------- 子弹 ---------- */
function fire(){
  const p=player;
  const w=curWeapon();
  const base=Math.atan2(aimY-p.y, aimX-p.x);
  const rc=p.mut.ricochet||0;
  const n=Math.max(1,p.shots+w.shotsAdd), spread=w.spread+(rc?0.14:0);
  const dm=p.dmg*w.dmgMul*(p.frenzy>0?1.35:1);
  /* 贯通核心：额外穿透 2 层（代价在命中时按已穿透数递减伤害） */
  const pc=p.pierce+w.pierceAdd+(p.mut.overbore||0)*2;
  const sp0=p.bspd*w.bspdMul;
  const sz=p.bsize*w.sizeMul*(1+0.45*(p.mut.phasebolt||0));
  const hm=p.home+w.homeAdd;
  for(let i=0;i<n;i++){
    const a=base + (n===1?0:(i-(n-1)/2)*spread) + rnd(-0.018,0.018);
    const b=pBullets.get();
    b.x=p.x+Math.cos(p.angle)*16; b.y=p.y+Math.sin(p.angle)*16;
    const sp=sp0*rnd(0.98,1.02);
    b.vx=Math.cos(a)*sp; b.vy=Math.sin(a)*sp; b.speed=sp;
    b.r=sz; b.dmg=dm; b.pierce=pc;
    b.life=(w.id===2?1.6:1.15)*(rc?0.68:1);
    b.bounce=rc?1:0;
    b.crit=Math.random()<p.crit; b.hits.length=0; b.rot=a; b.alive=true;
    b.home=hm; b.homeT=0; b.wcol=w.col;
    bullets.push(b);
  }
  p.recoil=Math.min(7,p.recoil+3.4);
  // 开火相机微推：方向与枪口相反，幅度随弹量递增但封顶
  const kick=Math.min(3.2, 1.1+ (n-1)*0.30 + (w.id===2?1.4:0));
  camKickX-=Math.cos(base)*kick; camKickY-=Math.sin(base)*kick;
  emit(p.x+Math.cos(p.angle)*18,p.y+Math.sin(p.angle)*18, w.id===2?8:3,
    {dir:base,spread:w.id===1?1.3:0.7,smin:60,smax:w.id===2?300:180,
     lmin:.08,lmax:.18,sizmin:1.4,sizmax:2.6,col:w.col,drag:6});
  if(w.id===2) Audio_.tone({type:'sawtooth',f1:520,f2:130,dur:0.16,gain:0.09,atk:0.004});
  else Audio_.shoot();
}
/* 武器射速在计算射击间隔时生效 */
function fireInterval(){ const w=curWeapon(); return mutFireInterval(player.interval*w.rateMul); }
/* 敌方子弹配色：不同类型用不同颜色，让"这一发是谁打的、有多危险"一眼可读。
   橙红 = 普通敌弹；品红 = 狙击穿刺弹（高速高伤，必须最显眼）；
   Boss 战期间的弹幕自动染成该 Boss 的主色，形成整场统一视觉。 */
const EB_COL=[255,130,110];
const SNIPE_COL=[255,72,226];
/* Boss 弹幕专用出口：难度档位在此统一缩放单发伤害。
   不直接改 eBullet，避免把普通敌弹（上一轮已平衡过）一起削弱。 */
function bossBullet(x,y,ang,sp,r,dmg,kind){
  return eBullet(x,y,ang,sp,r,Math.max(1,Math.round(dmg*DF().bulletDmg)),undefined,kind);
}
function eBullet(x,y,ang,sp,r,dmg,col,kind){
  if(ebullets.length>700) return;
  const b=pEBullets.get();
  b.x=x; b.y=y; b.vx=Math.cos(ang)*sp; b.vy=Math.sin(ang)*sp;
  b.r=r; b.dmg=dmg; b.life=6.5;
  b.col=col || (boss && boss.alive && boss.dying<=0 ? boss.col : EB_COL);
  b.kind=kind||0;                 // 0 普通 · 1 狙击穿刺弹
  b.sp=sp; b.alive=true;
  ebullets.push(b);
}
