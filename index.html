/* ---------- 大招：超新星 NOVA ----------
   击杀充能，满了手动释放。清弹幕 + 全屏伤害，是被围住时的解围手段 */
function castNova(){
  const p=player;
  if(!p.alive || p.ult<p.ultMax) return;
  p.ult=0; p.ultReadyT=0.6; novaWindow=2.4; tutNotify('ult');

  const R=760;                       // 覆盖全屏有余
  const dmg=90+wave*12;

  // 1) 净化敌方弹幕
  let cleared=0;
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i];
    emit(b.x,b.y,2,{smin:30,smax:120,lmin:.2,lmax:.45,sizmin:1.2,sizmax:2.4,col:b.col||EB_COL,drag:4});
    ebullets[i]=ebullets[ebullets.length-1]; ebullets.pop(); pEBullets.put(b); cleared++;
  }
  // 2) 全屏伤害
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i]; if(!e.alive) continue;
    const dx=e.x-p.x, dy=e.y-p.y, d2=dx*dx+dy*dy;
    if(d2>R*R) continue;
    const falloff=1-Math.sqrt(d2)/R*0.45;   // 越远略弱
    if(e.boss){ e.hp-=dmg*falloff*0.8; e.flash=1;
      if(e.hp<=0 && e.dying<=0){ e.dying=1.25; } }
    else damageEnemy(e, dmg*falloff, false, e.x, e.y);
  }
  // 3) 表现
  for(let i=0;i<4;i++) ring(p.x,p.y, 220+i*190, i%2?[255,220,140]:[150,240,255], 0.55+i*0.12);
  emit(p.x,p.y,70,{smin:120,smax:600,lmin:.5,lmax:1.1,sizmin:2,sizmax:5.5,col:[255,230,170],drag:1.6});
  spawnDebris(p.x,p.y,[255,225,160],26,14);
  shake=Math.max(shake,14*store.shake); flashScreen=Math.max(flashScreen,0.60);
  hitStop=Math.max(hitStop,0.11);
  Audio_.boom(true);
  Audio_.tone({type:'sawtooth',f1:180,f2:1400,dur:0.55,gain:0.14,atk:0.008});
  addText(p.x,p.y-50,'超新星 NOVA',[255,230,150],28,1.5,true);
  if(cleared>6) addText(p.x,p.y-20,'净化 '+cleared+' 发弹幕',[255,200,150],17,1.2,true);
}

/* ---------- 特效 ---------- */
/* 几何碎片：击杀时炸出的旋转线段，比纯圆点更有"物体碎掉"的说服力 */
let debris=[];
const pDebris=new Pool(()=>({}),240);
function spawnDebris(x,y,col,size,n){
  const cnt=scaleCount(n);
  for(let i=0;i<cnt;i++){
    if(debris.length>200) return;
    const o=pDebris.get();
    const a=Math.random()*TAU, sp=rnd(90,340);
    o.x=x; o.y=y; o.vx=Math.cos(a)*sp; o.vy=Math.sin(a)*sp;
    o.rot=Math.random()*TAU; o.spin=rnd(-9,9);
    o.len=rnd(size*0.5,size*1.25); o.col=col;
    o.life=rnd(0.45,0.95); o.max=o.life;
    debris.push(o);
  }
}
function updateDebris(dt){
  for(let i=debris.length-1;i>=0;i--){
    const o=debris[i];
    o.life-=dt;
    if(o.life<=0){ debris[i]=debris[debris.length-1]; debris.pop(); pDebris.put(o); continue; }
    const d=1-2.6*dt;
    o.vx*=d; o.vy*=d;
    o.x+=o.vx*dt; o.y+=o.vy*dt;
    o.rot+=o.spin*dt;
  }
}
function drawDebris(){
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<debris.length;i++){
    const o=debris[i], t=o.life/o.max;
    const c=o.col, a=t*0.95;
    ctx.strokeStyle=rgba(c[0],c[1],c[2],a);
    ctx.lineWidth=1.8;
    const hx=Math.cos(o.rot)*o.len*0.5, hy=Math.sin(o.rot)*o.len*0.5;
    ctx.beginPath(); ctx.moveTo(o.x-hx,o.y-hy); ctx.lineTo(o.x+hx,o.y+hy); ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';
}

function ring(x,y,maxR,col,life){
  const o=pRings.get(); o.x=x;o.y=y;o.r=6;o.maxR=maxR;o.life=life;o.max=life;o.col=col;
  rings.push(o);
}
/* prio=true 的是"系统级"提示（大招/换枪/Boss），满屏伤害数字也挤不掉它 */
function addText(x,y,str,col,size,life,prio){
  if(texts.length>60){
    if(!prio) return;
    const old=texts.shift(); pTexts.put(old);   // 挤掉最老的一条，保证重要信息可见
  }
  const o=pTexts.get(); o.x=x;o.y=y;o.str=str;o.col=col;o.size=size||18;o.life=life||0.8;o.max=o.life;
  texts.push(o);
}
function dropGem(x,y,val,type){
  if(gems.length>260) return;
  const o=pGems.get();
  o.x=x;o.y=y;o.vx=rnd(-40,40);o.vy=rnd(-40,40);o.val=val;o.type=type;o.life=26;o.t=0;
  gems.push(o);
}
function damageEnemy(e,dmg,crit,srcX,srcY){
  dmg=mutDamage(dmg,e);
  // 装甲：硬减伤；相位：无敌窗口内完全免伤（打到只出火花不掉血）
  if(e.affix==='armored') dmg*=0.55;
  if(e.affix==='phasing' && e.phaseT!==undefined && e.phaseT<0){
    emit(srcX,srcY,6,{smin:40,smax:150,lmin:.16,lmax:.34,sizmin:1.2,sizmax:2.4,col:[130,235,255],drag:5});
    addText(e.x, e.y-e.r-4, '相位', [130,235,255], 14, 0.5);
    return;
  }
  e.hp-=dmg; e.flash=1;
  addText(e.x+rnd(-6,6), e.y-e.r-4, (crit?Math.round(dmg)+'!':''+Math.round(dmg)),
    crit?[255,230,90]:[235,250,255], crit?21:16, crit?0.85:0.62);
  emit(srcX,srcY,crit?12:7,{smin:50,smax:210,lmin:.16,lmax:.36,sizmin:1.3,sizmax:2.8,
    col:crit?[255,220,110]:e.col,drag:5});
  if(crit) Audio_.crit(); else Audio_.hit();
  hitStop=Math.max(hitStop, crit?0.055:0.028);
  mutOnHit(e, dmg, crit);
  if(e.hp<=0){
    /* 致命一击：先把引信摘到独立队列，否则 killEnemy 回池后引信丢失 */
    if(e.fuseT>0){ queueFuse(e.x,e.y,Math.max(0.06,e.fuseT),e.fuseR||90,e.fuseDmg); e.fuseT=0; }
    killEnemy(e);
  }
}
function killEnemy(e){
  if(!e.alive) return;
  e.alive=false; kills++;
  const big = e.r>=20;

  /* 连杀：2.6 秒内连续击杀累积，倍率最高 x4，给玩家"别停手"的正反馈 */
  combo = (time-comboLast<2.6) ? combo+1 : 1;
  comboLast = time;
  if(combo>comboBest) comboBest=combo;
  comboMul = Math.min(4, 1+(combo-1)*0.12);
  comboPop = 1;
  /* 挑战进度 */
  if(challenge && !challenge.done){
    if(challenge.type==='kill') challengeProgress(1);
    else if(challenge.type==='elite' && e.type==='elite') challengeProgress(1);
    else if(challenge.type==='nova' && novaWindow>0) challengeProgress(1);
    else if(challenge.type==='combo' && combo>=challenge.target) completeChallenge();
  }

  emit(e.x,e.y,big?34:16,{smin:40,smax:big?330:210,lmin:.3,lmax:big?.85:.55,
    sizmin:1.6,sizmax:big?5:3.2,col:e.col,drag:2.2});
  emit(e.x,e.y,big?10:5,{smin:20,smax:120,lmin:.25,lmax:.6,sizmin:2,sizmax:4,col:[255,255,255],drag:3});
  spawnDebris(e.x,e.y,e.col,e.r*(big?1.5:1.1), big?9:5);
  ring(e.x,e.y,big?e.r*5:e.r*3.4,e.col,big?0.5:0.34);
  shake=Math.max(shake,(big?6:2.4)*store.shake);
  Audio_.boom(big);

  const val=Math.round(e.score*(1+(wave-1)*0.1)*comboMul);
  score+=val;
  killsInWave++;
  /* 大招充能：精英给得多，普通敌人给一点，保证每局能放 3-6 次 */
  player.ult=Math.min(player.ultMax, player.ult + (e.type==='elite'?16:(big?5:3)));
  if(combo>=5) addText(e.x, e.y-e.r-22, 'x'+combo, [255,180,90], 15+Math.min(10,combo*0.6), 0.7);

  /* 低血时治疗掉落概率提升（保底机制，避免残血无解） */
  const hpFrac=player.hp/player.maxHp;
  const healChance = hpFrac<0.35 ? 0.20 : hpFrac<0.6 ? 0.10 : 0.05;
  dropGem(e.x,e.y,Math.max(1,Math.round(e.xp*waveCfg(wave).xpMul)), Math.random()<healChance?1:0);
  /* 精英必掉增益；普通敌人 1.6% 小概率 —— 让临时增益成为节奏点而非常态 */
  if(e.type==='elite') dropGem(e.x+20,e.y,0, 2+((Math.random()*3)|0));
  else if(Math.random()<0.016) dropGem(e.x,e.y,0, 2+((Math.random()*3)|0));
  /* 武器箱：精英必掉，普通敌人 2.5%；掉的是"另一把"武器，逼玩家换打法 */
  if(e.type==='elite') dropGem(e.x-24,e.y, (player.weapon + 1 + ((Math.random()*3)|0)) % 4, 5);
  else if(Math.random()<0.025) dropGem(e.x+14,e.y, (player.weapon + 1 + ((Math.random()*3)|0)) % 4, 5);
  player.killStreakGap=0;
  player.wk[player.weapon]=(player.wk[player.weapon]||0)+1;
  mutOnKill();
  // 分裂
  if(e.type==='splitter'){
    for(let i=0;i<3;i++){
      const a=Math.random()*TAU;
      const s=spawnEnemy('spawn', e.x+Math.cos(a)*20, e.y+Math.sin(a)*20);
      if(s){ s.vx=Math.cos(a)*180; s.vy=Math.sin(a)*180; }
    }
  }
  /* 词缀死亡效果 */
  if(e.affix==='volatile'){
    // 易爆：死亡爆炸，波及周围敌人与玩家
    const R=110+e.r*2;
    ring(e.x,e.y,R,[255,140,60],0.45);
    emit(e.x,e.y,44,{smin:120,smax:420,lmin:.35,lmax:.8,sizmin:2,sizmax:5,col:[255,150,60],drag:1.8});
    spawnDebris(e.x,e.y,[255,150,60],e.r*1.6,10);
    shake=Math.max(shake,7*store.shake);
    Audio_.boom(false);
    gridQuery(e.x,e.y,R);
    for(let i=0;i<qout.length;i++){
      const o=qout[i]; if(!o.alive||o===e) continue;
      const dx=o.x-e.x, dy=o.y-e.y; if(dx*dx+dy*dy>R*R) continue;
      if(o.boss){ o.hp-=30; o.flash=1; } else damageEnemy(o, 34, false, o.x, o.y);
    }
    const pd=Math.hypot(player.x-e.x, player.y-e.y);
    if(pd<R+player.r && player.alive) hurtPlayer(12*waveCfg(wave).dmgMul, e.x, e.y);
  }
  if(e.affix==='splitting'){
    // 裂变：分裂出两只带同样词缀倾向的小怪
    for(let i=0;i<2;i++){
      const a=Math.random()*TAU;
      const s=spawnEnemy('spawn', e.x+Math.cos(a)*18, e.y+Math.sin(a)*18);
      if(s){ s.vx=Math.cos(a)*200; s.vy=Math.sin(a)*200; s.affix=null; }
    }
  }
}

/* ---------- 玩家受伤 ---------- */
function hurtPlayer(dmg,sx,sy){
  const p=player;
  if(p.iframe>0||!p.alive) return;
  // 护盾优先吸收：被完全挡下时只有闪光和音效，不掉血
  if(p.shield>0){
    const ab=Math.min(p.shield,dmg);
    p.shield-=ab; dmg-=ab; p.shieldFlash=1;
    ring(p.x,p.y,120,[120,220,255],0.35);
    emit(p.x,p.y,10,{dir:Math.atan2(p.y-sy,p.x-sx),spread:1.8,smin:60,smax:220,
      lmin:.2,lmax:.45,sizmin:1.5,sizmax:3,col:[140,225,255],drag:4});
    Audio_.tone({type:'triangle',f1:1400,f2:700,dur:0.12,gain:0.09,atk:0.003});
    if(p.shield<=0){ p.shield=0; addText(p.x,p.y-30,'护盾破碎',[120,200,255],18,0.9);
      ring(p.x,p.y,220,[120,220,255],0.5); Audio_.boom(false); }
    if(dmg<=0){ p.iframe=Math.max(p.iframe,0.3); return; }
  }
  // 汲取词缀：这个敌人打中你时自己回血（需要在伤害来源处识别，这里用最近敌人近似）
  p.hitDir=Math.atan2(sy-p.y, sx-p.x); p.hitDirT=1;
  p.hp-=dmg; p.iframe=0.82; p.hitFlash=1;
  if(p.mut.closeassim) p.slowDebuffT=0.6;
  shake=Math.max(shake,7*store.shake); flashScreen=Math.max(flashScreen,0.42);
  hitStop=Math.max(hitStop,0.05);
  Audio_.hurt();
  const a=Math.atan2(p.y-sy,p.x-sx);
  p.vx+=Math.cos(a)*260; p.vy+=Math.sin(a)*260;
  emit(p.x,p.y,18,{dir:a,spread:1.6,smin:60,smax:260,lmin:.25,lmax:.55,sizmin:1.6,sizmax:3.4,col:[120,240,255],drag:3.4});
  if(p.thorn>0){
    ring(p.x,p.y,150+p.thorn*70,[120,255,255],0.35);
    gridQuery(p.x,p.y,150+p.thorn*70);
    for(let i=0;i<qout.length;i++){
      const e=qout[i]; if(!e.alive) continue;
      const dx=e.x-p.x, dy=e.y-p.y; if(dx*dx+dy*dy>(150+p.thorn*70)**2) continue;
      damageEnemy(e, 26*p.thorn, false, e.x, e.y);
    }
  }
  if(p.hp<=0){ p.hp=0; p.alive=false; gameOver(); }
}

/* ---------- 关卡 / 结算 ---------- */
function levelUpCheck(){
  while(player.xp>=player.xpNeed){
    player.xp-=player.xpNeed; player.level++;
    player.xpNeed=xpFor(player.level);
    pendingLevels++;
    // 升级附带小幅修复，缓解"升级了但还是残血"的挫败
    if(player.hp<player.maxHp){
      player.hp=Math.min(player.maxHp, player.hp+player.maxHp*0.10);
      addText(player.x,player.y-28,'+'+Math.round(player.maxHp*0.10),[130,255,200],17,0.8);
    }
  }
  if(pendingLevels>0 && state===ST.PLAYING){
    state=ST.LEVEL; cardChoices=rollUpgrades(); showLevelUp(); Audio_.levelup();
    flashScreen=Math.max(flashScreen,0.28);
  }
}
function applyUpgrade(u){
  const p=player;
  p.upg[u.id]=(p.upg[u.id]||0)+1;
  u.a(p);
  pendingLevels--;
  ring(p.x,p.y,220,[150,255,255],0.55);
  emit(p.x,p.y,40,{smin:60,smax:280,lmin:.4,lmax:.9,sizmin:1.8,sizmax:4,col:[150,250,255],drag:2.2});
  if(pendingLevels>0){ cardChoices=rollUpgrades(); showLevelUp(); Audio_.levelup(); }
  else { state=ST.PLAYING; hideUI(); acc=0; last=now(); hitStop=0; }
}
function gameOver(){
  store.gamesPlayed=(store.gamesPlayed|0)+1; saveStore();
  state=ST.OVER;
  /* 必须在写回 bestScore 之前判定：原来 showGameOver 里用
     score>=store.bestScore，而这里已经把 bestScore 更新成 max，
     导致每局都显示"新纪录"。 */
  newRecord = score>store.bestScore;
  Audio_.boom(true);
  shake=Math.max(shake,12*store.shake); flashScreen=0.6;
  emit(player.x,player.y,80,{smin:60,smax:480,lmin:.6,lmax:1.3,sizmin:2,sizmax:6,col:[120,240,255],drag:1.6});
  ring(player.x,player.y,520,[140,250,255],0.9);
  if(score>store.bestScore) store.bestScore=score;
  if(time>store.bestTime) store.bestTime=time;
  if(wave>store.bestWave) store.bestWave=wave;
  saveStore();
  /* 结算面板延迟 700ms 弹出（让爆炸演完）。期间玩家可能按 R/回车重开，
     必须带令牌校验，否则旧结算面板会盖在新一局上。 */
  const token=++overToken;
  /* 成绩记录放在 gameOver() 而不是 showGameOver()：玩家可能在 700ms 内
     按 R 重开，结算面板不弹，但这一局依然必须入榜。 */
  recordRun();
  setTimeout(()=>{ if(token===overToken && state===ST.OVER) showGameOver(); },700);
}

/* ---------- 输入 ---------- */
/* 触屏冲刺键：底部中央，与左右摇杆错开，半径 44 */
const DASH_BTN={x:W/2, y:H-96, r:44, on(x,y){ const dx=x-this.x, dy=y-this.y; return dx*dx+dy*dy<this.r*this.r; }};
/* 触屏大招键：冲刺键右侧，充能满时才响应 */
const ULT_BTN={x:W/2+124, y:H-92, r:40, on(x,y){ const dx=x-this.x, dy=y-this.y; return dx*dx+dy*dy<this.r*this.r; }};
/* 触屏换枪键：冲刺键左侧，点击循环切换已持有武器（无箱也能换） */
const SWAP_BTN={x:W/2-124, y:H-92, r:38, on(x,y){ const dx=x-this.x, dy=y-this.y; return dx*dx+dy*dy<this.r*this.r; }};
/* ---------- 武器轮盘 ----------
   四把武器正好是轮盘容量上限。顺序固定为"上右下左"顺时针，
   不随机排列——顺序是功能记忆的一部分。
   长按换枪键 140ms 弹出，拖到扇区停留 70ms 选中，中心 64px 内不选中。
   换枪有代价：上膛 120ms 且首发射速降低 35%，否则频繁换枪会变成无成本逃课。 */
const radial={open:false, cx:0, cy:0, hl:-1, dwell:0, t:0, ptr:null, moved:0, armed:false, armT:0};
function openRadial(x,y){
  radial.open=true; radial.cx=x; radial.cy=y; radial.hl=-1; radial.dwell=0;
  radial.t=0; radial.moved=0; radial.armed=false; radial.armT=0;
}
function closeRadial(select){
  if(!radial.open) return;
  if(select && radial.hl>=0 && player.unlocked[radial.hl]) equipWeapon(radial.hl);
  radial.open=false; radial.hl=-1; radial.ptr=null;
}
function updateRadial(dt){
  /* 按住换枪键但不移动手指，也应展开轮盘 ——
     只在 pointermove 里展开会导致"按住不动"永远打不开菜单 */
  if(!radial.open && radial.armed && (now()-radial.armT)>=CFG.radial.openHold){
    openRadial(SWAP_BTN.x, SWAP_BTN.y);
    return;
  }
  if(!radial.open) return;
  radial.t+=dt;
  if(radial.t>CFG.radial.timeout){ closeRadial(false); return; }
  if(radial.hl>=0) radial.dwell+=dt;
}
function radialSectorAt(x,y){
  const dx=x-radial.cx, dy=y-radial.cy;
  const d=Math.hypot(dx,dy);
  if(d<CFG.radial.deadZone) return -1;
  /* 四扇区：上(0) 右(1) 下(2) 左(3)，顺时针 */
  let a=Math.atan2(dy,dx)+Math.PI/2;   // 让"上"成为 0 扇区中心
  while(a<0) a+=TAU; while(a>=TAU) a-=TAU;
  const idx=Math.round(a/(TAU/4))%4;
  return player.unlocked[idx]?idx:-1;
}
function radialMove(x,y){
  if(!radial.open) return;
  radial.moved=Math.hypot(x-radial.cx,y-radial.cy);
  const s=radialSectorAt(x,y);
  if(s!==radial.hl){ radial.hl=s; radial.dwell=0; }
}
function equipWeapon(w){
  const p=player;
  if(!p||!p.alive||w===p.weapon||!p.unlocked[w]) return;
  p.weapon=w; p.weaponFlash=1;
  p.swapT=0.12;                       // 上膛：120ms 内可开火但首发射速降低
  p.fireCd=Math.max(p.fireCd, fireInterval()*0.35);
  const nw=WEAPONS[w];
  ring(p.x,p.y,150,nw.col,0.45);
  addText(p.x,p.y-40,nw.name,nw.col,19,1.1,true);
  Audio_.tone({type:'square',f1:700,f2:1000,dur:0.10,gain:0.07,atk:0.005});
  if(typeof navigator!=='undefined' && navigator.vibrate){ try{ navigator.vibrate(12); }catch(e){} }
}
/* 未开轮盘时的快速循环切换（桌面 E 键 / 短按换枪键） */
function cycleWeapon(){
  const p=player;
  if(!p || !p.alive || state!==ST.PLAYING) return;
  let w=p.weapon;
  for(let i=0;i<WEAPONS.length;i++){
    w=(w+1)%WEAPONS.length;
    if(p.unlocked[w]) break;
  }
  if(w!==p.weapon) equipWeapon(w);
}
function trySwapWeapon(){
  if(!player || !player.alive || state!==ST.PLAYING) return;
  // 触屏：进入"待弹出"状态，长按 140ms 后展开轮盘；短按直接循环切换
  if(usingTouch){ radial.armed=true; radial.armT=now(); }
  else cycleWeapon();
}
/* 轮盘拖动期间的指针处理（在 pointerdown/move 中调用） */
function radialPointerDown(x,y){
  if(!radial.open) return false;
  return true;
}
/* dx/dy 可选：双击冲刺会传入两次落点的位移方向；
   不传则回退到"当前移动摇杆方向"，再回退到角色朝向。 */
function tryDash(dx,dy){
  const p=player;
  if(!p || !p.alive || state!==ST.PLAYING) return;
  if(p.dashCdT>0 || p.dashT>0) return;
  // 禁冲刺挑战期间一用冲刺就算失败
  if(challenge && challenge.type==='nodash' && !challenge.done){ failChallenge(); }
  if(dx===undefined){ dx=moveX; dy=moveY; }
  if((!dx&&!dy)){ dx=Math.cos(p.angle); dy=Math.sin(p.angle); }
  const l=Math.hypot(dx,dy)||1;
  p.dashDX=dx/l; p.dashDY=dy/l;
  p.dashT=0.18; p.dashCdT=p.dashCd; tutNotify('dash');
  ring(p.x,p.y,96,[150,240,255],0.35);
  emit(p.x,p.y,14,{dir:Math.atan2(-p.dashDY,-p.dashDX),spread:1.0,smin:80,smax:300,
    lmin:.2,lmax:.5,sizmin:1.6,sizmax:3.6,col:[160,245,255],drag:3.4});
  Audio_.tone({type:'sine',f1:660,f2:1500,dur:0.16,gain:0.09,atk:0.004});
}

const keys=new Set();
let mouseX=W/2, mouseY=H/2, mouseDown=false;
let hasMouse = !MOBILE_LIKE;   // 触屏/微信默认走自动索敌，鼠标事件到来时再修正
let aimX=W/2, aimY=H/2;
const sticks={move:null, aim:null, moveEase:null, aimEase:null};
let usingTouch=false;

addEventListener('keydown',e=>{
  unlockAudio();
  if(lbOpen && (e.code==='Enter'||e.code==='KeyR'||e.code==='KeyM')) return;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='ArrowDown'||e.code==='ArrowLeft'||e.code==='ArrowRight') e.preventDefault();
  if(keys.has(e.code)) return;
  keys.add(e.code);
  if(e.code==='Escape'||e.code==='KeyP'){ togglePause(); }
  if(e.code==='Enter'){
    if(state===ST.MENU) startGame();
    else if(state===ST.OVER) startGame();
    else if(state===ST.PAUSED) togglePause();
  }
  if(e.code==='KeyR'&&(state===ST.OVER||state===ST.PAUSED)){ startGame(); return; }
  if(e.code==='Tab'){ e.preventDefault&&e.preventDefault(); skipTutorial(); return; }
  if((e.code==='ShiftLeft'||e.code==='ShiftRight')&&state===ST.PLAYING){ tryDash(); return; }
  if(e.code==='KeyQ'&&state===ST.PLAYING){ castNova(); return; }
  if((e.code==='KeyE'||e.code==='Tab')&&state===ST.PLAYING){ trySwapWeapon(); return; }
  if(e.code==='KeyM'){ store.muted=!store.muted; if(Audio_.master) Audio_.master.gain.value=store.muted?0:store.volume; saveStore(); refreshMenu(); }
  if(state===ST.LEVEL){
    if(e.code==='Digit1'&&cardChoices[0]) applyUpgrade(cardChoices[0]);
    if(e.code==='Digit2'&&cardChoices[1]) applyUpgrade(cardChoices[1]);
    if(e.code==='Digit3'&&cardChoices[2]) applyUpgrade(cardChoices[2]);
  }
},{passive:false});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>{ keys.clear(); mouseDown=false; if(state===ST.PLAYING) togglePause(); });

cv.addEventListener('pointerdown',e=>{
  unlockAudio();
  /* 排行榜面板打开时，点黑边不能误开新局 */
  if(lbOpen && (state===ST.MENU||state===ST.OVER)) return;
  /* 菜单 / 结算 / 合约界面：任意点击都用于开始或重开。
     必须放在触屏按钮判定之前 —— 否则落在底部三键区域的点击会被
     tryDash()/castNova() 内部的 state 守卫吃掉并 return，"点击任意处
     开始"的提示在这片区域就成了谎言。 */
  if(state===ST.MENU || state===ST.OVER){
    if(e.pointerType!=='touch') setMouse(e);
    else usingTouch=true;
    startGame();
    return;
  }
  if(e.pointerType==='touch'){
    /* 关键：捕获指针。手指滑出画布（信箱黑边 / 侧显时的屏幕边缘）时，
       pointermove/pointerup 仍会投递给 cv，否则摇杆会永久卡在最后方向、
       角色自己一直跑 —— 这是触屏射击最典型的"停不下来"bug。 */
    try{ if(cv.setPointerCapture) cv.setPointerCapture(e.pointerId); }catch(_){}
    usingTouch=true; hasMouse=false;
    // 触屏按钮：底部一排，先于摇杆判定
    const p=screenToWorld(e.clientX,e.clientY);
    if(radial.open){ radial.ptr=e.pointerId; radialMove(p.x,p.y); return; }
    if(DASH_BTN.on(p.x,p.y)){ tryDash(); return; }
    if(ULT_BTN.on(p.x,p.y)){ castNova(); return; }
    if(SWAP_BTN.on(p.x,p.y)){ trySwapWeapon(); return; }
    handleTouchDown(e);
  }
  else {
    hasMouse=true; usingTouch=false; setMouse(e);
    if(e.button===2){ tryDash(); }      // 右键冲刺
    else mouseDown=true;
  }
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'){
    if(radial.open){
      if(radial.ptr===null) radial.ptr=e.pointerId;
      if(radial.ptr===e.pointerId){
        const q=screenToWorld(e.clientX,e.clientY); radialMove(q.x,q.y); return;
      }
    }
    // 长按换枪键 140ms 后展开轮盘（期间手指可移动）
    if(radial.armed && !radial.open && (now()-radial.armT)>=CFG.radial.openHold){
      const q=screenToWorld(e.clientX,e.clientY);
      openRadial(SWAP_BTN.x, SWAP_BTN.y); radial.ptr=e.pointerId; radialMove(q.x,q.y);
      return;
    }
    handleTouchMove(e);
  }
  else { hasMouse=true; setMouse(e); }
},{passive:false});
function endPointer(e){
  /* cv 与 window 都会收到（冒泡）；加标记避免重复释放/重复切枪 */
  if(e._ndHandled) return; e._ndHandled=true;
  if(e.pointerType==='touch'){
    if(radial.open){
      const ok = radial.moved>=CFG.radial.openAt && radial.hl>=0
                 && radial.dwell>=CFG.radial.dwell;
      closeRadial(ok); return;
    }
    // 短按换枪键（未展开轮盘）→ 直接循环切换
    if(radial.armed && !radial.open){ radial.armed=false; cycleWeapon(); }
    radial.armed=false;
    releaseStick(e.pointerId);
  }
  else mouseDown=false;
}
cv.addEventListener('pointerup',endPointer,{passive:false});
cv.addEventListener('pointercancel',endPointer,{passive:false});
/* 兜底：某些安卓/微信内核不支持 setPointerCapture，或系统手势把事件吞掉，
   cv 收不到 pointerup。window 在冒泡阶段补一次，保证摇杆一定能松开。 */
addEventListener('pointerup',endPointer,{passive:false});
addEventListener('pointercancel',endPointer,{passive:false});
cv.addEventListener('pointerleave',e=>{ if(e.pointerType!=='touch') mouseDown=false; },{passive:true});
cv.addEventListener('contextmenu',e=>e.preventDefault());
/* 微信 iOS WKWebView 不认 touch-action / overscroll-behavior 时，仍会出现
   下拉橡皮筋与页面回弹。document 级 touchmove 兜底拦截，但放行真正可滚动的
   面板（操作说明十页、窄屏三选一竖排），否则玩家没法翻内容。 */
addEventListener('touchmove',e=>{
  if(e.touches && e.touches.length>1){ if(e.cancelable) e.preventDefault(); return; }
  const t=e.target, panel=(t&&t.closest)?t.closest('.panel'):null;
  if(panel && panel.scrollHeight>panel.clientHeight+2) return;
  if(e.cancelable) e.preventDefault();
},{passive:false});
/* iOS 双指捏合缩放兜底 */
addEventListener('gesturestart',e=>{ e.preventDefault&&e.preventDefault(); },{passive:false});

function setMouse(e){ const p=screenToWorld(e.clientX,e.clientY); mouseX=p.x; mouseY=p.y; }
/* ---------- 触屏输入（重写） ----------
   要点：
   1) 左固定、右浮动 —— 左摇杆每局位置一致形成肌肉记忆，右摇杆跟随落点
   2) 死区用连续曲线而非布尔截断，避免"点一下不反应、再推又过头"
   3) 右摇杆松手保留最后朝向 —— 把"持续瞄准"变成一次滑扫，手指负担大降
   4) 底座 clamp 到安全区，落指贴边时仍有视觉锚点
   5) 所有手势按 pointerId 分槽，双指交叉不会互相抢 */
const pointers=new Map();   // id -> {slot,...}

function clampStickOrigin(px,py,r){
  // 底座中心收进画面，但保留落点与底座的偏移，使输入方向不变
  const m=r+8;
  return {x:clamp(px,m,W-m), y:clamp(py,m,H-m)};
}
function handleTouchDown(e){
  const p=screenToWorld(e.clientX,e.clientY);
  const id=e.pointerId;
  const rec={id, downT:now(), downX:p.x, downY:p.y, lastTap:0,
             lastTapX:0, lastTapY:0, slot:'none'};

  /* 单摇杆辅助模式：整个屏幕都是移动摇杆，瞄准全交给自动索敌 */
  if(store.singleStick){
    if(!sticks.move){
      const o=clampStickOrigin(p.x,p.y,STICK_R);
      sticks.move={id, ox:o.x, oy:o.y, x:p.x, y:p.y};
      rec.slot='move';
    }
    pointers.set(id,rec); return;
  }

  const right = p.x > W*CFG.input.leftZoneX;
  if(right && !sticks.aim){
    const o=clampStickOrigin(p.x,p.y,STICK_R);
    sticks.aim={id, ox:o.x, oy:o.y, x:p.x, y:p.y, holdT:0};
    rec.slot='aim';
  } else if(!right && !sticks.move){
    const o=clampStickOrigin(p.x,p.y,STICK_R);
    sticks.move={id, ox:o.x, oy:o.y, x:p.x, y:p.y};
    rec.slot='move';
  } else if(!sticks.aim){
    const o=clampStickOrigin(p.x,p.y,STICK_R);
    sticks.aim={id, ox:o.x, oy:o.y, x:p.x, y:p.y, holdT:0};
    rec.slot='aim';
  }
  pointers.set(id,rec);
}
function handleTouchMove(e){
  const p=screenToWorld(e.clientX,e.clientY);
  touchTrackPos(e);
  if(sticks.move&&sticks.move.id===e.pointerId){ sticks.move.x=p.x; sticks.move.y=p.y; }
  else if(sticks.aim&&sticks.aim.id===e.pointerId){ sticks.aim.x=p.x; sticks.aim.y=p.y; }
}
function releaseStick(id){
  const rec=pointers.get(id);
  const t=now();
  /* 双击冲刺：只在移动区生效。
     四道闸门避免"连续两次短按微调走位"被误判成双击：
     ① 单次按压时长在 70~220ms（像点击，不像按住）
     ② 单次按压期间位移 < 36px（不是拖动）
     ③ 两次落点相距 < 120px 且同一 pointerId
     ④ 最近 300ms 内没有主动开火（不是边打边走）
     方向取"两次落点位移"，位移过小才退回当前摇杆方向。 */
  if(store.dblDash && rec && rec.slot==='move' && state===ST.PLAYING){
    const dur=t-rec.downT;
    const moved=Math.hypot(rec.lastX-rec.downX, rec.lastY-rec.downY);
    const isTap = dur>=CFG.dash.dblMin && dur<=CFG.dash.dblMax && moved<=CFG.dash.drift;
    if(isTap && (t-lastFireT)>CFG.dash.cooldownAfterFire){
      if(rec.lastTap && (t-rec.lastTap)<=CFG.dash.dblMax){
        let dx=rec.lastX-rec.lastTapX, dy=rec.lastY-rec.lastTapY;
        if(Math.hypot(dx,dy)>20) tryDash(dx,dy);
        else if(moveX||moveY) tryDash(moveX,moveY);
        else tryDash(Math.cos(player.angle),Math.sin(player.angle));
        rec.lastTap=0;
      } else {
        rec.lastTap=t; rec.lastTapX=rec.lastX; rec.lastTapY=rec.lastY;
      }
    } else if(!isTap){ rec.lastTap=0; }
  }
  /* 指数回弹而非瞬间清零：瞬间归零会让归一化向量在最后一帧突变成 0，
     角色表现为"滑出一小步"。 */
  const rs=(CFG.input.reboundScale||[0.6,1,1.6])[store.rebound|0]||1;
  if(sticks.move&&sticks.move.id===id){
    const s0=sticks.move; sticks.move=null;
    sticks.moveEase={ox:s0.ox, oy:s0.oy, x:s0.x, y:s0.y, t:0, tau:CFG.input.reboundTau.move*rs};
  }
  if(sticks.aim&&sticks.aim.id===id){
    const s0=sticks.aim; sticks.aim=null;
    sticks.aimEase={ox:s0.ox, oy:s0.oy, x:s0.x, y:s0.y, t:0, tau:CFG.input.reboundTau.aim*rs};
  }
  pointers.delete(id);
}
/* 每帧推进回弹动画（纯视觉，不影响输入判定） */
function updateStickEase(dt){
  const E=[sticks.moveEase, sticks.aimEase];
  for(let i=0;i<E.length;i++){
    const e=E[i]; if(!e) continue;
    e.t+=dt;
    const a=1-Math.exp(-dt/Math.max(0.02,e.tau));
    e.x+=(e.ox-e.x)*a; e.y+=(e.oy-e.y)*a;
    if(Math.hypot(e.x-e.ox,e.y-e.oy)<0.5) { if(i===0) sticks.moveEase=null; else sticks.aimEase=null; }
  }
}
/* 记录每个指针的最后位置，供双击方向判定 */
function touchTrackPos(e){
  const rec=pointers.get(e.pointerId);
  if(!rec) return;
  const p=screenToWorld(e.clientX,e.clientY);
  rec.lastX=p.x; rec.lastY=p.y;
}

/* 死区连续曲线：mag = pow((d-DZ)/(1-DZ), exp)
   布尔截断会让小幅输入被整个吃掉，玩家表现为"点一下不反应" */
function stickVec(s,dead,maxR){
  if(!s) return null;
  let dx=s.x-s.ox, dy=s.y-s.oy;
  const raw=Math.hypot(dx,dy);
  const DZ=CFG.input.stickDead;
  if(raw<=dead || raw<1e-4) return null;
  const d=raw/maxR;
  if(d<DZ) return null;
  const t=clamp((d-DZ)/(1-DZ),0,1);
  const m=Math.pow(t, CFG.input.stickExp);
  return {x:dx/raw*m, y:dy/raw*m, mag:m};
}

/* ---------- 辅助瞄准 / 软锁定 ----------
   四档：关 / 低 / 中 / 高，默认中。
   抑制设计保证"帮助新手但不接管高手"：
   - 摇杆推得越满，辅助越弱（满推≈无辅助，高手可完全覆盖）
   - 目标横向角速度越大，辅助越弱（快速掠过的目标不会被硬拽）
   - 合成辅助强度 clamp 在 0.15~0.90，永远给玩家留出操作空间 */
let assistTarget=null, assistRetarget=0, assistOff=0;
function pickAssistTarget(ax,ay){
  /* 按评分选最优目标：距离 + 朝向 + 角速度稳定 + 威胁 */
  const lv=store.assistLv|0;
  if(lv<=0) return null;
  const maxR2=CFG.assist.maxRadius**2;
  const cone=CFG.assist.maxCone*D2R;
  let best=null, bestScore=-1e9;
  const dx=ax-player.x, dy=ay-player.y;
  const dl=Math.hypot(dx,dy)||1;
  const adx=dx/dl, ady=dy/dl;
  const tmp=[];
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    if(!e.alive||e.spawnT>0) continue;
    const ex=e.x-player.x, ey=e.y-player.y;
    const r2=ex*ex+ey*ey;
    if(r2>maxR2) continue;
    const r=Math.sqrt(r2);
    // 提前量：只对高速目标有意义
    const fx=ex+(e.vx||0)*CFG.assist.lead, fy=ey+(e.vy||0)*CFG.assist.lead;
    const fl=Math.hypot(fx,fy)||1;
    const dot=(adx*fx+ady*fy)/fl;
    const ang=Math.acos(clamp(dot,-1,1));
    if(ang>cone) continue;
    // 目标相对玩家的角速度（横向速度 / 距离）
    const tx=-ey/r, ty=ex/r;
    const angVel=Math.abs((e.vx||0)*tx+(e.vy||0)*ty)/Math.max(40,r);
    const score =
      1000/(1+0.045*r) +
      360*(1-ang/cone) +
      260*(1-clamp(angVel/CFG.assist.angVelSuppress,0,1)) +
      300*(e.type==='elite'?1:0) +
      300*(e.boss?1.5:0);
    tmp.push({e,score,r,ang,angVel,fx,fy,fl});
    if(score>bestScore){ bestScore=score; best=tmp[tmp.length-1]; }
  }
  if(!best) return null;
  /* 目标粘滞：新目标需比当前高 12% 才切换，避免两只相邻敌人反复跳 */
  if(assistTarget && assistTarget.alive){
    let cur=null;
    for(let i=0;i<tmp.length;i++) if(tmp[i].e===assistTarget){ cur=tmp[i]; break; }
    if(cur && bestScore < cur.score*1.12) best=cur;
  }
  /* 换目标时清零累积偏移，避免辅助把准星从旧目标"甩"到新目标 */
  if(assistTarget && assistTarget!==best.e) assistOff=0;
  assistTarget=best.e;
  return best;
}
function applyAimAssist(ax,ay,stickMag,dt){
  const lv=store.assistLv|0;
  if(lv<=0 || !player.alive) return {x:ax,y:ay};
  const base=CFG.assist.byLv[lv]||0;
  const t=pickAssistTarget(ax,ay);
  /* 目标丢失时必须清零偏移，否则下次锁定新目标会带着上一条的残余角度瞬间跳一下 */
  if(!t){ assistOff=0; return {x:ax,y:ay}; }

  /* 三重抑制：摇杆推力、目标角速度、全局上下限 */
  const magSup=clamp(1-stickMag/CFG.assist.magSuppress,0,1);
  const angSup=clamp(1-t.angVel/CFG.assist.angVelSuppress,0,1);
  const strength=clamp(base*magSup*angSup, CFG.assist.minAssist, CFG.assist.maxAssist);

  /* 1) 磁吸权重：在 snapHalfAngle 内为满强度，到 maxCone 边缘平滑衰减到 0。
     早期实现用 clamp(1-ang/halfA) 会在 5° 外直接归零 ——
     那等于"只有准星已经对准了才辅助"，完全失去意义。 */
  const cone=CFG.assist.maxCone*D2R;
  const halfA=CFG.assist.snapHalfAngle*D2R;
  const angW=clamp(1-Math.max(0,t.ang-halfA)/Math.max(1e-4,cone-halfA),0,1);
  // 2) 减速区：靠近目标中心时降低转向速率，抵消过冲
  const slow=CFG.assist.slowMax*clamp(1-(t.r-CFG.assist.slowNear)/(CFG.assist.slowFar-CFG.assist.slowNear),0,1);

  const curA=Math.atan2(ay-player.y, ax-player.x);
  const tgtA=Math.atan2(t.fy, t.fx);
  let da=tgtA-curA;
  while(da>Math.PI) da-=TAU; while(da<-Math.PI) da+=TAU;
  /* 关键：瞄准方向每帧都从摇杆原值重算。若只做"单帧微推"，
     辅助偏移下一帧就被重置，永远只能偏一点点而无法收敛。
     改为把"目标偏移量"存成状态并指数逼近，约 0.25 秒内收敛到位。
     玩家一动摇杆，da 立刻重算，辅助随即让位 —— 不会形成拖拽感。 */
  const desired=da*angW*strength*(1-slow);
  const k=1-Math.exp(-dt/0.09);
  assistOff+=(desired-assistOff)*k;
  // 不得超过实际角差，避免拉过头
  // clamp 已保留符号，不要再乘 sign —— 否则辅助会把准星推离目标
  const off=clamp(assistOff,-Math.abs(da),Math.abs(da));
  const na=curA+off;
  const dl=Math.hypot(ax-player.x,ay-player.y)||300;
  return {x:player.x+Math.cos(na)*dl, y:player.y+Math.sin(na)*dl};
}

/* ---------- 输入聚合 ---------- */
let moveX=0, moveY=0;
/* 右摇杆"松手保留最后朝向"：把持续瞄准变成一次滑扫，
   手指负担从"持续双压"降为"移动拇指按住 + 右手定期轻扫" */
let lastAimX=0, lastAimY=0, aimHoldT=0, aimHeld=false;
function resetAimHold(){ lastAimX=0; lastAimY=0; aimHoldT=0; aimHeld=false; }

function readInput(dt){
  dt=dt||1/60;
  // 移动
  let mx=0,my=0;
  if(keys.has('KeyA')||keys.has('ArrowLeft')) mx-=1;
  if(keys.has('KeyD')||keys.has('ArrowRight')) mx+=1;
  if(keys.has('KeyW')||keys.has('ArrowUp')) my-=1;
  if(keys.has('KeyS')||keys.has('ArrowDown')) my+=1;
  if(mx||my){ const l=Math.hypot(mx,my); mx/=l; my/=l; }
  else {
    const sv=stickVec(sticks.move,14*STICK_R/52, STICK_R);
    if(sv){ mx=sv.x; my=sv.y; }
  }
  moveX=mx; moveY=my;
  if(mx||my) tutMoved+=Math.hypot(mx,my)*player.speed*dt*10;

  // 瞄准
  const av=stickVec(sticks.aim,6*STICK_R/52, STICK_R);
  let ax=0,ay=0, stickMag=0;
  if(av){
    ax=player.x+av.x*300; ay=player.y+av.y*300; stickMag=av.mag;
    if(av.mag>CFG.input.aimHoldMag){
      if(!aimHeld) tutNotify('aim');
      aimHoldT+=dt; lastAimX=av.x; lastAimY=av.y; aimHeld=true;
    }
  }
  if((!av || av.mag<=CFG.input.aimHoldMag) && aimHeld && aimHoldT>=CFG.input.aimConfirm){
    // 松手后保留最后朝向继续射击；推力小于阈值时不覆盖，留给"精细补枪"
    ax=player.x+lastAimX*300; ay=player.y+lastAimY*300; stickMag=0;
  }
  if(!ax && !ay){
    if(hasMouse && !usingTouch){ ax=mouseX; ay=mouseY; }
    else {
      // 无有效摇杆输入（单摇杆模式 / 键盘）→ 自动索敌最近敌人
      let best=null,bd=1e9;
      for(let i=0;i<enemies.length;i++){ const e=enemies[i]; if(!e.alive) continue;
        const d=(e.x-player.x)**2+(e.y-player.y)**2; if(d<bd){bd=d;best=e;} }
      if(best){ ax=best.x; ay=best.y; }
      else if(mx||my){ ax=player.x+mx*300; ay=player.y+my*300; }
      else { ax=player.x+Math.cos(player.angle)*300; ay=player.y+Math.sin(player.angle)*300; }
    }
  }
  /* 软锁定。鼠标/键盘下 stickMag=0 → 抑制最弱但仍提供轻度吸附；
     触屏满推时 magSup→0，几乎等于关闭，高手可完全覆盖。 */
  const assisted=applyAimAssist(ax,ay,stickMag,dt);
  aimX=assisted.x; aimY=assisted.y;
}
function wantFire(){
  // 单摇杆辅助模式：始终自动开火
  if(store.singleStick && state===ST.PLAYING) return true;
  if(stickVec(sticks.aim,6*STICK_R/52, STICK_R)) return true;
  if(aimHeld && aimHoldT>=CFG.input.aimConfirm) return true;  // 松手保朝向 → 继续射击
  if(hasMouse && mouseDown) return true;
  if(keys.has('Space')) return true;
  return false;
}

/* ============================================================
   情境式引导：每次只教一件事，触发与玩家当下情境绑定
   规则：不暂停游戏、不阻断开火、不在 Boss 战时弹出；
        玩家做出对应行为即消失（并记入已完成，不再重复）。
   ============================================================ */
const TUT=[
  {id:'move', text:'左屏按住拖动 · 移动', sub:'先走动起来',
   when:()=>time>0.8, done:()=>tutMoved>90, max:8, anchor:'left'},
  {id:'aim',  text:'右屏按住瞄准 · 自动开火', sub:'松手会保留最后朝向',
   when:()=>tutMoved>90, done:()=>tutAimed>=2, max:10, anchor:'right'},
  {id:'kill', text:'击杀敌人获得经验结晶', sub:'靠近即可拾取',
   when:()=>tutAimed>=1, done:()=>kills>=1, max:12, anchor:'top'},
  {id:'upg',  text:'选择一项强化', sub:'词条会显示正面与代价',
   when:()=>state===ST.LEVEL, done:()=>false, max:20, anchor:'top'},
  {id:'dash', text:'冲刺带有无敌帧', sub:'点击冲刺键，或在移动区快速双击',
   when:()=>time>45 && enemies.length>=4, done:()=>tutDashed>=1, max:18, anchor:'dash'},
  {id:'ult',  text:'大招已充能', sub:'被围住时释放可清空全场',
   when:()=>player && player.ult>=player.ultMax*0.98, done:()=>tutUlted>=1, max:15, anchor:'ult'},
  {id:'evo',  text:'武器可进化', sub:'持有专属被动并累计击杀即可触发',
   when:()=>{const e=evolutionProgress(); return !!(e&&e.hasP&&e.k>0.5);},
   done:()=>tutEvoSeen>=1, max:16, anchor:'top'}
];
let tutQueue=[], tutActive=null, tutDoneSet={};
let tutMoved=0, tutAimed=0, tutDashed=0, tutUlted=0, tutEvoSeen=0;
function tutReset(){
  tutQueue=[]; tutActive=null; tutDoneSet={};
  tutMoved=0; tutAimed=0; tutDashed=0; tutUlted=0; tutEvoSeen=0;
}
function tutEnabled(){
  // 老玩家（已完成 3 局）默认跳过；设置里可重新开启
  return CFG.tut.enabled && !store.tutSeen && store.gamesPlayed<3;
}
function startTutorial(){
  tutReset();
  if(!tutEnabled()){ tutQueue=[]; return; }
  tutQueue=TUT.slice();
}
function updateTutorial(dt){
  if(!tutEnabled()){ tutActive=null; return; }
  if(state!==ST.PLAYING){ return; }   // 升级/合约界面不弹教学
  if(boss && boss.alive && boss.dying<=0) return;   // Boss 战不打扰
  if(tutActive){
    tutActive.life-=dt;
    if(tutActive.done() || tutActive.life<=0){
      tutDoneSet[tutActive.id]=1;
      if(tutActive.id==='evo') tutEvoSeen++;
      tutActive=null;
    }
    return;
  }
  while(tutQueue.length){
    const t=tutQueue[0];
    if(tutDoneSet[t.id]){ tutQueue.shift(); continue; }
    if(t.when()){ tutQueue.shift(); tutActive={...t, life:t.max}; return; }
    break;   // 按顺序推进，前面的没触发就不看后面的
  }
}
function tutNotify(kind){
  if(kind==='dash') tutDashed++;
  if(kind==='ult') tutUlted++;
  if(kind==='aim') tutAimed++;
}
function skipTutorial(){
  tutQueue=[]; tutActive=null;
  store.tutSeen=true; saveStore();
}

/* ---------- 更新 ---------- */
function update(dt){
  if(hitStop>0){ hitStop-=dt; return; }
  time+=dt;
  const nw=Math.floor(time/60)+1;
  if(nw!==wave){ wave=nw; bannerWave=wave; bannerT=2.2; killsInWave=0; burstDone=false;
    if(sandbox && wave>=2){ sandbox=false; addText(W/2,H*0.3,'热身结束',[150,255,200],20,1.5,true); }
    Audio_.tone({type:'triangle',f1:520,f2:880,dur:0.24,gain:0.07,atk:0.01});
  }
  bannerT=Math.max(0,bannerT-dt);
  dangerPulse=Math.max(0,dangerPulse-dt);
  updateRadial(dt);
  updateMutations(dt);
  /* 快速模式：90 秒计时局，到点结算而不是无限生存 */
  if(gameMode==='quick' && CFG.waves.quick.dur && time>=CFG.waves.quick.dur){
    quickClear=true; gameOver(); return;
  }
  updateStickEase(dt);
  updateTutorial(dt);
  // 连杀衰减
  if(combo>0 && time-comboLast>2.6){ combo=0; comboMul=1; }
  comboPop=Math.max(0,comboPop-dt*3.5);
  if(novaWindow>0) novaWindow=Math.max(0,novaWindow-dt);
  /* 挑战：发布 / 计时 / 失败判定 */
  if(challenge){
    challenge.tLeft-=dt;
    // nodash 类型是"生存到时间结束"，不是累加型
    if(challenge.type==='nodash' && challenge.tLeft<=0) completeChallenge();
    else if(challenge.tLeft<=0) failChallenge();
  } else {
    challengeCd-=dt;
    if(challengeCd<=0 && state===ST.PLAYING && time>25) publishChallenge();
  }
  // 相机 kick 回落
  camKickX*=(1-Math.min(1,dt*9)); camKickY*=(1-Math.min(1,dt*9));

  const p=player;
  // 临时增益倒计时（时缓对敌人/敌弹生效，对玩家不生效）
  if(p.frenzy>0) p.frenzy=Math.max(0,p.frenzy-dt);
  if(p.slow>0)   p.slow=Math.max(0,p.slow-dt);
  p.shieldFlash=Math.max(0,p.shieldFlash-dt*2.4);
  p.hitDirT=Math.max(0,p.hitDirT-dt*1.6);
  const edt = p.slow>0 ? dt*0.55 : dt;   // 敌人/敌弹的"世界时间"
  readInput(dt);

  // 冲刺：0.18 秒高速位移，期间无敌并留下残影
  if(p.dashCdT>0) p.dashCdT=Math.max(0,p.dashCdT-dt);
  if(p.dashT>0){
    p.dashT-=dt;
    const ds=p.speed*3.1*p.dashPow;
    p.vx=p.dashDX*ds; p.vy=p.dashDY*ds;
    if(Math.random()<pStep(0.9)) emit(p.x,p.y,2,{dir:Math.atan2(-p.dashDY,-p.dashDX),spread:0.6,
      smin:40,smax:170,lmin:.16,lmax:.38,sizmin:1.6,sizmax:3.6,col:[150,240,255],drag:3.2});
    if(p.iframe<0.1) p.iframe=0.1;
  }
  // 玩家移动
  const sp=mutSpeed(p.speed);
  if(p.dashT<=0){
    p.vx=lerp(p.vx, moveX*sp, 1-Math.pow(0.0006,dt));
    p.vy=lerp(p.vy, moveY*sp, 1-Math.pow(0.0006,dt));
  }
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  if(p.x<p.r){p.x=p.r;p.vx*=-0.25;} if(p.x>W-p.r){p.x=W-p.r;p.vx*=-0.25;}
  if(p.y<p.r){p.y=p.r;p.vy*=-0.25;} if(p.y>H-p.r){p.y=H-p.r;p.vy*=-0.25;}
  const ta=Math.atan2(aimY-p.y, aimX-p.x);
  let da=ta-p.angle; while(da>Math.PI)da-=TAU; while(da<-Math.PI)da+=TAU;
  p.angle+=da*Math.min(1,dt*22);
  p.recoil=Math.max(0,p.recoil-dt*34);
  p.iframe=Math.max(0,p.iframe-dt);
  p.hitFlash=Math.max(0,p.hitFlash-dt*3.2);
  p.weaponFlash=Math.max(0,p.weaponFlash-dt*2.4);
  p.ultReadyT=Math.max(0,p.ultReadyT-dt);
  /* 急救协议：没有击杀时其他生命回复完全失效 */
  if(p.regen){ const rr=mutRegen(p.regen); p.hp=Math.min(p.maxHp,p.hp+rr*dt); }
  // 尾焰
  if((moveX||moveY) && Math.random()<pStep(0.75)){
    const back=p.angle+Math.PI;
    emit(p.x+Math.cos(back)*10, p.y+Math.sin(back)*10,1,
      {dir:back,spread:0.6,smin:50,smax:130,lmin:.14,lmax:.3,sizmin:1.4,sizmax:2.8,col:[90,220,255],drag:4});
  }
  // 射击（狂热期间射速与伤害提升，在 fire() 内再乘伤害）
  p.fireCd-=dt;
  if(wantFire() && p.fireCd<=0){ fire(); p.fireCd=fireInterval()*(p.frenzy>0?0.55:1); lastFireT=time; }

  // 生成
  const cfg=waveCfg(wave);
  const bossAlive = !!(boss && boss.alive && boss.dying<=0);
  /* 按时间排期，而不是按波次取模判重（旧实现一局只会出一个 Boss）。 */
  if(!boss && time>=nextBossAt && state===ST.PLAYING) spawnBoss();
  /* 环境合约按时间而非"第 5 波"触发：原逻辑在 wave 6（300 秒）才首次出现，
     快速模式 90 秒内一次都见不到。改为标准 130 秒 / 快速 42 秒首现。 */
  if(!contractPending && !boss && time>=nextContractAt &&
     state===ST.PLAYING && pendingLevels<=0) offerContracts();
  spawnTimer-=dt;
  const aliveCount=enemies.length;
  const cap = (bossAlive ? Math.min(cfg.maxAlive*DF().addCap,60) : cfg.maxAlive) * QUALITY.enemyCapMul;
  if(spawnTimer<=0 && aliveCount<cap){
    spawnTimer = bossAlive ? cfg.interval*2.2 : cfg.interval*rnd(0.85,1.15);
    const t=pickType(wave);
    const pos=spawnPos();
    spawnEnemy(t,pos.x,pos.y);
    /* 合约：数量倍率（虫群压境会明显变多） */
    const extra=(cfg.countMul||1)-1;
    if(extra>0){
      let n=Math.floor(extra)+((Math.random()<extra%1)?1:0);
      for(let k=0;k<n && enemies.length<cap;k++){
        const q=spawnPos(); spawnEnemy(pickType(wave),q.x,q.y);
      }
    }
    if(wave>=4 && Math.random()<0.35){ const q=spawnPos(); spawnEnemy(t==='elite'?'chaser':t,q.x,q.y); }
  }
  /* 波次内脉冲：制造"低谷—压力—释放"节奏，而不是持续加码。
     在波次的 50%~62% 区间触发一次定向加压。 */
  if(!bossAlive && wave>=2){
    const wt=time-(wave-1)*60;
    if(wt>=60*CFG.waves.burstStart && !burstDone && wt<60*CFG.waves.burstEnd){
      burstDone=true;
      const n=4+Math.floor(wave*0.8);
      for(let k=0;k<n && enemies.length<cap;k++){
        const q=spawnPos(); spawnEnemy(pickType(wave),q.x,q.y);
      }
      addText(W/2,H*0.34,'⚠ 压力上升',[255,150,110],20,1.4,true);
      Audio_.tone({type:'sawtooth',f1:180,f2:420,dur:0.35,gain:0.08,atk:0.01});
    }
  }
  if(boss) bossUpdate(edt);

  // 敌人
  gridBuild();
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(!e.alive){ enemies[i]=enemies[enemies.length-1]; enemies.pop(); pEnemies.put(e); continue; }
    e.flash=Math.max(0,e.flash-edt*4.2);
    e.hitCd=Math.max(0,e.hitCd-edt);
    if(e.spawnT>0){ e.spawnT-=edt; }
    /* 相位词缀：周期性进入 1 秒无敌（phaseT<0 表示无敌中） */
    if(e.affix==='phasing'){
      e.phaseT-=edt;
      if(e.phaseT<=0 && e.phaseT>-0.95){
        if(!e._phased){ e._phased=true; ring(e.x,e.y,e.r*2.2,[130,235,255],0.3); }
      }
      if(e.phaseT<-1.0){ e.phaseT=rnd(3.2,5.0); e._phased=false; }
    }
    const dx=p.x-e.x, dy=p.y-e.y, dist=Math.hypot(dx,dy)||1;
    const ux=dx/dist, uy=dy/dist;
    e.rot+=e.spin*edt;
    if(e.ai==='chase'){
      e.vx=lerp(e.vx,ux*e.spd,1-Math.pow(0.05,edt));
      e.vy=lerp(e.vy,uy*e.spd,1-Math.pow(0.05,edt));
    } else if(e.ai==='shoot'){
      const want=250;
      const f = dist>want+60 ? 1 : dist<want-60 ? -1 : 0;
      const sxv=-uy*e.strafe*0.55, syv=ux*e.strafe*0.55;
      e.vx=lerp(e.vx, ux*e.spd*f + sxv*e.spd, 1-Math.pow(0.05,edt));
      e.vy=lerp(e.vy, uy*e.spd*f + syv*e.spd, 1-Math.pow(0.05,edt));
      e.shootCd-=edt;
      if(e.shootCd<=0 && dist<560){
        e.shootCd=rnd(1.7,2.7);
        eBullet(e.x,e.y,Math.atan2(dy,dx), 300, 5.5, e.dmg);
        Audio_.eshoot();
      }
      if(Math.random()<pStep(0.004)) e.strafe*=-1;
    } else if(e.ai==='snipe'){
      /* 狙击者：保持 380-520 距离，锁定后 1.0 秒蓄力预警，再打出高速穿刺弹 */
      if(e.phase===0){
        const want=450;
        const f = dist>want+70 ? 1 : dist<want-70 ? -1 : 0;
        const sxv=-uy*e.strafe*0.4, syv=ux*e.strafe*0.4;
        e.vx=lerp(e.vx, ux*e.spd*f + sxv*e.spd, 1-Math.pow(0.05,edt));
        e.vy=lerp(e.vy, uy*e.spd*f + syv*e.spd, 1-Math.pow(0.05,edt));
        e.shootCd-=edt;
        if(e.shootCd<=0){ e.phase=1; e.timer=1.0; e.spin*=4; }
      } else {
        // 蓄力：缓慢跟踪，锁定方向随玩家移动而修正，但最后 0.3 秒锁死
        e.timer-=edt;
        e.vx*=0.86; e.vy*=0.86;
        if(e.timer>0.3){ e.kx=ux; e.ky=uy; }
        if(e.phase===1 && e.timer<=0){
          e.phase=0; e.shootCd=rnd(2.4,3.6); e.spin=rnd(-1.6,1.6);
          const sa=Math.atan2(e.ky,e.kx);
          /* 狙击穿刺弹：品红 + 更大弹体 + 820 速度，与普通橙红弹彻底区分 */
          eBullet(e.x,e.y,sa, 820, 7, e.dmg, SNIPE_COL, 1);
          ring(e.x,e.y,58,SNIPE_COL,0.42);
          emit(e.x+Math.cos(sa)*18, e.y+Math.sin(sa)*18, 12,
            {dir:sa,spread:0.5,smin:120,smax:420,lmin:.16,lmax:.38,
             sizmin:1.6,sizmax:3.4,col:SNIPE_COL,drag:3.2});
          Audio_.tone({type:'sawtooth',f1:1200,f2:160,dur:0.20,gain:0.10,atk:0.003});
        }
      }
    } else if(e.ai==='charge'){
      if(e.phase===0){
        e.vx=lerp(e.vx,ux*e.spd*0.72,1-Math.pow(0.05,edt));
        e.vy=lerp(e.vy,uy*e.spd*0.72,1-Math.pow(0.05,edt));
        if(dist<380){ e.phase=1; e.timer=0.55; }
      } else if(e.phase===1){ // 蓄力
        e.timer-=edt;
        e.vx*=0.9; e.vy*=0.9;
        if(e.timer<=0){ e.phase=2; e.timer=0.62; e.kx=ux; e.ky=uy;
          Audio_.tone({type:'sawtooth',f1:180,f2:520,dur:0.3,gain:0.05,atk:0.01}); }
      } else if(e.phase===2){ // 冲刺
        e.timer-=edt;
        e.vx=e.kx*e.spd*2.5; e.vy=e.ky*e.spd*2.5;
        if(Math.random()<pStep(0.7)) emit(e.x,e.y,1,{dir:Math.atan2(-e.ky,-e.kx),spread:0.7,
          smin:30,smax:110,lmin:.16,lmax:.34,sizmin:1.4,sizmax:3,col:e.col,drag:3});
        if(e.timer<=0){ e.phase=3; e.timer=0.85; }
      } else {
        e.timer-=edt; e.vx*=0.88; e.vy*=0.88;
        if(e.timer<=0) e.phase=0;
      }
    } else if(e.ai==='elite'){
      e.vx=lerp(e.vx,ux*e.spd,1-Math.pow(0.06,edt));
      e.vy=lerp(e.vy,uy*e.spd,1-Math.pow(0.06,edt));
      e.shootCd-=edt;
      if(e.shootCd<=0){
        e.shootCd=rnd(2.6,3.8);
        const n=8, off=Math.random()*TAU;
        for(let k=0;k<n;k++) eBullet(e.x,e.y,off+k/n*TAU,220,6,e.dmg*0.7);
        Audio_.eshoot();
      }
    }
    e.x+=e.vx*edt; e.y+=e.vy*edt;
    /* 轻微分离：20Hz 时间节流。
       原实现是 ((sepTick+i)&3)===0 —— 注意 &3 是"每 4 步"不是每 3 步，
       60Hz 下即 15Hz、每次推力 26，每秒总冲量 15×26 = 390。
       改成固定 20Hz 后，单次推力应为 390/20 = 19.5，与帧率无关。 */
    e.sepT=(e.sepT||0)+edt;
    if(e.sepT>=1/20){
      e.sepT=0;
      const list=gridQueryCell(e.x,e.y,e.r);
      for(let k=0;k<list.length && k<6;k++){
        const o=list[k]; if(o===e||!o.alive) continue;
        const ox=e.x-o.x, oy=e.y-o.y, rr=e.r+o.r;
        const d2=ox*ox+oy*oy;
        if(d2<rr*rr && d2>0.01){
          const d=Math.sqrt(d2), push=(rr-d)/d*0.5;
          e.vx+=ox*push*19.5; e.vy+=oy*push*19.5;
        }
      }
    }
    // 撞玩家
    if(dist < e.r+p.r && e.hitCd<=0 && e.spawnT<=0){
      e.hitCd=0.7;
      hurtPlayer(e.dmg, e.x, e.y);
      // 汲取：命中玩家后自身回血，必须速杀否则打不动
      if(e.affix==='vampiric' && e.alive){
        e.hp=Math.min(e.maxHp, e.hp+e.maxHp*0.18);
        emit(e.x,e.y,10,{smin:40,smax:150,lmin:.3,lmax:.6,sizmin:1.6,sizmax:3.2,col:[225,130,255],drag:3});
        addText(e.x, e.y-e.r-6, '汲取', [225,130,255], 14, 0.6);
      }
      const kb=e.ai==='charge'&&e.phase===2?1.6:1;
      e.vx-=ux*160*kb; e.vy-=uy*160*kb;
    }
  }

  // Boss 撞玩家
  if(boss&&boss.alive&&boss.dying<=0&&boss.entry<=0){
    const dx=p.x-boss.x, dy=p.y-boss.y, dist=Math.hypot(dx,dy)||1;
    if(dist<boss.r+p.r) hurtPlayer(boss.dmg, boss.x, boss.y);
  }

  // 玩家子弹
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.life-=dt;
    let dead=b.life<=0;
    if(!dead){
      /* 制导：按 30Hz 时间节流（原来是"每 2 个逻辑步"，185Hz 下会变成 92Hz，白白三倍开销） */
      b.homeT=(b.homeT||0)+dt;
      if(b.home>0 && b.homeT>=1/30){
        b.homeT=0;
        const list=gridQuery(b.x,b.y,300);
        let best=null,bd=90000;
        for(let k=0;k<list.length;k++){
          const e=list[k]; if(!e.alive) continue;
          if(b.hits.indexOf(e.id)>=0) continue;
          const ddx=e.x-b.x, ddy=e.y-b.y, d2=ddx*ddx+ddy*ddy;
          if(d2<bd && d2<90000){ bd=d2; best=e; }
        }
        if(best){
          const sp=Math.hypot(b.vx,b.vy)||1;
          const ca=Math.atan2(b.vy,b.vx);
          let da=Math.atan2(best.y-b.y,best.x-b.x)-ca;
          while(da>Math.PI)da-=TAU; while(da<-Math.PI)da+=TAU;
          /* 每次转向的角速度上限。
             原实现是每 2 步执行、每次 clamp 到 b.home*2.6*dt*2（dt=1/60），
             即每次 home*2.6*(2/60)=home*2.6*(1/30)，每秒合计 home*2.6 rad。
             节流后间隔同样是 1/30 秒，所以直接用 2.6*(1/30) 即可 ——
             再乘 2 会让转向速率翻倍（每秒 home*5.2），追踪过强。 */
          const turn=clamp(da, -b.home*2.6*(1/30), b.home*2.6*(1/30));
          const na=ca+turn;
          b.vx=Math.cos(na)*sp; b.vy=Math.sin(na)*sp;
          if(Math.random()<pStep(0.25)) emit(b.x,b.y,1,{smin:10,smax:40,lmin:.12,lmax:.26,
            sizmin:1,sizmax:2,col:[150,255,255],drag:6});
        }
      }
      const steps=clamp(Math.ceil(Math.hypot(b.vx,b.vy)*dt/(b.r+9)),1,5);
      const sdt=dt/steps;
      for(let s=0;s<steps && !dead;s++){
        b.x+=b.vx*sdt; b.y+=b.vy*sdt;
        if(b.x<-40||b.x>W+40||b.y<-40||b.y>H+40){
          /* 弹射供弹：贴边界反弹一次，反弹后伤害 +20% 且可重新命中 */
          if(b.bounce>0){
            b.bounce=0;
            if(b.x<-40||b.x>W+40) b.vx=-b.vx;
            if(b.y<-40||b.y>H+40) b.vy=-b.vy;
            b.x=clamp(b.x,-38,W+38); b.y=clamp(b.y,-38,H+38);
            b.dmg*=1.20; b.hits.length=0;
            emit(b.x,b.y,6,{smin:40,smax:160,lmin:.15,lmax:.35,
              sizmin:1.3,sizmax:2.6,col:b.wcol||[130,250,255],drag:4});
            continue;
          }
          dead=true; break;
        }
        const list=gridQuery(b.x,b.y,b.r);
        for(let k=0;k<list.length;k++){
          const e=list[k]; if(!e.alive) continue;
          if(b.hits.indexOf(e.id)>=0) continue;
          const dx=e.x-b.x, dy=e.y-b.y, rr=e.r+b.r;
          if(dx*dx+dy*dy<=rr*rr){
            let dmg=b.dmg*(b.crit?player.critMul:1);
            /* 贯通核心代价：每多穿透一个目标，伤害 ×0.70 */
            if(player.mut.overbore && b.hits.length>0)
              dmg*=Math.pow(0.70, b.hits.length);
            if(e.boss){
              if(e.dying>0){ b.hits.push(e.id); if(b.hits.length>b.pierce) dead=true; continue; }
              const ov = e.over ? 1+(e.age-70)*0.12 : 1;
              e.hp-=dmg*ov; e.flash=1;
              if(e.over && Math.random()<pStep(0.5)) emit(b.x,b.y,1,{smin:20,smax:120,lmin:.2,lmax:.45,
                sizmin:1.4,sizmax:3,col:[255,150,90],drag:3});
              addText(b.x,b.y-8,''+Math.round(dmg),b.crit?[255,230,90]:[240,250,255],b.crit?20:15,0.55);
              emit(b.x,b.y,6,{smin:40,smax:170,lmin:.15,lmax:.32,sizmin:1.3,sizmax:2.6,col:e.col,drag:5});
              if(b.crit) Audio_.crit(); else Audio_.hit();
              hitStop=Math.max(hitStop,0.02);
              if(e.hp<=0 && e.dying<=0){ e.dying=1.25; e.invuln=true; }
            } else {
              damageEnemy(e,dmg,b.crit,b.x,b.y);
            }
            b.hits.push(e.id);
            if(b.hits.length>b.pierce){ dead=true; }
            break;
          }
        }
      }
    }
    if(dead){ bullets[i]=bullets[bullets.length-1]; bullets.pop(); pBullets.put(b); }
  }

  // 敌方子弹
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i];
    b.life-=edt;
    b.x+=b.vx*edt; b.y+=b.vy*edt;
    let dead=b.life<=0||b.x<-30||b.x>W+30||b.y<-30||b.y>H+30;
    if(!dead){
      const dx=p.x-b.x, dy=p.y-b.y, rr=p.r+b.r-1;
      if(dx*dx+dy*dy<=rr*rr){
        if(p.iframe<=0){
          hurtPlayer(b.dmg,b.x,b.y);
          emit(b.x,b.y,8,{smin:40,smax:170,lmin:.15,lmax:.35,sizmin:1.3,sizmax:2.6,col:b.col||EB_COL,drag:5});
        }
        dead=true;
      }
    }
    if(dead){ ebullets[i]=ebullets[ebullets.length-1]; ebullets.pop(); pEBullets.put(b); }
  }

  // 掉落
  const magR=88*p.magnet;
  for(let i=gems.length-1;i>=0;i--){
    const g=gems[i];
    g.life-=dt; g.t+=dt;
    const dx=p.x-g.x, dy=p.y-g.y, d=Math.hypot(dx,dy)||1;
    // 远距离弱牵引 + 近距离强吸附，保证掉落物一定能被捡到
    const pull = 55 + 780*Math.max(0,1-d/520)*p.magnet + (d<magR?900*(1-d/magR):0);
    g.vx+=dx/d*pull*dt; g.vy+=dy/d*pull*dt;
    g.vx*=1-2.0*dt; g.vy*=1-2.0*dt;
    g.x+=g.vx*dt; g.y+=g.vy*dt;
    if(d<p.r+10){
      if(g.type===1){ p.hp=Math.min(p.maxHp,p.hp+22); addText(g.x,g.y-14,'+22',[255,110,140],18,0.7); Audio_.heal(); }
      else if(g.type===2){
        p.frenzy=Math.min(14,p.frenzy+8); flashScreen=Math.max(flashScreen,0.30);
        addText(g.x,g.y-14,'狂热 FRENZY',[255,180,70],19,1.3,true); Audio_.levelup();
        ring(p.x,p.y,180,[255,170,60],0.5);
      }
      else if(g.type===3){
        p.shield=Math.min(p.shieldMax, p.shield+60); p.shieldFlash=1;
        addText(g.x,g.y-14,'护盾 +60',[130,225,255],19,1.3,true); Audio_.heal();
        ring(p.x,p.y,150,[120,220,255],0.5);
      }
      else if(g.type===4){
        p.slow=Math.min(12,p.slow+6);
        addText(g.x,g.y-14,'时缓 SLOW',[200,150,255],19,1.3,true); Audio_.levelup();
        ring(p.x,p.y,320,[190,140,255],0.7); flashScreen=Math.max(flashScreen,0.16);
      }
      else if(g.type===5){
        /* 武器箱：解锁并换枪。给足反馈——清场环 + 短顿帧 + 专属音色 */
        const wid=(g.val|0)%WEAPONS.length;
        const isNew=!player.unlocked[wid];
        player.unlocked[wid]=1;
        player.weapon=wid; player.weaponFlash=1;
        const nw=WEAPONS[wid];
        addText(g.x,g.y-18, (isNew?'解锁 ':'切换 ')+nw.name, nw.col, 22, 1.5, true);
        ring(p.x,p.y,200,nw.col,0.55);
        emit(p.x,p.y,26,{smin:60,smax:260,lmin:.3,lmax:.7,sizmin:1.6,sizmax:3.6,col:nw.col,drag:2.4});
        flashScreen=Math.max(flashScreen,0.22); hitStop=Math.max(hitStop,0.05);
        Audio_.tone({type:'triangle',f1:420,f2:1180,dur:0.26,gain:0.10,atk:0.008});
        if(isNew) setTimeout(()=>Audio_.tone({type:'sine',f1:880,f2:1320,dur:0.22,gain:0.08,atk:0.01}),130);
      }
      else { player.xp+=g.val; addText(g.x,g.y-10,'+'+g.val,[140,255,210],14,0.5); Audio_.pickup(); }
      if(challenge && challenge.type==='gem' && !challenge.done) challengeProgress(1);
      gems[i]=gems[gems.length-1]; gems.pop(); pGems.put(g); continue;
    }
    if(g.life<=0){ gems[i]=gems[gems.length-1]; gems.pop(); pGems.put(g); }
  }

  // 环 / 飘字
  for(let i=rings.length-1;i>=0;i--){
    const o=rings[i]; o.life-=dt;
    o.r=lerp(o.r,o.maxR,1-Math.pow(0.02,dt));
    if(o.life<=0){ rings[i]=rings[rings.length-1]; rings.pop(); pRings.put(o); }
  }
  for(let i=texts.length-1;i>=0;i--){
    const o=texts[i]; o.life-=dt; o.y-=34*dt;
    if(o.life<=0){ texts[i]=texts[texts.length-1]; texts.pop(); pTexts.put(o); }
  }

  updateParticles(dt);
  updateDebris(dt);
  shake=Math.max(0,shake-dt*46);
  flashScreen=Math.max(0,flashScreen-dt*2.6);
  levelUpCheck();
}

/* ---------- 渲染 ---------- */
/* 极光带：三团缓慢漂移的巨型光斑，让静态星图有"活气"。
   只用预烘焙 sprite，不建渐变、不分配对象；低画质降为 1 团。 */
function drawAurora(){
  if(QUALITY.lv<=0) return;   // 已降到底档就停掉这层纯装饰混合
  const n=QUALITY.lv>=2?3:2;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const cols=[[0,170,255],[130,70,255],[0,255,190]];
  for(let i=0;i<n;i++){
    const c=cols[i];
    const x=W*(0.22+i*0.28)+Math.sin(time*0.11+i*2.1)*W*0.13;
    const y=H*(0.16+0.10*i)+Math.cos(time*0.08+i*1.7)*H*0.10;
    drawGlow(x,y,330+i*70,c[0],c[1],c[2],0.055+0.02*Math.sin(time*0.35+i));
  }
  ctx.restore();
}
function render(){
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.drawImage(bgCanvas,0,0,W,H);
  drawStarfield();
  drawAurora();

  ctx.save();
  const s=shake*store.shake;
  if(s>0.05 || camKickX||camKickY) ctx.translate(rnd(-s,s)+camKickX, rnd(-s,s)+camKickY);

  // 冲击环
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<rings.length;i++){
    const o=rings[i], t=o.life/o.max;
    ctx.strokeStyle='rgba('+o.col[0]+','+o.col[1]+','+o.col[2]+','+(t*0.55)+')';
    ctx.lineWidth=1+t*4.5;
    ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,TAU); ctx.stroke();
  }
  // 掉落：0经验 1治疗 2狂热 3护盾 4时缓 5武器箱
  for(let i=0;i<gems.length;i++){
    const g=gems[i];
    const wc = g.type===5 ? WEAPONS[(g.val|0)%4].col : null;
    const c = g.type===1?[255,110,140] : g.type===2?[255,170,60]
            : g.type===3?[120,220,255] : g.type===4?[190,140,255]
            : g.type===5? wc : [130,255,205];
    const pulse=0.7+0.3*Math.sin(g.t*8);
    const rad = g.type>=2 ? 16 : 11;
    drawGlow(g.x,g.y,rad,c[0],c[1],c[2],(g.type>=2?0.75:0.55)*pulse);
    /* 旋转外环：让掉落物在满屏粒子里依然可辨，同时暗示"可拾取" */
    if(QUALITY.lv>=1){
      ctx.save(); ctx.globalCompositeOperation='lighter';
      ctx.translate(g.x,g.y); ctx.rotate(g.t*(g.type>=2?0.9:1.5));
      ctx.strokeStyle=rgba(c[0],c[1],c[2],0.32+0.18*pulse);
      ctx.lineWidth=1.4; ctx.setLineDash([5,7]);
      ctx.beginPath(); ctx.arc(0,0,rad*1.55,0,TAU); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
    ctx.save(); ctx.translate(g.x,g.y); ctx.rotate(g.t*(g.type>=2?1.4:2.2));
    ctx.fillStyle=rgba(c[0],c[1],c[2],0.95);
    ctx.beginPath();
    if(g.type===1){ ctx.rect(-4,-4,8,8); }
    else if(g.type===2){ // 狂热：向上箭头
      ctx.moveTo(0,-8); ctx.lineTo(7,3); ctx.lineTo(2.5,3); ctx.lineTo(2.5,8);
      ctx.lineTo(-2.5,8); ctx.lineTo(-2.5,3); ctx.lineTo(-7,3); ctx.closePath(); }
    else if(g.type===3){ // 护盾：环形
      ctx.arc(0,0,7,0,TAU); ctx.moveTo(3.5,0); ctx.arc(0,0,3.5,0,TAU); }
    else if(g.type===4){ // 时缓：沙漏
      ctx.moveTo(-6,-7); ctx.lineTo(6,-7); ctx.lineTo(-6,7); ctx.lineTo(6,7); ctx.closePath(); }
    else if(g.type===5){ // 武器箱：菱形弹匣
      ctx.moveTo(0,-9); ctx.lineTo(7,0); ctx.lineTo(0,9); ctx.lineTo(-7,0); ctx.closePath(); }
    else { ctx.moveTo(0,-5);ctx.lineTo(5,0);ctx.lineTo(0,5);ctx.lineTo(-5,0);ctx.closePath(); }
    ctx.fill();
    if(g.type===5){ // 武器箱：画出将获得的武器图标
      ctx.rotate(-g.t*1.4);
      ctx.fillStyle=rgba(255,255,255,0.95);
      ctx.font='800 11px system-ui,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(WEAPONS[(g.val|0)%4].ico,0,0.5);
      ctx.strokeStyle=rgba(255,255,255,0.95); ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(0,-9); ctx.moveTo(0,9); ctx.lineTo(0,12); ctx.stroke();
    }
    if(g.type>=2){ ctx.strokeStyle=rgba(255,255,255,0.8); ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(0,0,11,0,TAU); ctx.stroke(); }
    ctx.restore();
  }

  // 敌人
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i]; if(!e.alive) continue;
    const c=e.col;
    const sc = e.spawnT>0 ? lerp(0.3,1,1-e.spawnT/0.28) : 1;
    if(QUALITY.glowEnemies) drawGlow(e.x,e.y,e.r*2.5*sc,c[0],c[1],c[2],0.34+e.flash*0.5);
    ctx.globalCompositeOperation='source-over';
    if(e.ai==='charge'&&e.phase===1){
      ctx.strokeStyle=rgba(c[0],c[1],c[2],0.5);
      ctx.lineWidth=1.6; ctx.setLineDash([8,8]);
      ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.lineTo(e.x+e.kx*300,e.y+e.ky*300); ctx.stroke();
      ctx.setLineDash([]);
    }
    if(e.ai==='snipe'&&e.phase===1){
      // 蓄力越满，预警线越亮越粗，最后 0.3 秒转实心 —— 给玩家明确的"该闪了"信号
      const chg=1-e.timer/1.0;
      const locked=e.timer<=0.3;
      ctx.globalCompositeOperation='lighter';
      const sc2=SNIPE_COL;
      ctx.strokeStyle=rgba(sc2[0],sc2[1],sc2[2], locked?0.95:(0.22+chg*0.45));
      ctx.lineWidth=locked?4.2:(1.2+chg*2.6);
      ctx.beginPath(); ctx.moveTo(e.x,e.y);
      ctx.lineTo(e.x+e.kx*1400,e.y+e.ky*1400); ctx.stroke();
      // 锁定瞬间：沿预警线画一排菱形刻度，明确"这条线上会来一发"
      if(locked){
        ctx.fillStyle=rgba(sc2[0],sc2[1],sc2[2],0.55);
        for(let k=1;k<=7;k++){
          const px=e.x+e.kx*k*170, py=e.y+e.ky*k*170;
          ctx.save(); ctx.translate(px,py); ctx.rotate(Math.atan2(e.ky,e.kx));
          ctx.beginPath(); ctx.moveTo(0,-4);ctx.lineTo(6,0);ctx.lineTo(0,4);ctx.lineTo(-6,0);
          ctx.closePath(); ctx.fill(); ctx.restore();
        }
      }
      // 枪口聚能点：用狙击色而不是敌人本体色，和即将射出的弹同色
      drawGlow(e.x,e.y, 10+chg*22, sc2[0],sc2[1],sc2[2], 0.35+chg*0.65);
      ctx.globalCompositeOperation='source-over';
    }
    const sz=e.r*sc;
    ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(e.rot); ctx.scale(sz,sz);
    const path=SHAPE[e.shape];
    ctx.lineWidth=2.4/sz;
    let cr=c[0],cg=c[1],cb=c[2];
    if(e.flash>0){ const f=e.flash; cr=lerp(cr,255,f); cg=lerp(cg,255,f); cb=lerp(cb,255,f); }
    ctx.fillStyle='rgba(5,8,18,0.75)'; ctx.fill(path);
    ctx.strokeStyle='rgba('+(cr|0)+','+(cg|0)+','+(cb|0)+',0.95)'; ctx.stroke(path);
    ctx.lineWidth=1.0/sz;
    ctx.strokeStyle='rgba('+lerp(cr,255,.7|0)+','+lerp(cg,255,.7)+','+lerp(cb,255,.7)+',0.85)';
    ctx.stroke(path);
    ctx.restore();
    ctx.globalCompositeOperation='lighter';
    // 血条
    if(e.hp<e.maxHp && e.r>=16){
      const bw=e.r*1.8, f=clamp(e.hp/e.maxHp,0,1);
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(e.x-bw/2,e.y-e.r-9,bw,3);
      ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+',0.95)'; ctx.fillRect(e.x-bw/2,e.y-e.r-9,bw*f,3);
      ctx.globalCompositeOperation='lighter';
    }
    /* 词缀标记：敌人上方的小图标 + 相位无敌时的护盾环 */
    if(e.affix){
      const a=affixById(e.affix);
      if(a){
        ctx.globalCompositeOperation='source-over';
        ctx.font='800 13px system-ui,sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle=rgba(a.col[0],a.col[1],a.col[2],0.95);
        ctx.fillText(a.ico, e.x, e.y-e.r-16);
        ctx.globalCompositeOperation='lighter';
      }
      if(e.affix==='phasing' && e.phaseT<0){
        ctx.strokeStyle=rgba(130,235,255,0.75); ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(e.x,e.y,e.r+6,0,TAU); ctx.stroke();
      }
      if(e.affix==='hasted'){
        ctx.strokeStyle=rgba(255,240,120,0.30); ctx.lineWidth=1.2;
        ctx.beginPath();
        ctx.moveTo(e.x-e.r*1.5,e.y); ctx.lineTo(e.x-e.r*0.7,e.y);
        ctx.moveTo(e.x+e.r*0.7,e.y); ctx.lineTo(e.x+e.r*1.5,e.y); ctx.stroke();
      }
      /* 词缀光环：一条按词缀色缓慢旋转的虚线弧，把"这只不一样"
         从图标文字变成余光里也能读到的视觉信号 */
      if(a && QUALITY.lv>=1){
        ctx.save(); ctx.globalCompositeOperation='lighter';
        ctx.translate(e.x,e.y); ctx.rotate(time*0.8+e.id*0.7);
        ctx.strokeStyle=rgba(a.col[0],a.col[1],a.col[2],0.42);
        ctx.lineWidth=1.5; ctx.setLineDash([6,9]);
        ctx.beginPath(); ctx.arc(0,0,e.r+9,0,TAU); ctx.stroke();
        ctx.setLineDash([]); ctx.restore();
      }
    }
    /* 首波沙包：训练靶标记。旧实现里 sandbag 被池清理覆盖且从未读取，
       玩家其实看不出"这一波可以放心试错" —— 现在真正画出来。 */
    if(e.sandbag){
      ctx.save(); ctx.globalCompositeOperation='lighter';
      ctx.translate(e.x,e.y); ctx.rotate(-time*0.5);
      ctx.strokeStyle=rgba(130,255,200,0.30); ctx.lineWidth=1.2;
      ctx.setLineDash([3,8]);
      ctx.beginPath(); ctx.arc(0,0,e.r+15,0,TAU); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
      ctx.save();
      ctx.font='700 9px system-ui,sans-serif'; ctx.textAlign='center';
      ctx.fillStyle=rgba(150,255,210,0.65);
      ctx.fillText('训练', e.x, e.y-e.r-28);
      ctx.restore();
    }
  }

  /* 机制型 Boss 的场外元素：MIRROR 残影 / RIFT 裂隙。
     必须画在本体之前，避免盖住主体轮廓。 */
  if(boss && boss.alive){
    const b=boss, c=b.col;
    ctx.globalCompositeOperation='lighter';
    if(b.echoes){
      for(const ec of b.echoes){
        const a=clamp(ec.t/2.7,0,1);
        drawGlow(ec.x,ec.y,b.r*1.5,c[0],c[1],c[2],a*0.35);
        ctx.strokeStyle=rgba(c[0],c[1],c[2],a*0.7);
        ctx.lineWidth=2.2;
        ctx.beginPath(); ctx.arc(ec.x,ec.y,b.r*(0.9+(1-a)*0.5),0,TAU); ctx.stroke();
        ctx.save(); ctx.translate(ec.x,ec.y); ctx.rotate(b.rot); ctx.scale(b.r*0.55,b.r*0.55);
        ctx.strokeStyle=rgba(c[0],c[1],c[2],a*0.55); ctx.lineWidth=3/b.r;
        ctx.stroke(SHAPE[b.shape]); ctx.restore();
      }
    }
    if(b.rifts){
      for(const rf of b.rifts){
        const fade=clamp(rf.t/0.8,0,1), pulse=0.5+0.5*Math.sin(time*9+rf.x);
        drawGlow(rf.x,rf.y,52+pulse*8,c[0],c[1],c[2],fade*0.42);
        ctx.strokeStyle=rgba(c[0],c[1],c[2],fade*(0.45+pulse*0.35));
        ctx.lineWidth=2;
        for(let k=0;k<2;k++){
          ctx.beginPath();
          ctx.arc(rf.x,rf.y, 22+k*12+pulse*4, time*(k?1.4:-1.1), time*(k?1.4:-1.1)+Math.PI*1.35);
          ctx.stroke();
        }
      }
    }
    ctx.globalCompositeOperation='source-over';
  }

  // Boss
  if(boss&&boss.alive){
    const b=boss, c=b.col;
    // 过载时整体泛橙红并随秒数加剧
    let bc=c;
    if(b.over){
      /* 阈值必须读难度档位：上一轮把过载从 70s 提前到 48/38s 后，
         这里仍硬编码 70，导致休闲/标准档过载后 (age-70) 为负，
         lerp 出越界颜色，过载的泛红反馈在整场战斗里几乎看不见。 */
      const k=clamp((b.age-DF().overAt)*0.06,0,1);
      bc=[lerp(c[0],255,k*0.8), lerp(c[1],90,k*0.9), lerp(c[2],60,k*0.9)];
    }
    drawGlow(b.x,b.y,b.r*2.8,bc[0],bc[1],bc[2],0.4+b.flash*0.55+(b.over?0.25:0));
    /* 入场光柱：Boss 从屏幕上方降下时，两道竖向能量束标出落点，
       把"⚠ 接近"的文字预警变成看得见的空间预警 */
    if(b.entry>0){
      const k=clamp(b.entry/2.0,0,1);
      ctx.save(); ctx.globalCompositeOperation='lighter';
      for(let i=-1;i<=1;i+=2){
        const xx=b.x+i*b.r*0.62;
        ctx.fillStyle=rgba(bc[0],bc[1],bc[2],0.10*k);
        ctx.fillRect(xx-3,0,6,b.y);
        drawGlow(xx,b.y,46,bc[0],bc[1],bc[2],0.32*k);
      }
      ctx.strokeStyle=rgba(bc[0],bc[1],bc[2],0.35*k); ctx.lineWidth=1.5;
      ctx.setLineDash([10,12]);
      ctx.beginPath(); ctx.moveTo(b.x,0); ctx.lineTo(b.x,b.y); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
    }
    ctx.globalCompositeOperation='source-over';
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot); ctx.scale(b.r,b.r);
    const path=SHAPE[b.shape];
    let cr=bc[0],cg=bc[1],cb=bc[2], f=b.flash;
    if(f>0){ cr=lerp(cr,255,f); cg=lerp(cg,255,f); cb=lerp(cb,255,f); }
    ctx.lineWidth=3.2/b.r;
    ctx.fillStyle='rgba(8,6,20,0.82)'; ctx.fill(path);
    ctx.strokeStyle='rgba('+(cr|0)+','+(cg|0)+','+(cb|0)+',0.98)'; ctx.stroke(path);
    ctx.lineWidth=1.2/b.r;
    ctx.strokeStyle='rgba('+lerp(cr,255,.75)+','+lerp(cg,255,.75)+','+lerp(cb,255,.75)+',0.9)';
    ctx.stroke(path);
    ctx.restore();
    // 内核
    ctx.globalCompositeOperation='lighter';
    const hpF=clamp(b.hp/b.maxHp,0,1);
    drawGlow(b.x,b.y,b.r*(0.32+hpF*0.22),255,255,255,0.22+hpF*0.2);
    ctx.globalCompositeOperation='source-over';
  }

  // 敌方子弹：颜色区分来源，拖尾长度随速度，狙击弹额外加脉冲环
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<ebullets.length;i++){
    const b=ebullets[i], c=b.col||EB_COL, sn=b.kind===1;
    if(QUALITY.trails){
      const tl = sn?0.032:clamp((b.sp||300)/16000,0.008,0.020);
      ctx.strokeStyle=rgba(c[0],c[1],c[2], sn?0.55:0.22);
      ctx.lineWidth=b.r*(sn?1.5:0.75);
      ctx.beginPath(); ctx.moveTo(b.x-b.vx*tl,b.y-b.vy*tl); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    drawGlow(b.x,b.y,b.r*(sn?4.4:3.0),c[0],c[1],c[2], sn?0.78:0.45);
    if(sn){
      const pulse=0.5+0.5*Math.sin(time*20);
      ctx.strokeStyle=rgba(c[0],c[1],c[2],0.3+pulse*0.45);
      ctx.lineWidth=1.8;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r*1.9+pulse*3,0,TAU); ctx.stroke();
    }
    ctx.fillStyle=rgba(c[0],c[1],c[2],0.98);
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*0.42,0,TAU); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';

  // 玩家子弹：拖尾长度随速度，头亮尾淡
  ctx.globalCompositeOperation='lighter';
  const tr = QUALITY.trails ? 0.030 : 0.014;
  for(let i=0;i<bullets.length;i++){
    const b=bullets[i];
    const c=b.crit?[255,235,150]:(b.wcol||[130,250,255]);
    const tx=b.x-b.vx*tr, ty=b.y-b.vy*tr;
    const mx=b.x-b.vx*tr*0.45, my=b.y-b.vy*tr*0.45;
    if(QUALITY.glowParticles) drawGlow(b.x,b.y,b.r*3.4,c[0],c[1],c[2],0.5);
    // 两段：远段暗、近段亮 —— 等效渐变但零分配
    ctx.strokeStyle=rgba(c[0],c[1],c[2],0.22);
    ctx.lineWidth=b.r*0.7;
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(mx,my); ctx.stroke();
    ctx.strokeStyle=rgba(c[0],c[1],c[2],0.8);
    ctx.lineWidth=b.r*1.15;
    ctx.beginPath(); ctx.moveTo(mx,my); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.strokeStyle='rgba(245,255,255,0.95)'; ctx.lineWidth=b.r*0.6;
    ctx.beginPath(); ctx.moveTo(b.x-b.vx*0.009,b.y-b.vy*0.009); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';

  // 玩家
  if(player.alive){
    const p=player;
    const rx=p.x-Math.cos(p.angle)*p.recoil, ry=p.y-Math.sin(p.angle)*p.recoil;
    let cr=110,cg=240,cb=255;
    if(p.hitFlash>0){ cr=lerp(cr,255,p.hitFlash); cg=lerp(cg,120,p.hitFlash); cb=lerp(cb,120,p.hitFlash); }
    ctx.globalCompositeOperation='lighter';
    drawGlow(rx,ry,p.r*3.2,cr,cg,cb,0.42+p.hitFlash*0.4);
    ctx.globalCompositeOperation='source-over';
    ctx.save(); ctx.translate(rx,ry); ctx.rotate(p.angle); ctx.scale(p.r,p.r);
    ctx.lineWidth=2.8/p.r;
    ctx.fillStyle='rgba(6,14,26,0.85)'; ctx.fill(SHAPE.dart);
    ctx.strokeStyle='rgba('+(cr|0)+','+(cg|0)+','+(cb|0)+',0.98)'; ctx.stroke(SHAPE.dart);
    ctx.lineWidth=1.1/p.r;
    ctx.strokeStyle='rgba(225,255,255,0.9)'; ctx.stroke(SHAPE.dart);
    ctx.restore();
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    /* 推进器：移动时朝反方向喷双层焰，静止时只留微弱余烬 */
    if(moveX||moveY){
      const back=p.angle+Math.PI;
      const fl=0.7+0.3*Math.sin(time*26);
      for(let i=0;i<2;i++){
        ctx.strokeStyle=rgba(i?220:80, i?255:225, 255, i?0.75:0.38);
        ctx.lineWidth=(i?2.2:5.5)*fl;
        ctx.beginPath();
        ctx.moveTo(rx+Math.cos(back)*p.r*0.8, ry+Math.sin(back)*p.r*0.8);
        ctx.lineTo(rx+Math.cos(back)*p.r*(i?2.0:1.5)*fl,
                   ry+Math.sin(back)*p.r*(i?2.0:1.5)*fl);
        ctx.stroke();
      }
    }
    /* 能量核心：随大招充能由青转金，满充能时脉动 */
    const uf=clamp(p.ult/p.ultMax,0,1);
    const core=uf>=1?[255,225,140]:[140,245,255];
    const cp=uf>=1?0.55+0.35*Math.sin(time*8):0.28+uf*0.25;
    drawGlow(rx,ry,p.r*0.85,core[0],core[1],core[2],cp);
    ctx.fillStyle=rgba(core[0],core[1],core[2],0.9);
    ctx.beginPath(); ctx.arc(rx,ry,p.r*0.24,0,TAU); ctx.fill();
    /* 护盾池：双弧 + 旋转刻度，与"受伤才闪一下"的无敌帧区分开 */
    if(p.shield>0){
      const sf=clamp(p.shield/p.shieldMax,0,1);
      const rr=p.r+12;
      ctx.strokeStyle=rgba(120,220,255,0.28); ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(p.x,p.y,rr,0,TAU); ctx.stroke();
      ctx.strokeStyle=rgba(160,240,255,0.85); ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(p.x,p.y,rr,-Math.PI/2,-Math.PI/2+TAU*sf); ctx.stroke();
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(time*0.9);
      ctx.strokeStyle=rgba(180,245,255,0.35); ctx.lineWidth=1.2;
      ctx.setLineDash([2,11]);
      ctx.beginPath(); ctx.arc(0,0,rr+5,0,TAU); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
    }
    /* 冲刺：旧实现用 iframe/0.82 归一化，而冲刺 iframe 只有 0.1，
       环淡到几乎看不见。这里用 dashT 单独给一圈亮环 */
    if(p.dashT>0){
      const d=clamp(p.dashT/0.18,0,1);
      ctx.strokeStyle=rgba(170,250,255,0.35+0.5*d); ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r+7+(1-d)*16,0,TAU); ctx.stroke();
    }
    /* 无敌帧（受击后）保留原有细环 */
    if(p.iframe>0 && p.dashT<=0){
      const a=p.iframe/0.82;
      ctx.strokeStyle='rgba(120,240,255,'+(a*0.6)+')';
      ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.x,p.y,p.r+7+(1-a)*5,0,TAU); ctx.stroke();
    }
    /* 低血：随心跳呼吸的红色警戒环，比屏幕四边泛红更早被注意到 */
    if(p.hp/p.maxHp<0.3){
      const hb=0.5+0.5*Math.sin(time*7);
      ctx.strokeStyle=rgba(255,70,100,0.22+0.32*hb); ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r+20+hb*4,0,TAU); ctx.stroke();
    }
    ctx.restore();
  }

  drawDebris();
  drawParticles();

  // 飘字
  ctx.globalCompositeOperation='source-over';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=0;i<texts.length;i++){
    const o=texts[i], t=o.life/o.max;
    const a = t>0.8 ? (1-t)/0.2 : Math.min(1,t/0.35);
    ctx.font='800 '+o.size+'px system-ui,-apple-system,"PingFang SC",sans-serif';
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillText(o.str,o.x+1,o.y+1);
    ctx.fillStyle='rgba('+o.col[0]+','+o.col[1]+','+o.col[2]+','+clamp(a,0,1)+')';
    ctx.fillText(o.str,o.x,o.y);
  }

  ctx.restore();

  // 触屏摇杆（不随震屏抖动）
  if(usingTouch) drawSticks();

  // 屏幕闪
  if(flashScreen>0.01){
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(120,220,255,'+(flashScreen*0.30)+')';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';
  }
  if(dangerPulse>0.01){
    const a=Math.abs(Math.sin(dangerPulse*7))*0.22*(dangerPulse/1.6);
    ctx.fillStyle='rgba(255,60,90,'+a+')';
    ctx.fillRect(0,0,W,H);
  }
  // 暗角
  ctx.drawImage(vignette,0,0,W,H);
  // 低血警示：屏幕边缘随心跳泛红
  if(player && player.alive && player.hp/player.maxHp<0.3 && state===ST.PLAYING){
    const f=player.hp/player.maxHp/0.3;
    const a=(0.10+0.10*Math.sin(time*6))*(1-f*0.5);
    ctx.fillStyle='rgba(255,40,70,'+a+')';
    ctx.fillRect(0,0,W,10); ctx.fillRect(0,H-10,W,10);
    ctx.fillRect(0,0,10,H); ctx.fillRect(W-10,0,10,H);
  }
  drawOffscreenMarks();
  drawHitDir();
  drawHUD();
}

/* 屏幕外目标指示：把视野外的大型目标（Boss / 精英 / 狙击者）投影到边缘 */
function drawOffscreenMarks(){
  if(state!==ST.PLAYING) return;
  const m=26;
  const mark=(x,y,col)=>{
    const cx=clamp(x, m, W-m), cy=clamp(y, m, H-m);
    const a=Math.atan2(y-cy===0?y-H/2:y-H/2, x-cx===0?x-W/2:x-W/2);
    const pulse=0.5+0.5*Math.sin(time*6+cx*0.02);
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    drawGlow(cx,cy,26,col[0],col[1],col[2],0.22+0.14*pulse);
    ctx.translate(cx,cy); ctx.rotate(a);
    /* 外圈虚线 + 实心箭头：在深色背景上比单个三角更好定位 */
    ctx.strokeStyle=rgba(col[0],col[1],col[2],0.35+0.25*pulse);
    ctx.lineWidth=1.2; ctx.setLineDash([3,5]);
    ctx.beginPath(); ctx.arc(0,0,17,0,TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=rgba(col[0],col[1],col[2],0.35);
    ctx.beginPath(); ctx.moveTo(17,0); ctx.lineTo(-9,-10); ctx.lineTo(-9,10); ctx.closePath(); ctx.fill();
    ctx.fillStyle=rgba(col[0],col[1],col[2],0.95);
    ctx.beginPath(); ctx.moveTo(11,0); ctx.lineTo(-7,-7); ctx.lineTo(-7,7); ctx.closePath(); ctx.fill();
    ctx.restore();
  };
  if(boss && boss.alive && boss.dying<=0 && (boss.y<0||boss.y>H||boss.x<0||boss.x>W)) mark(boss.x,boss.y,boss.col);
  /* 蓄力中的狙击手用狙击色标出，玩家能提前知道危险方向 */
  for(let i=0;i<enemies.length;i++){ const e=enemies[i];
    if(e.alive && e.ai==='snipe' && e.phase===1 &&
       (e.x<0||e.x>W||e.y<0||e.y>H)) mark(e.x,e.y,SNIPE_COL); }
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    if(!e.alive) continue;
    if(e.type!=='elite' && e.type!=='sniper') continue;
    if(e.x>=0&&e.x<=W&&e.y>=0&&e.y<=H) continue;
    mark(e.x,e.y,e.col);
  }
}

/* 受击方向：屏幕边缘对应方位泛红，告诉你伤害来自哪边 */
function drawHitDir(){
  const p=player;
  if(state!==ST.PLAYING || p.hitDirT<=0) return;
  const a=p.hitDir, t=p.hitDirT;
  ctx.save();
  ctx.translate(W/2,H/2); ctx.rotate(a);
  // 以玩家为中心的扇形，画在半径 300 处
  ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle=rgba(255,60,80,t*0.75);
  ctx.lineWidth=8;
  ctx.beginPath(); ctx.arc(0,0,300,-0.30,0.30); ctx.stroke();
  ctx.globalCompositeOperation='source-over';
  ctx.restore();
}

function drawSticks(){
  ctx.globalCompositeOperation='lighter';
  const k=STICK_R/52;                       // 布局缩放系数
  const one=(s,dx_,dy_,col,active)=>{
    const ox=s?s.ox:dx_, oy=s?s.oy:dy_;
    /* 底光：让摇杆在满屏弹幕里仍有稳定的视觉锚点 */
    drawGlow(ox,oy,STICK_R*1.15,
      col==='90,240,255'?90:255, col==='90,240,255'?220:150,
      col==='90,240,255'?255:90, active?0.14:0.07);
    ctx.strokeStyle='rgba('+col+','+(active?0.34:0.15)+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(ox,oy,STICK_R,0,TAU); ctx.stroke();
    /* 四向刻度：不遮挡手指，但给出方向参照 */
    ctx.save(); ctx.translate(ox,oy); ctx.rotate(time*0.12);
    ctx.strokeStyle='rgba('+col+',0.20)'; ctx.lineWidth=1.2;
    ctx.setLineDash([2,10]);
    ctx.beginPath(); ctx.arc(0,0,STICK_R*0.78,0,TAU); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
    ctx.fillStyle='rgba('+col+','+(active?0.16:0.09)+')';
    ctx.beginPath(); ctx.arc(ox,oy,20*k,0,TAU); ctx.fill();
    if(s){
      let dx=s.x-ox, dy=s.y-oy;
      const l=Math.hypot(dx,dy)||1, m=Math.min(l,STICK_R)/l;
      const kx=ox+dx*m, ky=oy+dy*m;
      /* 力度弧：推多远画多长，把"我到底推了多少"变成可见反馈 */
      const mag=clamp(l/STICK_R,0,1);
      if(mag>0.03){
        ctx.strokeStyle='rgba('+col+',0.55)'; ctx.lineWidth=4;
        ctx.lineCap='round';
        ctx.beginPath();
        ctx.arc(ox,oy,STICK_R-2,-Math.PI/2,-Math.PI/2+TAU*mag);
        ctx.stroke();
        ctx.lineCap='round';
      }
      /* 方向连线 */
      ctx.strokeStyle='rgba('+col+',0.30)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(kx,ky); ctx.stroke();
      ctx.fillStyle='rgba('+col+',0.26)';
      ctx.beginPath(); ctx.arc(kx,ky,22*k,0,TAU); ctx.fill();
      ctx.strokeStyle='rgba('+col+',0.8)'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(kx,ky,22*k,0,TAU); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(kx,ky,4*k,0,TAU); ctx.fill();
    }
  };
  one(sticks.move, STICK_LX, STICK_Y, '90,240,255', !!sticks.move);
  one(sticks.aim, STICK_RX, STICK_Y, '255,150,90', !!sticks.aim);
  // 冲刺键（底部中央）
  const p=player, ready=p && p.dashCdT<=0;
  ctx.strokeStyle=rgba(ready?150:90, ready?245:150, 255, ready?0.55:0.25);
  ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(DASH_BTN.x,DASH_BTN.y,DASH_BTN.r,0,TAU); ctx.stroke();
  ctx.fillStyle=rgba(ready?150:90, ready?245:150, 255, ready?0.18:0.08);
  ctx.beginPath(); ctx.arc(DASH_BTN.x,DASH_BTN.y,DASH_BTN.r,0,TAU); ctx.fill();
  if(!ready){
    ctx.strokeStyle=rgba(150,245,255,0.8); ctx.lineWidth=5;
    ctx.beginPath();
    ctx.arc(DASH_BTN.x,DASH_BTN.y,DASH_BTN.r,-Math.PI/2,-Math.PI/2+TAU*(1-p.dashCdT/p.dashCd));
    ctx.stroke();
  }
  ctx.fillStyle=rgba(ready?200:120, ready?250:180, 255, ready?0.95:0.45);
  ctx.font='800 26px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('⇢', DASH_BTN.x, DASH_BTN.y+1);

  // 换枪键（冲刺左侧）：显示下一把已解锁武器的图标
  if(p){
    const w=curWeapon();
    ctx.strokeStyle=rgba(w.col[0],w.col[1],w.col[2],0.5); ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(SWAP_BTN.x,SWAP_BTN.y,SWAP_BTN.r,0,TAU); ctx.stroke();
    ctx.fillStyle=rgba(w.col[0],w.col[1],w.col[2],0.16);
    ctx.beginPath(); ctx.arc(SWAP_BTN.x,SWAP_BTN.y,SWAP_BTN.r,0,TAU); ctx.fill();
    ctx.fillStyle=rgba(230,250,255,0.92); ctx.font='800 24px system-ui,sans-serif';
    ctx.fillText(w.ico, SWAP_BTN.x, SWAP_BTN.y+1);
    ctx.font='700 10px system-ui,sans-serif'; ctx.fillStyle=rgba(180,220,240,0.7);
    ctx.fillText('换枪', SWAP_BTN.x, SWAP_BTN.y+SWAP_BTN.r-6);
  }

  // 大招键（冲刺右侧）：充能环，满则高亮脉动
  if(p){
    const f=clamp(p.ult/p.ultMax,0,1), full=f>=1;
    const pulse=full?0.75+0.25*Math.sin(time*8):0;
    ctx.strokeStyle=rgba(255,220,140, full?0.9:0.28); ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(ULT_BTN.x,ULT_BTN.y,ULT_BTN.r,0,TAU); ctx.stroke();
    ctx.fillStyle=rgba(255,220,140, full?0.20+pulse*0.15:0.07);
    ctx.beginPath(); ctx.arc(ULT_BTN.x,ULT_BTN.y,ULT_BTN.r,0,TAU); ctx.fill();
    if(f<1){
      ctx.strokeStyle=rgba(255,225,150,0.85); ctx.lineWidth=5;
      ctx.beginPath();
      ctx.arc(ULT_BTN.x,ULT_BTN.y,ULT_BTN.r,-Math.PI/2,-Math.PI/2+TAU*f);
      ctx.stroke();
    }
    ctx.fillStyle=rgba(255,235,180, full?0.98:0.42); ctx.font='800 22px system-ui,sans-serif';
    ctx.fillText('✸', ULT_BTN.x, ULT_BTN.y+1);
    ctx.font='700 10px system-ui,sans-serif'; ctx.fillStyle=rgba(255,225,170, full?0.95:0.5);
    ctx.fillText(full?'就绪':Math.floor(f*100)+'%', ULT_BTN.x, ULT_BTN.y+ULT_BTN.r-6);
  }
  ctx.globalCompositeOperation='source-over';
}

function fmtTime(t){
  const m=Math.floor(t/60), s=Math.floor(t%60);
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
const barGradCache=new Map();
/* ---------- HUD 视觉组件 ----------
   统一"玻璃仪表"语言：圆角背板 + 内发光 + 左侧色条 + 四角刻度，
   让散落的矩形条看起来属于同一套座舱界面，而不是贴在画面上的调试框。 */
function rrPath(x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
const glassCache=new Map();
function hudGlass(x,y,w,h,accent,a){
  if(a===undefined) a=0.74;
  const A=accent||[110,230,255];
  /* HUD 坐标固定；尺寸/颜色/透明度变化时最多重建一张小离屏图，避免每帧渐变与多段描边。 */
  const key=(x|0)+','+(y|0)+','+(w|0)+','+(h|0)+','+((A[0]>>3)<<10|(A[1]>>3)<<5|(A[2]>>3))+','+Math.round(a*16);
  let img=glassCache.get(key);
  if(!img){
    img=document.createElement('canvas');
    img.width=Math.max(1,Math.round(w)); img.height=Math.max(1,Math.round(h));
    const g=img.getContext('2d');
    g.translate(-x,-y);
    g.save();
    rrPath(x,y,w,h,11);
    g.fillStyle=rgba(6,14,28,a); g.fill();
    const grd=g.createLinearGradient(x,y,x,y+h);
    grd.addColorStop(0,rgba(A[0],A[1],A[2],0.15));
    grd.addColorStop(0.55,rgba(A[0],A[1],A[2],0.02));
    grd.addColorStop(1,rgba(0,0,0,0.20));
    g.fillStyle=grd; g.fill();
    g.strokeStyle=rgba(A[0],A[1],A[2],0.40); g.lineWidth=1.2; g.stroke();
    g.fillStyle=rgba(A[0],A[1],A[2],0.80);
    g.fillRect(x+1,y+9,2.5,h-18);
    g.fillStyle=rgba(A[0],A[1],A[2],0.62);
    g.fillRect(x+10,y,18,1.5); g.fillRect(x,y+10,1.5,18);
    g.fillRect(x+w-28,y+h-1.5,18,1.5); g.fillRect(x+w-1.5,y+h-28,1.5,18);
    g.restore();
    if(glassCache.size>48) glassCache.clear();
    glassCache.set(key,img);
  }
  ctx.drawImage(img,x,y);
}
function glowBar(x,y,w,h,f,c1,c2,accent){
  const A=accent||[110,230,255];
  f=clamp(f,0,1);
  ctx.save();
  rrPath(x-1,y-1,w+2,h+2,Math.min(5,h/2));
  ctx.fillStyle='rgba(2,7,16,0.74)'; ctx.fill();
  rrPath(x,y,w,h,Math.min(4,h/2));
  ctx.fillStyle='rgba(255,255,255,0.055)'; ctx.fill();
  if(f>0){
    const fw=Math.max(1,w*f);
    rrPath(x,y,fw,h,Math.min(4,h/2));
    /* 用底色+亮端覆盖替代每帧线性渐变；近距离仍保留亮端和描边。 */
    ctx.fillStyle=c1; ctx.fill();
    const tip=Math.min(28,fw);
    if(tip>2){
      ctx.save();
      rrPath(x+fw-tip,y,tip,h,Math.min(4,h/2)); ctx.clip();
      ctx.fillStyle=c2; ctx.fillRect(x+fw-tip,y,tip,h);
      ctx.restore();
    }
    ctx.fillStyle=rgba(255,255,255,0.55);
    ctx.fillRect(x+fw-2,y+1,2,h-2);
  }
  ctx.strokeStyle=rgba(A[0],A[1],A[2],0.30); ctx.lineWidth=1;
  rrPath(x-0.5,y-0.5,w+1,h+1,Math.min(5,h/2)); ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,0.32)'; ctx.lineWidth=1;
  for(let i=1;i<4;i++){
    const xx=x+w*i/4;
    ctx.beginPath(); ctx.moveTo(xx,y+1); ctx.lineTo(xx,y+h-1); ctx.stroke();
  }
  ctx.restore();
}
function hudTextShadow(col,blur){
  if(QUALITY.lv<=0) return;
  ctx.shadowColor=col||'rgba(0,220,255,.7)'; ctx.shadowBlur=blur||8;
}
function bar(x,y,w,h,f,c1,c2){
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.fillStyle='rgba(255,255,255,0.07)'; ctx.fillRect(x,y,w,h);
  /* 渐变只与 (x,w,c1,c2) 有关，缓存后每帧零分配 */
  const key=x+'|'+w+'|'+c1+'|'+c2;
  let g=barGradCache.get(key);
  if(!g){
    g=ctx.createLinearGradient(x,0,x+w,0);
    g.addColorStop(0,c1); g.addColorStop(1,c2);
    if(barGradCache.size>64) barGradCache.clear();
    barGradCache.set(key,g);
  }
  ctx.fillStyle=g; ctx.fillRect(x,y,w*clamp(f,0,1),h);
  ctx.strokeStyle='rgba(160,240,255,0.35)'; ctx.lineWidth=1; ctx.strokeRect(x-0.5,y-0.5,w+1,h+1);
}
function drawHUD(){
  const p=player;
  ctx.globalCompositeOperation='source-over';
  ctx.textBaseline='middle';
  /* 左上：玻璃仪表组（生命 / 护盾 / 等级 / 大招） */
  const lowHp = p.hp/p.maxHp<0.30;
  const hullPulse = lowHp ? 0.5+0.5*Math.sin(time*7) : 0;
  hudGlass(14,12,262,120, lowHp?[255,90,120]:[110,230,255], lowHp?0.80:0.74);
  if(lowHp){
    ctx.save(); rrPath(14,12,262,120,11);
    ctx.strokeStyle=rgba(255,80,110,0.28+0.42*hullPulse); ctx.lineWidth=2; ctx.stroke();
    ctx.restore();
  }
  ctx.textAlign='left';
  ctx.font='800 11px system-ui,sans-serif';
  ctx.fillStyle=rgba(150,220,240,0.62);
  ctx.fillText('▰ HULL INTEGRITY',26,26);
  glowBar(26,36,236,13,p.hp/p.maxHp,'rgba(255,70,110,0.95)','rgba(255,150,180,0.95)',[255,90,130]);
