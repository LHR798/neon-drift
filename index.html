  ctx.font='700 12px ui-monospace,monospace';
  ctx.fillStyle='rgba(255,235,245,0.98)';
  hudTextShadow('rgba(255,60,110,.8)',6);
  ctx.fillText(Math.ceil(p.hp)+' / '+Math.round(p.maxHp),30,43);
  ctx.shadowBlur=0;
  // 护盾条（有护盾才显示，叠在生命条下方）
  if(p.shield>0){
    glowBar(26,52,236,5,p.shield/p.shieldMax,'rgba(90,200,255,0.95)','rgba(180,245,255,0.95)',[120,220,255]);
  }
  // 等级 / 经验
  ctx.font='800 11px system-ui,sans-serif';
  ctx.fillStyle=rgba(150,220,240,0.62);
  ctx.fillText('◈ LV '+p.level,26,66);
  glowBar(26,76,236,8,p.xp/p.xpNeed,'rgba(60,255,200,0.95)','rgba(150,255,230,0.95)',[80,255,200]);
  // 大招充能条：满则金色脉动提示可释放
  const uf=clamp(p.ult/p.ultMax,0,1), uFull=uf>=1;
  ctx.font='800 11px system-ui,sans-serif';
  ctx.fillStyle=rgba(255,225,150, uFull?0.98:0.72);
  if(uFull) hudTextShadow('rgba(255,200,80,.85)',10);
  ctx.fillText(uFull?'✸ 超新星 就绪 [Q]':'✸ 超新星 '+Math.floor(uf*100)+'%',26,98);
  ctx.shadowBlur=0;
  glowBar(26,108,236,9,uf,
    uFull?'rgba(255,220,120,0.98)':'rgba(255,180,90,0.9)',
    uFull?'rgba(255,250,200,0.98)':'rgba(255,230,160,0.95)',[255,210,110]);
  if(uFull){
    const a=0.22+0.20*Math.sin(time*7);
    ctx.save(); rrPath(26,108,236,9,4);
    ctx.fillStyle=rgba(255,235,170,a); ctx.fill(); ctx.restore();
  }
  // 中上：波次 / 时间（胶囊玻璃 + 两侧刻度）
  hudGlass(W/2-104,10,208,62,[90,220,255],0.68);
  ctx.textAlign='center';
  ctx.font='800 25px system-ui,sans-serif';
  hudTextShadow('rgba(0,220,255,.8)',12);
  ctx.fillStyle='rgba(190,250,255,0.98)';
  ctx.fillText('WAVE '+wave, W/2, 33);
  ctx.shadowBlur=0;
  ctx.font='700 14px ui-monospace,monospace';
  ctx.fillStyle='rgba(130,215,240,0.92)';
  ctx.fillText(fmtTime(time), W/2, 57);
  ctx.fillStyle=rgba(90,220,255,0.55);
  ctx.fillRect(W/2-78,66,156,1.5);
  /* 下一位 Boss 倒计时：提前 20 秒预警，让玩家有时间攒大招/调整站位 */
  if(!boss && Number.isFinite(nextBossAt) && nextBossAt-time<=20 && state===ST.PLAYING){
    const left=Math.max(0,nextBossAt-time);
    const blink=0.6+0.4*Math.sin(time*7);
    const f=clamp(left/20,0,1);
    ctx.save();
    hudGlass(W/2-112,70,224,28,[255,130,110],0.80);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='800 12px system-ui,sans-serif';
    hudTextShadow('rgba(255,110,90,.8)',10);
    ctx.fillStyle=rgba(255,170,145,blink);
    ctx.fillText('⚠  BOSS 来袭  '+left.toFixed(0)+'s', W/2, 84);
    ctx.shadowBlur=0;
    ctx.fillStyle=rgba(255,255,255,0.10);
    ctx.fillRect(W/2-96,93,192,2);
    ctx.fillStyle=rgba(255,130,110,0.85);
    ctx.fillRect(W/2-96,93,192*(1-f),2);
    ctx.restore();
  }

  // 连杀：中上偏下，带剩余时间条
  if(combo>1){
    const left=clamp(1-(time-comboLast)/2.6,0,1);
    const pop=1+comboPop*0.35;
    ctx.font='800 '+Math.round(17*pop)+'px system-ui,sans-serif';
    const cc = combo>=15?'255,150,60' : combo>=8?'255,210,90' : '190,250,255';
    ctx.fillStyle='rgba('+cc+',0.95)';
    hudTextShadow('rgba('+cc+',.8)',14);
    ctx.fillText('COMBO x'+combo+'   '+comboMul.toFixed(2)+'倍', W/2, 100);
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba('+cc+',0.55)';
    ctx.fillRect(W/2-60, 112, 120*left, 2.5);
  }
  /* 挑战面板：屏幕右上偏下，显示目标、进度、剩余时间、奖励 */
  if(challenge){
    const cx=W-26, cy0=172;
    const urg=challenge.tLeft/challenge.tMax<0.3;
    ctx.textAlign='right';
    ctx.globalCompositeOperation='source-over';
    const A=urg?[255,120,90]:[255,215,130];
    hudGlass(cx-250, cy0-18, 250, 64, A, 0.80);
    if(urg){
      ctx.save(); rrPath(cx-250,cy0-18,250,64,11);
      ctx.strokeStyle=rgba(255,110,80,0.35+0.35*Math.sin(time*9));
      ctx.lineWidth=2; ctx.stroke(); ctx.restore();
    }
    // 标题 + 图标
    ctx.font='800 10px system-ui,sans-serif';
    ctx.fillStyle=rgba(A[0],A[1],A[2],0.85);
    ctx.fillText('⏱  限 时 挑 战', cx-12, cy0-6);
    // 目标 + 进度
    ctx.font='800 15px system-ui,sans-serif';
    ctx.fillStyle=rgba(235,250,255,0.98);
    hudTextShadow('rgba(0,220,255,.55)',7);
    const pl = challenge.type==='nodash' ? challenge.label
             : challenge.label+'  ['+Math.min(challenge.prog,challenge.target)+'/'+challenge.target+']';
    ctx.fillText(pl, cx-12, cy0+14);
    ctx.shadowBlur=0;
    // 剩余时间条：圆角
    const tl=clamp(challenge.tLeft/challenge.tMax,0,1);
    ctx.save(); rrPath(cx-232, cy0+26, 220, 5, 2.5);
    ctx.fillStyle=rgba(255,255,255,0.11); ctx.fill();
    if(tl>0){ rrPath(cx-232, cy0+26, 220*tl, 5, 2.5);
      ctx.fillStyle=rgba(A[0],A[1],A[2],0.95);
      ctx.shadowColor=rgba(A[0],A[1],A[2],.7); ctx.shadowBlur=8;
      ctx.fill(); }
    ctx.restore();
    // 奖励
    ctx.font='700 10.5px system-ui,sans-serif';
    ctx.fillStyle=rgba(255,235,170,0.85);
    ctx.fillText('奖励 '+challenge.rwIco+' '+challenge.rwTxt+'   ·   '+challenge.tLeft.toFixed(1)+'s',
      cx-12, cy0+42);
  }
  /* 引导气泡：不遮挡底部 150px，不覆盖拇指常用区，最多两行 */
  if(tutActive){
    const t=tutActive;
    const fade=clamp(Math.min(t.life,1.2)/1.2,0,1)*clamp((t.max-t.life)*3,0,1);
    let ax=W/2, ay=H*0.17;
    if(t.anchor==='left'){ ax=W*0.22; ay=H*0.40; }
    else if(t.anchor==='right'){ ax=W*0.78; ay=H*0.40; }
    else if(t.anchor==='dash'){ ax=DASH_BTN.x; ay=DASH_BTN.y-92; }
    else if(t.anchor==='ult'){ ax=ULT_BTN.x; ay=ULT_BTN.y-92; }
    ay=clamp(ay, 60, H-150);   // 绝不能落进底部拇指区
    ctx.globalCompositeOperation='source-over';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='700 12px system-ui,sans-serif';
    const wTxt=Math.max(ctx.measureText(t.text).width, ctx.measureText(t.sub||'').width);
    const bw=Math.min(wTxt+34, 340), bh=(t.sub?46:30);
    ctx.fillStyle=rgba(8,18,32,0.88*fade);
    ctx.strokeStyle=rgba(120,235,255,0.55*fade); ctx.lineWidth=1.2;
    const rx=clamp(ax-bw/2,8,W-bw-8);
    ctx.beginPath(); ctx.roundRect?ctx.roundRect(rx,ay-bh/2,bw,bh,10):ctx.rect(rx,ay-bh/2,bw,bh);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle=rgba(200,250,255,0.96*fade);
    ctx.font='800 14px system-ui,sans-serif';
    ctx.fillText(t.text, rx+bw/2, t.sub?ay-9:ay);
    if(t.sub){
      ctx.fillStyle=rgba(140,200,220,0.8*fade);
      ctx.font='600 11px system-ui,sans-serif';
      ctx.fillText(t.sub, rx+bw/2, ay+10);
    }
    // 跳过引导
    ctx.fillStyle=rgba(120,180,200,0.5*fade);
    ctx.font='600 10px system-ui,sans-serif';
    ctx.fillText('按 Tab 跳过引导', rx+bw/2, ay+bh/2+12);
    ctx.globalCompositeOperation='lighter';
  }

  /* 进化进度条：让玩家看得见"还差什么"，把进化从随机福利变成可规划目标 */
  const ep=evolutionProgress();
  if(ep && !player.evo[ep.ev.w]){
    const bx=18, by=H-104, bw=186, bh=30;
    ctx.globalCompositeOperation='source-over';
    hudGlass(bx,by,bw,bh,[255,210,110],0.78);
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.font='800 10.5px system-ui,sans-serif';
    ctx.fillStyle=rgba(255,235,170,0.95);
    ctx.fillText(ep.ev.ico+' '+WEAPONS[ep.ev.w].name+' → '+ep.ev.name, bx+10, by+10);
    // 两段进度：被动（前 30%）+ 击杀（后 70%）
    ctx.save(); rrPath(bx+10,by+19,bw-20,5,2.5);
    ctx.fillStyle=rgba(255,255,255,0.12); ctx.fill();
    const seg1=ep.hasP?(bw-20)*0.3:0;
    const seg2=(bw-20)*0.7*ep.k;
    if(seg1+seg2>0){ rrPath(bx+10,by+19,seg1+seg2,5,2.5);
      ctx.fillStyle=rgba(255,215,110,0.92);
      ctx.shadowColor='rgba(255,200,80,.7)'; ctx.shadowBlur=7; ctx.fill(); }
    ctx.restore();
    ctx.fillStyle=rgba(160,200,220,0.75);
    ctx.font='600 9px system-ui,sans-serif';
    ctx.textAlign='right';
    ctx.fillText(ep.hasP?('击杀 '+Math.floor(ep.k*ep.ev.kills)+'/'+ep.ev.kills)
                        :('需 '+UPGRADES.filter(u=>u.id===ep.ev.passive)[0].name), bx+bw-8, by+9);
    ctx.globalCompositeOperation='lighter';
  }

  /* 武器轮盘（触屏长按换枪键弹出） */
  if(radial.open){
    const R=CFG.radial.deadZone+Math.min(150, STICK_R*2.2);
    const openK=clamp(radial.t/0.12,0,1);
    ctx.globalCompositeOperation='source-over';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let i=0;i<4;i++){
      const w=WEAPONS[i], un=player.unlocked[i];
      const a0=-Math.PI/2+i*(TAU/4)-TAU/8, a1=a0+TAU/4;
      const sel=(radial.hl===i);
      ctx.beginPath();
      ctx.moveTo(radial.cx,radial.cy);
      ctx.arc(radial.cx,radial.cy, R*openK, a0, a1);
      ctx.closePath();
      ctx.fillStyle= un ? rgba(w.col[0],w.col[1],w.col[2], sel?0.42:0.16)
                        : rgba(60,70,85,0.14);
      ctx.fill();
      ctx.strokeStyle= sel?rgba(255,255,255,0.9):rgba(120,200,230,0.3);
      ctx.lineWidth= sel?2.5:1;
      ctx.stroke();
      if(!un) continue;
      const am=(a0+a1)/2;
      const ix=radial.cx+Math.cos(am)*R*0.62*openK;
      const iy=radial.cy+Math.sin(am)*R*0.62*openK;
      ctx.fillStyle=rgba(w.col[0],w.col[1],w.col[2],0.98);
      ctx.font='800 22px system-ui,sans-serif';
      ctx.fillText(w.ico, ix, iy-6);
      ctx.font='700 10px system-ui,sans-serif';
      ctx.fillStyle=rgba(220,245,255,0.8);
      ctx.fillText(w.name, ix, iy+12);
      if(i===player.weapon){
        ctx.fillStyle=rgba(255,240,150,0.95);
        ctx.font='800 12px system-ui,sans-serif';
        ctx.fillText('●', ix, iy-24);
      }
    }
    // 中心：取消区
    ctx.beginPath(); ctx.arc(radial.cx,radial.cy,CFG.radial.deadZone*openK+7,0,TAU);
    ctx.strokeStyle=rgba(120,235,255,0.18); ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ctx.arc(radial.cx,radial.cy,CFG.radial.deadZone*openK,0,TAU);
    ctx.fillStyle=rgba(6,12,22,0.88); ctx.fill();
    ctx.strokeStyle=rgba(140,225,255,0.65); ctx.lineWidth=1.6; ctx.stroke();
    ctx.fillStyle=rgba(150,200,220,0.7); ctx.font='700 11px system-ui,sans-serif';
    ctx.fillText('取消', radial.cx, radial.cy);
    ctx.globalCompositeOperation='lighter';
  }

  /* 底部左：冲刺冷却环 + 生效中的增益计时 */
  const dcx=60, dcy=H-58;
  const ready=p.dashCdT<=0;
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle=rgba(20,40,60,0.75);
  ctx.beginPath(); ctx.arc(dcx,dcy,22,0,TAU); ctx.fill();
  ctx.strokeStyle=rgba(ready?150:90, ready?245:140, 255, ready?0.95:0.45);
  ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.arc(dcx,dcy,22,0,TAU); ctx.stroke();
  if(!ready){ // 冷却填充
    const f=1-p.dashCdT/p.dashCd;
    ctx.strokeStyle=rgba(150,245,255,0.85); ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(dcx,dcy,22,-Math.PI/2,-Math.PI/2+TAU*f); ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';
  ctx.textAlign='center'; ctx.font='800 20px system-ui,sans-serif';
  ctx.fillStyle=rgba(ready?190:110, ready?250:170, 255, ready?1:0.5);
  ctx.fillText('⇢', dcx, dcy+1);
  ctx.font='700 10px system-ui,sans-serif';
  ctx.fillStyle=rgba(140,200,225,0.6);
  ctx.fillText(hasMouse?'冲刺 Shift/右键':'冲刺', dcx, dcy+36);

  let bx=100;
  const chip=(label,left,max,col)=>{
    /* Boss 血条底座占 H-90..H-24，增益 chip 必须上移，否则两者互相盖住 */
    const bossOnScreen = !!(boss && boss.alive && boss.dying<=0);
    const w=94, y=bossOnScreen?H-142:H-80;
    ctx.save(); rrPath(bx,y,w,34,9);
    ctx.fillStyle=rgba(6,14,28,0.80); ctx.fill();
    ctx.strokeStyle=rgba(col[0],col[1],col[2],0.55); ctx.lineWidth=1.2; ctx.stroke();
    ctx.fillStyle=rgba(col[0],col[1],col[2],0.85);
    ctx.fillRect(bx+1,y+9,2.5,16);
    ctx.save(); rrPath(bx+8,y+27,w-16,4,2);
    ctx.fillStyle=rgba(255,255,255,0.10); ctx.fill();
    rrPath(bx+8,y+27,(w-16)*clamp(left/max,0,1),4,2);
    ctx.fillStyle=rgba(col[0],col[1],col[2],0.95);
    ctx.shadowColor=rgba(col[0],col[1],col[2],.7); ctx.shadowBlur=7; ctx.fill();
    ctx.restore();
    ctx.restore();
    ctx.textAlign='left'; ctx.font='800 13px system-ui,sans-serif';
    ctx.fillStyle=rgba(col[0],col[1],col[2],0.98);
    ctx.fillText(label, bx+12, y+13);
    ctx.textAlign='right'; ctx.font='700 11px ui-monospace,monospace';
    ctx.fillStyle=rgba(255,255,255,0.85);
    ctx.fillText(left.toFixed(1)+'s', bx+w-8, y+13);
    bx+=w+10;
  };
  if(p.frenzy>0) chip('狂热',p.frenzy,14,[255,175,60]);
  if(p.slow>0)   chip('时缓',p.slow,12,[195,145,255]);

  // 已选强化：左上角一排小图标
  const keys=Object.keys(p.upg);
  if(keys.length){
    ctx.textAlign='left'; ctx.font='700 14px system-ui,sans-serif';
    let ix=26, iy=148;
    ctx.font='800 9px system-ui,sans-serif';
    ctx.fillStyle=rgba(120,190,215,0.55);
    ctx.fillText('已 选 强 化', 26, iy-10);
    ctx.font='700 14px system-ui,sans-serif';
    for(let i=0;i<keys.length && i<14;i++){
      const u=UPGRADES.find(v=>v.id===keys[i]); if(!u) continue;
      const lv=p.upg[keys[i]];
      const hi=lv>=3;
      const A=hi?[255,215,110]:[120,230,255];
      ctx.save(); rrPath(ix,iy,26,26,7);
      ctx.fillStyle=rgba(A[0],A[1],A[2],hi?0.22:0.14); ctx.fill();
      ctx.strokeStyle=rgba(A[0],A[1],A[2],hi?0.75:0.38); ctx.lineWidth=1.1; ctx.stroke();
      ctx.restore();
      ctx.fillStyle=rgba(hi?255:190, hi?240:245, hi?180:255, 0.98);
      ctx.fillText(u.ico, ix+6, iy+14);
      if(lv>1){ ctx.font='800 9px ui-monospace,monospace';
        ctx.fillStyle=rgba(255,240,160,0.98); ctx.fillText(''+lv, ix+17, iy+23);
        ctx.font='700 14px system-ui,sans-serif'; }
      ix+=30;
      if(ix>300){ ix=26; iy+=32; }
    }
  }
  // 右上：分数 / 武器（玻璃仪表组）
  const w=curWeapon();
  hudGlass(W-262,12,248,112,w.col,0.72);
  ctx.textAlign='right';
  ctx.font='800 10px system-ui,sans-serif';
  ctx.fillStyle=rgba(150,210,230,0.6);
  ctx.fillText('SCORE', W-26, 25);
  ctx.font='800 26px ui-monospace,monospace';
  hudTextShadow('rgba(255,200,80,.75)',12);
  ctx.fillStyle='rgba(255,240,175,0.98)';
  ctx.fillText(String(score).padStart(6,'0'), W-26, 46);
  ctx.shadowBlur=0;
  ctx.font='700 11px system-ui,sans-serif';
  ctx.fillStyle='rgba(140,200,220,0.78)';
  ctx.fillText('击杀 '+kills+'   ·   最佳 '+store.bestScore, W-26, 64);
  ctx.fillStyle=rgba(w.col[0],w.col[1],w.col[2],0.35);
  ctx.fillRect(W-240,74,214,1);
  const wf=p.weaponFlash;
  ctx.font='800 17px system-ui,sans-serif';
  hudTextShadow(rgba(w.col[0],w.col[1],w.col[2],.8),10);
  ctx.fillStyle=rgba(w.col[0],w.col[1],w.col[2], 0.98);
  ctx.fillText(w.ico+' '+w.name, W-26, 92+(wf>0?wf*2:0));
  ctx.shadowBlur=0;
  ctx.font='700 10px ui-monospace,monospace';
  ctx.fillStyle=rgba(w.col[0],w.col[1],w.col[2], 0.62);
  ctx.fillText(w.tag+'   [E] 换枪', W-26, 110);
  if(p.unlocked.filter(Boolean).length>1){
    ctx.fillStyle=rgba(150,210,235,0.55);
    ctx.font='700 10px system-ui,sans-serif';
    ctx.fillText('已解锁 '+p.unlocked.filter(Boolean).length+'/'+WEAPONS.length, W-26, 118);
  }
  /* 画质档位 + 实际逻辑帧率：只在"不是满配"时提示，
     满配（高画质 + 185Hz）不打扰视线；高刷生效时让用户看得到收益 */
  const notFull = QUALITY.lv<2 || REFRESH.logicHz>60 || !REFRESH.detected;
  if(notFull){
    ctx.fillStyle='rgba(140,200,220,0.45)';
    ctx.font='700 11px system-ui,sans-serif';
    ctx.fillText(hzLabel(), W-26, 138);
  }
  // 波次横幅
  if(bannerT>0){
    const t=bannerT/2.2;
    const a = t>0.75 ? (1-t)/0.25 : Math.min(1, t/0.25);
    const slide=(1-t)*30;
    const ty=H*0.30+slide;
    ctx.textAlign='center';
    /* 上下两条能量线：把一行大字变成"过场字幕" */
    ctx.save();
    const lg=ctx.createLinearGradient(W/2-230,0,W/2+230,0);
    lg.addColorStop(0,'rgba(90,235,255,0)');
    lg.addColorStop(0.5,rgba(120,245,255,0.75*a));
    lg.addColorStop(1,'rgba(190,130,255,0)');
    ctx.fillStyle=lg;
    ctx.fillRect(W/2-230,ty-34,460,2);
    ctx.fillRect(W/2-230,ty+58,460,2);
    ctx.restore();
    ctx.font='800 48px system-ui,sans-serif';
    hudTextShadow('rgba(0,220,255,.85)',22);
    ctx.fillStyle='rgba(175,250,255,'+(a*0.98)+')';
    ctx.fillText('WAVE '+bannerWave, W/2, ty);
    ctx.shadowBlur=0;
    ctx.font='700 14px system-ui,sans-serif';
    ctx.fillStyle='rgba(130,205,235,'+(a*0.85)+')';
    const sub = bannerWave%5===0 ? '首领接近 · ELITE INCOMING'
      : bannerWave===1 ? '生存下去 · SURVIVE'
      : '敌人强化 · '+Math.round((1+bannerWave*0.12)*100)+'% 生命 / '+Math.round((1+bannerWave*0.07)*100)+'% 伤害';
    ctx.fillText(sub, W/2, ty+38);
    ctx.fillStyle=rgba(120,240,255,a*0.8);
    ctx.fillRect(W/2-52,ty+50,104,1.5);
  }
  // Boss 血条：大型玻璃仪表 + 三阶段刻度 + 难度/过载标识
  if(boss&&boss.alive&&boss.dying<=0){
    const bw=560, bx=(W-bw)/2, by=H-46;
    const bc=boss.col, over=boss.over, D=DF();
    const A=over?[255,100,70]:bc;
    hudGlass(bx-18,by-44,bw+36,66,A,0.82);
    if(over){
      ctx.save(); rrPath(bx-18,by-44,bw+36,66,11);
      ctx.strokeStyle=rgba(255,90,60,0.35+0.40*(0.5+0.5*Math.sin(time*8)));
      ctx.lineWidth=2.2; ctx.stroke(); ctx.restore();
    }
    // 左：徽记 + 名称
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.font='800 14px system-ui,sans-serif';
    hudTextShadow(rgba(A[0],A[1],A[2],.8),12);
    ctx.fillStyle=rgba(A[0],A[1],A[2],0.98);
    ctx.fillText('◆ '+boss.name, bx-4, by-27);
    ctx.shadowBlur=0;
    // 右：阶段 / 血量 / 难度
    ctx.textAlign='right';
    ctx.font='800 12px ui-monospace,monospace';
    ctx.fillStyle=rgba(255,240,220,0.92);
    ctx.fillText(Math.ceil(boss.hp)+' / '+boss.maxHp+'   ·   '+Math.round(boss.hp/boss.maxHp*100)+'%',
      bx+bw+4, by-27);
    ctx.font='700 10px system-ui,sans-serif';
    ctx.fillStyle=rgba(D.col[0],D.col[1],D.col[2],0.85);
    ctx.fillText('PHASE '+boss.phase+'/3   ·   '+D.ico+' '+D.label+
      (over?'   ·   ⚠ 核心过载':''), bx+bw+4, by-11);
    // 血条
    glowBar(bx,by,bw,14, boss.hp/boss.maxHp,
      over?'rgba(255,90,60,0.95)':rgba(bc[0],bc[1],bc[2],0.95),
      over?'rgba(255,200,120,0.95)':'rgba(255,255,255,0.92)', A);
    /* 阶段分界刻度：0.62 / 0.30 两处，让玩家读出"还有几阶段" */
    ctx.save();
    ctx.strokeStyle=rgba(255,255,255,0.55); ctx.lineWidth=1.5;
    for(const f of [0.30,0.62]){
      const xx=bx+bw*f;
      ctx.beginPath(); ctx.moveTo(xx,by-3); ctx.lineTo(xx,by+17); ctx.stroke();
    }
    ctx.restore();
    // 阶段圆点
    ctx.textAlign='center';
    for(let i=0;i<3;i++){
      const on=boss.phase>=i+1;
      ctx.beginPath();
      ctx.fillStyle=on?rgba(A[0],A[1],A[2],0.95):'rgba(255,255,255,0.25)';
      ctx.arc(W/2-16+i*16, by+20, 3, 0, TAU); ctx.fill();
    }
  }
  // 准星
  if(hasMouse && state===ST.PLAYING){
    ctx.globalCompositeOperation='lighter';
    const x=aimX,y=aimY, spin=time*0.9;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(spin);
    ctx.strokeStyle='rgba(120,250,255,0.28)'; ctx.lineWidth=1.2;
    ctx.setLineDash([4,7]);
    ctx.beginPath(); ctx.arc(0,0,17,0,TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    ctx.strokeStyle='rgba(150,252,255,0.85)'; ctx.lineWidth=1.7;
    ctx.beginPath(); ctx.arc(x,y,10,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-20,y);ctx.lineTo(x-6,y); ctx.moveTo(x+6,y);ctx.lineTo(x+20,y);
    ctx.moveTo(x,y-20);ctx.lineTo(x,y-6); ctx.moveTo(x,y+6);ctx.lineTo(x,y+20); ctx.stroke();
    ctx.fillStyle='rgba(230,255,255,0.95)';
    ctx.beginPath(); ctx.arc(x,y,1.8,0,TAU); ctx.fill();
    ctx.globalCompositeOperation='source-over';
  }
}

/* ---------- UI ---------- */
const panel=document.getElementById('panel');
function hideUI(){ panel.style.display='none'; panel.innerHTML=''; }
function showUI(html){ panel.style.display='block'; panel.innerHTML=html; bindUI(); }
function bindUI(){
  const g=id=>document.getElementById(id);
  const bs=g('btnStart'), br=g('btnResume'), brs=g('btnRestart'), bm=g('btnMenu');
  if(bs) bs.onclick=()=>{ gameMode='standard'; startGame(); };
  if(br) br.onclick=()=>togglePause();
  if(brs) brs.onclick=()=>startGame();
  if(bm) bm.onclick=()=>{ state=ST.MENU; refreshMenu(); };
  const bsa=g('btnSound'); if(bsa) bsa.onclick=()=>{ store.muted=!store.muted;
    if(Audio_.master) Audio_.master.gain.value=store.muted?0:store.volume; saveStore(); refreshMenu(); refreshPause(); };
  const bsh=g('btnShake'); if(bsh) bsh.onclick=()=>{ store.shake=store.shake>0.5?0.35:(store.shake>0.05?0:1);
    saveStore(); refreshMenu(); refreshPause(); };
  const bq=g('btnQual'); if(bq) bq.onclick=()=>{
    if(QUALITY.locked){ QUALITY.locked=false; }
    else { QUALITY.locked=true; QUALITY.lv=QUALITY.lv>0?QUALITY.lv-1:2; applyQuality(); }
    store.qualLock=QUALITY.locked; store.qualLv=QUALITY.lv;
    saveStore(); refreshMenu(); refreshPause(); };
  const bf=g('btnFull'); if(bf) bf.onclick=()=>{ toggleFullscreen(); refreshMenu(); refreshPause(); };
  const bh=g('btnHz'); if(bh) bh.onclick=()=>{
    /* 手动在"自动 / 锁 185 / 锁 120 / 锁 60"之间切换 */
    if(REFRESH.manual){ REFRESH.manual=false; store.hzManual=false; saveStore(); }
    else{
      REFRESH.manual=true;
      const cur=REFRESH.logicHz;
      REFRESH.manualHz = cur>=185?120 : cur>=120?60 : 185;
      setLogicHz(Math.min(REFRESH.manualHz, HZ_CAP_DEVICE));
      store.hzManual=true; store.hzManualHz=REFRESH.manualHz;
      saveStore();
    }
    refreshMenu(); refreshPause();
  };
  const cards=panel.querySelectorAll('.card');
  cards.forEach(c=>{ c.onclick=()=>applyUpgrade(cardChoices[+c.dataset.i]); });
  /* 排行榜 / 驾驶员代号 */
  const bl=g('btnLb');
  if(bl) bl.onclick=()=>showLeaderboard(state===ST.OVER?'over':'menu');
  const ni=g('lbNameInput');
  if(ni){
    /* 输入框里打字不能被全局键盘监听吃掉（WASD 移动 / Enter 开局 / 空格射击） */
    ni.onkeydown=e=>{ e.stopPropagation(); if(e.key==='Enter') ni.blur(); };
    ni.onchange=()=>{ store.playerName=cleanLbName(ni.value); saveStore(); };
    ni.onblur=()=>{ store.playerName=cleanLbName(ni.value); saveStore(); };
  }
  const ns=g('btnLbSave');
  if(ns) ns.onclick=()=>{
    const n=g('lbNameInput');
    store.playerName=cleanLbName(n?n.value:'');
    saveStore(); showToast('代号已保存：'+lbName());
  };
}
/* 轻量提示：微信 X5 / iOS WKWebView 不支持 Fullscreen API 时给个明确反馈，
   否则点"全屏"毫无反应，玩家会以为按钮坏了 */
function showToast(msg){
  let el=document.getElementById('ndToast');
  if(!el){
    el=document.createElement('div'); el.id='ndToast';
    document.body.appendChild(el);
  }
  el.textContent=msg; el.style.opacity='1';
  /* 侧显时提示条也跟着转，否则玩家横握手机时文字是侧躺的 */
  el.style.transform = rotated ? 'translateX(-50%) rotate(90deg)' : '';
  if(typeof clearTimeout==='function') clearTimeout(showToast._t);
  if(typeof setTimeout==='function')
    showToast._t=setTimeout(()=>{ el.style.opacity='0'; },1900);
}
function toggleFullscreen(){
  const el=document.documentElement;
  const enter=el.requestFullscreen||el.webkitRequestFullscreen;
  const exit=document.exitFullscreen||document.webkitExitFullscreen;
  if(!enter||!exit){ showToast('当前浏览器不支持全屏 · 横屏即可获得完整视野'); return; }
  try{
    if(!document.fullscreenElement && !document.webkitFullscreenElement) enter.call(el);
    else exit.call(document);
  }catch(e){ showToast('全屏不可用 · 请横屏游玩'); }
}
function togglePause(){
  if(state===ST.PLAYING){ state=ST.PAUSED; refreshPause(); }
  else if(state===ST.PAUSED){ state=ST.PLAYING; hideUI(); acc=0; last=now();
    /* 暂停期间 update() 不跑，hitStop 不会衰减；不清会让恢复瞬间顿一下 */
    hitStop=0; }
}

  if(sc>=12000) return {r:'S', t:'LEGEND'};

  if(sc>=800)   return {r:'C', t:'PILOT'};
  return {r:'D', t:'ROOKIE'};
}

      <div class="stat"><span>最高连杀</span><b>x${comboBest}</b></div>
      <div class="stat"><span>历史最佳</span><b>${store.bestScore}</b></div>
    </div>
    ${win?'<div class="hint" style="color:#a8ffd8">✓ 极限挑战达成</div>':''}
    ${nb?'<div class="hint" style="color:#9ff6ff">★ 新纪录 ★</div>':''}
    <div id="lbStatus" class="lbStatus">${lbStatusHTML()}</div>
    <div style="margin-top:10px">
      <button id="btnRestart">再 来 一 局</button>
      <button class="ghost" id="btnMenu">返回菜单</button>
      <button class="ghost" id="btnLb">🏆 排 行 榜</button>
    </div>
    <div class="hint">回车 / R 重新开始</div>
  `);
}


/* ============================================================
   排行榜：Cloudflare Pages Functions + D1
   · 每次结算立即记录，不依赖 700ms 后是否弹出结算面板
   · 线上成功 → 显示全站名次；失败 → 静默降级为本机记录
   · 本地 file:// 打开时 fetch 必然失败，游戏本体完全不受影响
   ============================================================ */
const LB_API='/api/scores', LB_VER='10.2';
let runId='', lastRun=null, lbOpen=false;
let lbProbeDone=false, lbOnline=null, lbReqToken=0;
let lbFilter={mode:'all',diff:'all'}, lbReturn='menu';

function newRunId(){
  return 'r'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
}
function escHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function cleanLbName(v){
  return String(v||'')
    .replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e]/g,'')
    .replace(/[<>]/g,'')
    .replace(/\s+/g,' ').trim().slice(0,14);
}
function lbName(){ return cleanLbName(store.playerName) || '匿名驾驶员'; }
function lbSaveLocal(rec){
  try{
    if(!Array.isArray(store.lbLocal)) store.lbLocal=[];
    store.lbLocal.unshift(rec);
    if(store.lbLocal.length>30) store.lbLocal.length=30;
    saveStore();
  }catch(e){}
}
function lbFetch(url,opt){
  opt=opt||{};
  if(typeof fetch!=='function') return Promise.reject(new Error('NO_FETCH'));
  const ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
  const timer=setTimeout(()=>{ try{ ctrl&&ctrl.abort(); }catch(e){} },5000);
  const o={method:opt.method||'GET',cache:'no-store',
           headers:{'Content-Type':'application/json'}};
  if(ctrl) o.signal=ctrl.signal;
  if(opt.body) o.body=JSON.stringify(opt.body);
  return fetch(url,o).then(r=>{
    clearTimeout(timer);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).catch(e=>{ clearTimeout(timer); throw e; });
}
function lbStatusHTML(){
  if(!lastRun) return '';
  const s=lastRun.status;
  if(s==='pending') return '<span class="lbSpin"></span>正在上传本局成绩…';
  if(s==='ok') return '<span class="ok">↑ 已上榜 · 全站第 <b>'+lastRun.rank+'</b> 名'+
    (lastRun.total?' <span style="opacity:.7">/ 共 '+lastRun.total+' 条记录</span>':'')+'</span>';
  if(s==='rejected') return '<span class="offline">成绩未被服务器接受（'+
    escHtml(lastRun.err)+'）· 已存本机</span>';
  return '<span class="offline">离线模式 · 成绩已保存在本机</span>';
}
function lbUpdateStatus(){
  const el=document.getElementById('lbStatus');
  if(el) el.innerHTML=lbStatusHTML();
}
/* 每次游玩后调用：先写本机（保证"每次都记录"），再尝试提交线上 */
function recordRun(){
  const rec={
    gameId:runId||newRunId(),
    name:lbName(),
    score:Math.round(score),
    seconds:Math.round(time*100)/100,
    wave:wave, kills:kills, level:player.level, combo:comboBest,
    mode:gameMode, difficulty:store.difficulty||'standard',
    rank:rankOf(score).r, ver:LB_VER,
    clear:!!quickClear, at:Date.now()
  };
  lastRun={rec:rec,status:'pending',rank:null,total:null,err:null};
  lbSaveLocal(rec);
  lbUpdateStatus();
  lbFetch(LB_API,{method:'POST',body:rec}).then(d=>{
    if(!lastRun||lastRun.rec.gameId!==rec.gameId) return;   // 已开新局，丢弃旧响应
    if(d&&d.ok){
      lastRun.status='ok'; lastRun.rank=d.rank; lastRun.total=d.total;
      store.lbLastRank=d.rank; saveStore(); lbOnline=true;
    }else{ lastRun.status='rejected'; lastRun.err=(d&&d.error)||'REJECTED'; }
    lbUpdateStatus();
  }).catch(e=>{
    if(!lastRun||lastRun.rec.gameId!==rec.gameId) return;
    lastRun.status='offline'; lastRun.err=String(e.message||e);
    lbUpdateStatus();
  });
}
/* 菜单只探测一次连通性，用来显示"已连接 / 本机模式" */
function lbProbe(){
  if(lbProbeDone||typeof fetch!=='function') return;
  lbProbeDone=true;
  const set=t=>{ const el=document.getElementById('lbNet');
    if(el) el.innerHTML='排行榜 <b>'+t+'</b>'; };
  lbFetch(LB_API+'?health=1').then(d=>{
    lbOnline=!!(d&&d.ok); set(lbOnline?'已连接':'未连接');
  }).catch(()=>{ lbOnline=false; set('本机模式'); });
}
const LB_MODE_LABEL={standard:'标准',quick:'速通'};
const LB_DIFF_LABEL={casual:'休闲',standard:'标准',hard:'硬核'};
function lbFilterBtns(){
  const row=(key,list,labels)=>list.map(v=>
    '<button class="ghost'+(lbFilter[key]===v?' on':'')+'" data-lbk="'+key+
    '" data-lbv="'+v+'">'+(labels[v]||v)+'</button>').join('');
  return '<div class="lbFilter">'+row('mode',['all','standard','quick'],
      {all:'全部模式',standard:'标准',quick:'速通'})+
    row('diff',['all','casual','standard','hard'],
      {all:'全部难度',casual:'休闲',standard:'标准',hard:'硬核'})+'</div>';
}
function lbLocalRows(){
  const arr=(Array.isArray(store.lbLocal)?store.lbLocal:[]).slice()
    .sort((a,b)=>b.score-a.score).slice(0,20);
  return arr.map((it,i)=>({name:it.name,score:it.score,seconds:it.seconds,
    wave:it.wave,kills:it.kills,level:it.level,combo:it.combo,
    mode:it.mode,difficulty:it.difficulty,rank:it.rank,created_at:Math.floor((it.at||0)/1000),
    _local:true}));
}
function lbRowsHTML(items,filter){
  const name=lbName();
  const list=(items||[]).filter(it=>{
    if(filter.mode!=='all'&&it.mode!==filter.mode) return false;
    if(filter.diff!=='all'&&it.difficulty!==filter.diff) return false;
    return true;
  });
  if(!list.length) return '<div class="lbEmpty">暂无记录 —— 打完一局就会出现在表上</div>';
  return '<div class="lbWrap"><table class="lb"><thead><tr>'+
    '<th>#</th><th>驾驶员</th><th>分数</th><th>存活</th><th>波次</th>'+
    '<th>模式 / 难度</th><th class="lv">击杀</th><th class="dt">日期</th>'+
    '</tr></thead><tbody>'+list.map((it,i)=>{
      const me=it.name===name?' class="me"':'';
      const tags='<span class="lbTag'+(it.mode==='quick'?' quick':'')+'">'+
        escHtml(LB_MODE_LABEL[it.mode]||it.mode)+'</span> '+
        '<span class="lbTag'+(it.difficulty==='hard'?' hard':'')+'">'+
        escHtml(LB_DIFF_LABEL[it.difficulty]||it.difficulty)+'</span>';
      let dt='—';
      if(it.created_at){
        const d=new Date(it.created_at*1000);
        dt=String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
      }
      return '<tr'+me+'><td class="rk">'+(i+1)+'</td><td>'+escHtml(it.name)+'</td>'+
        '<td class="sc">'+Math.round(it.score)+'</td><td>'+fmtTime(it.seconds||0)+'</td>'+
        '<td>'+(it.wave||1)+'</td><td>'+tags+'</td><td class="lv">'+(it.kills||0)+'</td>'+
        '<td class="dt">'+dt+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}
function renderLb(d,err){
  const body=document.getElementById('lbBody');
  const sub=document.getElementById('lbSub');
  if(!body) return;
  if(d&&d.ok){
    /* 以客户端当前筛选再过滤一次：万一 CDN / 服务端返回了旧筛选的数据，
       也不会把不匹配的行显示出来（切换筛选时尤其明显） */
    const f=lbFilter;
    body.innerHTML=lbRowsHTML(d.items,f)+
      '<div class="lbNote">共 '+d.total+' 条记录 · 显示前 '+((d.items||[]).length)+' 名'+
      (d.myRank?' · 你的最佳名次 <b style="color:#a8f6ff">#'+d.myRank+'</b>':'')+
      '　<button class="ghost mini" id="btnLbRefresh">↻ 刷新</button></div>';
    if(sub) sub.textContent='在线排行榜 · 分数降序，同分按存活时长排序';
  }else{
    body.innerHTML=lbRowsHTML(lbLocalRows(),lbFilter)+
      '<div class="lbNote">未连接排行榜服务 · 当前显示本机最近 20 局'+
      '　<button class="ghost mini" id="btnLbRefresh">↻ 重试</button></div>';
    if(sub) sub.textContent='本机模式（部署到 Cloudflare Pages 后自动上线）';
    if(err) lbOnline=false;
  }
  const rf=document.getElementById('btnLbRefresh');
  if(rf) rf.onclick=()=>showLeaderboard(lbReturn);
}
function showLeaderboard(from){
  lbReturn=from||'menu';
  lbOpen=true;
  const token=++lbReqToken;
  showUI(`
    <div class="sectionCap">GLOBAL RANKING</div>
    <h1 style="font-size:28px;letter-spacing:.16em;margin-top:6px">🏆 排 行 榜</h1>
    <div class="energyLine"></div>
    <p class="sub" id="lbSub" style="margin-top:10px">正在读取…</p>
    ${lbFilterBtns()}
    <div id="lbBody"><div class="lbEmpty"><span class="lbSpin"></span> 读取中…</div></div>
    <div style="margin-top:6px">
      <button class="ghost" id="btnLbBack">返 回</button>
    </div>
    <div class="hint">每次结算自动上传 · 代号在菜单里修改</div>
  `);
  const back=document.getElementById('btnLbBack');
  if(back) back.onclick=()=>{
    lbOpen=false;
    if(lbReturn==='over'&&state===ST.OVER) showGameOver(); else refreshMenu();
  };
  panel.querySelectorAll('[data-lbk]').forEach(b=>{
    b.onclick=()=>{ lbFilter[b.dataset.lbk]=b.dataset.lbv; showLeaderboard(lbReturn); };
  });
  lbFetch(LB_API+'?mode='+lbFilter.mode+'&diff='+lbFilter.diff+
          '&limit=50&name='+encodeURIComponent(lbName())).then(d=>{
    if(token!==lbReqToken) return;      // 快速切筛选时丢弃旧响应
    lbOnline=true; renderLb(d,null);
  }).catch(e=>{
    if(token!==lbReqToken) return;
    lbOnline=false; renderLb(null,e);
  });
}

/* ---------- 主循环 ---------- */
let acc=0, last=now(), raf=0, prevFrameT=now(), menuAccum=0, menuPhase=0;
function commitResize(){
  pendingResize=false;
  lastResizeKey='';
  resize(true);
}
function frame(t){
  raf=requestAnimationFrame(frame);
  const nowS=t/1000;
  const t0=performance.now();          // 工作耗时起点

  /* 所有画布尺寸写入都集中在帧首；事件只打标记，避免回调中清画布或与绘制竞争。 */
  if(pendingResize) commitResize();
  pollViewport();                      // 兜底：捕捉微信等丢失的转屏/视口变化
  probeRefresh(t);                     // 前 48 帧探测屏幕刷新率

  // 只在真实掉帧时采样（切后台/暂停后的长间隔不算）
  const realMs=(nowS-prevFrameT)*1000; prevFrameT=nowS;

  let el=nowS-last; last=nowS;
  if(el>MAX_FRAME) el=MAX_FRAME;
  acc+=el;
  let steps=0;
  const dt=FIXED_DT;
  while(acc>=dt && steps<MAX_STEPS){
    curDt=dt;
    if(state===ST.PLAYING){ update(dt); }
    else if(state===ST.MENU){
      /* 菜单只保留可见装饰节奏，降到 30Hz；玩法开始时仍从干净状态重置。 */
      menuAccum+=dt;
      while(menuAccum>=1/30){
        menuAccum-=1/30; menuPhase+=1/30;
        updateParticles(1/30); updateDebris(1/30);
      }
      shake=Math.max(0,shake-dt*46);
      flashScreen=Math.max(0,flashScreen-dt*2.6);
      camKickX*=0.9; camKickY*=0.9;
    }
    else { updateParticles(dt); updateDebris(dt);
           shake=Math.max(0,shake-dt*46);
           flashScreen=Math.max(0,flashScreen-dt*2.6);
           camKickX*=0.9; camKickY*=0.9; }
    acc-=dt; steps++;
  }
  if(steps===MAX_STEPS) acc=0;
  render();

  if(realMs>0 && realMs<200) perfSample(performance.now()-t0, realMs);
  firstFrameDone=true;
}
addEventListener('visibilitychange',()=>{
  if(document.hidden){
    if(state===ST.PLAYING) { state=ST.PAUSED; refreshPause(); }
    if(Audio_.ctx && Audio_.ctx.state==='running') Audio_.ctx.suspend();
  } else {
    last=now(); acc=0;
    if(Audio_.ctx && Audio_.ctx.state==='suspended' && !store.muted) Audio_.ctx.resume();
  }
});

/* ---------- 启动 ---------- */
buildBg(); buildVignette();
/* 移动端起步用"中"画质：多数手机 GPU 在满屏辉光下撑不住 60fps 起步，
   自适应会在跑稳后把它升回高，比一开始卡一下再降下来体验更好 */
if(store.qualLock){ QUALITY.locked=true; QUALITY.lv=clamp(store.qualLv|0,0,2); }
else if(MOBILE_LIKE && QUALITY.lv>1){ QUALITY.lv=1; }
applyQuality(); resize();
player=newPlayer();
refreshMenu();
raf=requestAnimationFrame(frame);

// 菜单背景缓慢飘动的装饰粒子：降低稳态数量与生成频率，首屏不再与页面呈现争资源
setInterval(()=>{
  if(firstFrameDone && state===ST.MENU && pCount<210 && !document.hidden){
    emit(rnd(0,W),rnd(0,H),1,{raw:true,smin:6,smax:26,lmin:1.6,lmax:3.4,sizmin:0.8,sizmax:2.1,
      col:[90,200,255],drag:0.15});
  }
},180);

})();
</script>
